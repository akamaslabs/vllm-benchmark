apiVersion: v1
kind: Namespace
metadata: {name: kv-offload-spike}
---
apiVersion: v1
kind: Service
metadata: {name: vllm, namespace: kv-offload-spike, labels: {app: vllm}}
spec:
  selector: {app: vllm}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm, namespace: kv-offload-spike}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: vllm}}
  template:
    metadata: {labels: {app: vllm}}
    spec:
      enableServiceLinks: false
      nodeSelector: {node-role: llm-serving-g7-kv}
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.29.0
        args:
        - "--model=Qwen/Qwen3-8B-FP8"
        - "--served-model-name=qwen3-8b"
        - "--port=8000"
        - "--host=0.0.0.0"
        - "--max-model-len=16384"
        - "--enable-prefix-caching"
        - "--gpu-memory-utilization=0.90"
        - "--max-num-seqs=128"
        - "--kv-offloading-size=24"
        - "--kv-offloading-backend=native"
        env:
        - {name: HF_HOME, value: /hf-cache}
        ports: [{name: http, containerPort: 8000}]
        resources:
          requests: {cpu: "10", memory: 44Gi, nvidia.com/gpu: 1}
          limits: {cpu: "10", memory: 44Gi, nvidia.com/gpu: 1}
        volumeMounts:
        - {name: hf-cache, mountPath: /hf-cache}
        - {name: shm, mountPath: /dev/shm}
        startupProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 10, failureThreshold: 120}
      volumes:
      - {name: hf-cache, hostPath: {path: /var/lib/hf-cache-kvspike, type: DirectoryOrCreate}}
      - {name: shm, emptyDir: {medium: Memory, sizeLimit: 26Gi}}
