# GLM-5.3-Flash phase 0: the community container NVIDIA's model card names for
# nvidia/GLM-5.3-Flash-FP4-Local on 2x RTX PRO 6000, with its documented preset (the card's
# "simplified run command": PRESET=glm53-tp2, PORT=8000, HF cache at /root/.cache/huggingface,
# runtime cache at /cache). Upstream v0.34.0 cannot load this checkpoint (README, runs 1-3).
# Reach it with: kubectl -n glm53 port-forward pod/glm53-community 8000:8000
apiVersion: v1
kind: Pod
metadata:
  name: glm53-community
  namespace: glm53
  labels: {app: glm53, variant: community}
spec:
  restartPolicy: Never
  # Third-party image: no Kubernetes API token in the pod, not privileged, no secrets mounted.
  automountServiceAccountToken: false
  nodeSelector: {node-role: llm-serving-g7e-12xl}
  tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
  containers:
  - name: vllm
    image: ghcr.io/local-inference-lab/vllm:release-10152026
    env:
    - {name: PRESET, value: glm53-tp2}
    - {name: PORT, value: "8000"}
    - {name: HF_HUB_OFFLINE, value: "1"}
    ports: [{name: http, containerPort: 8000}]
    resources:
      requests: {cpu: "32", memory: 160Gi}
      limits: {nvidia.com/gpu: 2, memory: 300Gi}
    volumeMounts:
    - {name: hf-cache, mountPath: /root/.cache/huggingface}
    - {name: runtime, mountPath: /cache}
    - {name: shm, mountPath: /dev/shm}
  volumes:
  - {name: hf-cache, hostPath: {path: /var/lib/hf-cache-glm53, type: Directory}}
  - {name: runtime, hostPath: {path: /var/lib/glm53-runtime, type: DirectoryOrCreate}}
  - {name: shm, emptyDir: {medium: Memory, sizeLimit: 32Gi}}
