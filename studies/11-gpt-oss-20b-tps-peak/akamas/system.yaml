kind: system
name: vLLM_Benchmark_11_GPT_OSS_20B_TPS_Peak
description: Goodput-per-GPU study for 11-gpt-oss-20b-tps-peak (openai/gpt-oss-20b, MoE 32 experts, MXFP4 weights, on 1x g6.12xlarge, 4x NVIDIA L4 24GB, vLLM 0.29.0). Same goal as 9-goodput-per-gpu — (prefill + decode token throughput) / vLLM.active_gpus under P95 TTFT/ITL SLA — same 9 components and 108-metric Prometheus telemetry; 14 tuned vLLM parameters incl. tensor/data_parallel_size in [1,4] (TP x DP <= 4, TP != 3) and enable_expert_parallel, attention backend pinned to TRITON_ATTN (the only sink-capable backend on SM 8.9). vLLM optimization pack 1.8.0 vocabulary (1.9.0 optional block), GPU pack 1.2.0, Kubernetes pack 1.8.0-dev.
