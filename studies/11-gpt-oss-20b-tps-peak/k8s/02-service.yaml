apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm-serving
  labels:
    app: vllm
spec:
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    # ADDED 2026-09-08 — kv-cache-exporter sidecar (see 01-deployment_template.yaml,
    # 04-kv-cache-exporter-configmap.yaml); scraped by monitoring/servicemonitor.yaml.
    - name: kv-exporter
      port: 9400
      targetPort: 9400
      protocol: TCP
  type: ClusterIP
