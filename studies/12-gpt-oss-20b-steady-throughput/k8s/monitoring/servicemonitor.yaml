# Tells the Prometheus operator to scrape vLLM's /metrics endpoint.
# vLLM exposes OpenAI-compatible server metrics (request count, latency
# histograms, token throughput, KV-cache utilisation, etc.) on port 8000.
#
# Apply after kube-prometheus-stack is installed (already installed cluster-wide from
# 0-explorative's provisioning if reusing vllm-bench — confirm before assuming this
# still needs a fresh install):
#   kubectl apply -f studies/9-goodput-per-gpu/k8s/monitoring/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: monitoring
  labels:
    app: vllm
spec:
  # Watch the llm-serving namespace for matching Services.
  namespaceSelector:
    matchNames:
      - llm-serving
  # Match the vLLM Service (studies/9-goodput-per-gpu/k8s/02-service.yaml) by its label.
  selector:
    matchLabels:
      app: vllm
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      scrapeTimeout: 4s
    # ADDED 2026-09-08 — kv-cache-exporter sidecar (absolute KV-cache gauges
    # vllm_kv_cache_*; see k8s/04-kv-cache-exporter-configmap.yaml). Same pod, so the
    # scraped series carry the same `pod` label as vLLM's own metrics. Re-apply this
    # ServiceMonitor after the change.
    - port: kv-exporter
      path: /metrics
      interval: 5s
      scrapeTimeout: 4s
