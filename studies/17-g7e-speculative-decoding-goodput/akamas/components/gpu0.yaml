kind: component
system: vLLM_Benchmark_17_G7e_Speculative_Decoding

name: gpu0
description: >-
  The single NVIDIA L4 (23034 MiB, Ada/SM89, ~300 GB/s, 72 W power cap) of the
  g6.4xlarge node. One Akamas component per physical GPU is this repo's convention
  (studies 13-16 model four); this node has exactly one, so gpu0 is the whole GPU
  rather than a slice of a larger set. Expect gpu_power_usage pinned near 72 W and the
  power-violation and clock-throttle counters persistently non-zero: that is a correct
  reading of a card living at its cap, not a fault.
componentType: GPU
properties:
  prometheus:
    pod: .*
    gpu: "0"
