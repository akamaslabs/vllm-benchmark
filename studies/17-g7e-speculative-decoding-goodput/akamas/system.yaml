kind: system

name: vLLM_Benchmark_17_G7e_Speculative_Decoding
description: >-
  Speculative-decoding goodput study on a single NVIDIA RTX PRO 6000 Blackwell
  (g7e.4xlarge, 96 GB GDDR7, SM120) serving Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
  with vllm/vllm-openai:v0.29.0, with Qwen/Qwen3-0.6B as the drafter for the
  draft_model cells. Started from 2-larger-model-g7e's "2-Larger-goodput" (same
  GPU, goal, SLA, windowing and 14 tuned parameters) and adds vLLM.spec_method /
  vLLM.spec_tokens. Telemetry carries 131 metrics. Requires vLLM pack 1.10.0
  (draft_model plus the five acceptance metrics), GPU 1.2.0, Kubernetes.
  Created 2026-09-21, reconfigured 2026-09-22.
