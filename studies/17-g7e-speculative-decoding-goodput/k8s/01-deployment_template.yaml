apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm-serving
spec:
  replicas: 1
  # CONFIRMED 2026-08-21 (real manual deploy): Kubernetes' default
  # progressDeadlineSeconds (600s/10min) is shorter than this Deployment's own
  # startupProbe budget (up to 20min for a ~56GB weight load) — the real rollout hit
  # "ProgressDeadlineExceeded" at ~10min while the pod was still legitimately loading
  # (not crashed; Running throughout). This status flag doesn't kill the pod, but
  # `kubectl rollout status` (used by k8s/apply_config.sh) treats it as a failure —
  # in a real Akamas experiment this would fail the "Apply config" task on an
  # otherwise-healthy, just-slow-to-start trial. Set above the startupProbe's own
  # ~20min ceiling (120 x 10s) so the two stay consistent. Not yet checked on the
  # other studies in this repo (none set this field either) — worth revisiting there
  # too if their own startup time is ever close to 10min.
  # RAISED 2026-09-21 from 1200 (20 min) to 1800 (30 min), together with the model
  # swap: study 16 served this same 29.03 GiB FP8 checkpoint and needed 30 minutes.
  # The inherited 20 minutes was sized for a 7B. Kept equal to the startupProbe's own
  # ceiling below, or one of the two fires first and the other never gets a say.
  progressDeadlineSeconds: 1800
  # Recreate terminates the old pod before creating the new one.
  # RollingUpdate (default) would deadlock here: the new pod waits for the GPU
  # held by the old pod, which won't be killed until the new pod is ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # Prevent Kubernetes from injecting service discovery env vars (e.g. VLLM_PORT=tcp://...)
      # which conflict with vLLM's own VLLM_PORT variable and cause a crash on startup.
      # See: https://docs.vllm.ai/en/stable/serving/env_vars.html
      enableServiceLinks: false

      # Pin to this study's OWN node group — NOT llm-serving, the A10G group
      # 0-explorative/1-goodput-realistic-load use. Same cluster (vllm-bench), same
      # namespace (llm-serving). This selector is what actually determines placement;
      # don't rely on the other node groups being scaled to 0.
      #
      # HARDWARE, third and final swap (2026-09-22): llm-serving-l4-single, one g6.4xlarge
      # carrying a single NVIDIA L4 (23034 MiB, Ada/SM89, ~300 GB/s, 72 W cap). The
      # history, because every step was forced rather than chosen:
      #   p5.4xlarge / 1x H100 80GB      -> no capacity in us-east-2 at provisioning
      #   g7e.4xlarge / RTX PRO 6000 96GB -> ran, then went dry for a full day
      #   g6.4xlarge / 1x L4 24GB (this) -> the only GPU class us-east-2 would hand over
      # A direct capacity probe on 2026-09-22 (infra/eks/gpu-capacity-fallback.sh probe)
      # found EVERY type above 24 GB per GPU empty in every zone — g7e, g6e/L40S and
      # g6.12xlarge alike — while g6.4xlarge was available in all three. See
      # infra/README.md for the full table.
      #
      # The study name, system name and this folder all still say "G7e". That is now a
      # misnomer and is deliberately not renamed, exactly as infra/eks/cluster.yaml
      # already admits about the node-group name: nine hardcoded paths in the workflow,
      # the toolbox checkout and the created Akamas resources all key off it.
      nodeSelector:
        node-role: llm-serving-l4-single

      # Required to schedule on the tainted GPU node (same taint key/value as the
      # A10G node group — see infra/eks/cluster.yaml).
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      containers:
        - name: vllm
          # MODEL, final choice 2026-09-22: Qwen/Qwen3-8B-FP8.
          # Fourth and last iteration. The history matters because one step was justified
          # by an argument that turned out backwards, and the last one was forced by
          # hardware rather than chosen:
          #   Qwen2.5-7B-Instruct  (inherited from study 2)  -> uses 15 of 96 GB
          #   Qwen3-30B-A3B-Instruct-2507-FP8 (2026-09-21)   -> RETRACTED, see below
          #   Qwen3-32B-FP8 (2026-09-22)                     -> dense, correct, DOES NOT FIT
          #   Qwen3-8B-FP8 (this)                             -> dense, 8.79 GiB, fits an L4
          #
          # WHY THE MoE WAS WRONG. Weight bytes read per batch-1 decode step, computed
          # from each config.json and cross-checked against HuggingFace's own reported
          # tensor totals:
          #   Qwen2.5-7B-Instruct bf16 ........... ~15.2 GB
          #   Qwen3-30B-A3B-Instruct-2507-FP8 .... ~3.35 GB   (8 of 128 experts active)
          #   Qwen3-32B-FP8 .......................~32.8 GB
          # The MoE read a QUARTER of what the 7B read, so the swap to it made the
          # verifier step ~4.5x cheaper and left LESS for speculation to amortise, the
          # opposite of the stated intent. Worse: verifying K+1 drafted tokens routes each
          # token independently, so the pass reads the UNION of the experts they touch —
          # up to min(128, 8*(K+1)) per layer, ~9x single-token expert traffic at
          # spec_tokens 8 — a cost a dense target does not pay at all. A sparse MoE is
          # close to the worst possible target for showing speculative decoding work.
          # That reasoning is unchanged and is why this model is DENSE.
          #
          # WHY 8B RATHER THAN 32B. Not preference — arithmetic. The L4 exposes 22.49 GiB
          # and Qwen3-32B-FP8 is 30.5 GiB of weights alone. Figures below are from each
          # repo's own config.json and safetensors sizes, fetched 2026-09-22, not estimated:
          #
          #   model             weights    KV/token bf16   KV/token fp8   KV left @ gmu 0.88
          #                                                                (with the drafter)
          #   Qwen3-4B-FP8      4.83 GiB      144 KiB          72 KiB        12.1 GiB
          #   Qwen3-8B-FP8      8.79 GiB      144 KiB          72 KiB         8.1 GiB
          #   Qwen3-14B-FP8    15.21 GiB      160 KiB          80 KiB         1.7 GiB
          #   Qwen3-0.6B (drafter, bf16)  1.40 GiB   112 KiB   56 KiB
          #
          # 14B is out: 1.7 GiB holds ~6.3k tokens, so the three draft_model presets fail
          # vLLM's startup KV-fit check outright — one max_model_len sequence does not fit.
          # 4B is out for the opposite reason: identical layer count and KV heads to the 8B
          # (36 / 8), so KV costs the same per token while the verify pass reads half as
          # much. The drafter's 1.40 GiB per draft step would be ~87% of a 4.83 GiB verify
          # at 3 speculative tokens — speculation would lose by construction and teach
          # nothing. 8B keeps ~8.1 GiB of KV with the drafter loaded, ~32k tokens.
          #
          # All four checkpoints share vocab_size 151936, so the Qwen/Qwen3-0.6B drafter
          # pairing survives the swap untouched — verified, not assumed.
          #
          # Cost of the choice, stated honestly: the verify pass is now 8.79 GiB rather
          # than 32.8, so the drafter costs ~48% extra weight traffic at 3 speculative
          # tokens and ~127% at 8. The draft_model arm is therefore expected to struggle,
          # and its grid is re-cut to lower draft lengths accordingly. The ngram and
          # ngram_gpu arms carry no drafter weights at all and are unaffected — if
          # anything sharper here, because the L4's ~300 GB/s pushes decode deeper into
          # the memory-bandwidth-bound regime speculation exists to exploit.
          # Comparability with studies 15/16 is gone either way (different model).
          # This is a hybrid-thinking checkpoint — see the --default-chat-template-kwargs
          # flag below, without which the benchmark measures chain-of-thought length
          # instead of ShareGPT replay. The 8B's chat template carries the same
          # enable_thinking guard as the 32B's; the flag is MANDATORY, not inherited cruft.
          # CHANGED for study 17: image moved from that study's v0.22.0 to v0.29.0 —
          # NOT a cosmetic bump, it is a precondition for this study's question:
          #   1. vLLM pack 1.9.1's reference version is 0.29.0, and spec_method's
          #      categories/semantics were read off 0.29.0's own arg_utils.py.
          #   2. The four speculative-decoding Prometheus counters this study wires
          #      (vllm:spec_decode_num_drafts_total, ..._num_draft_tokens_total,
          #      ..._num_accepted_tokens_total, ..._num_accepted_tokens_per_pos_total)
          #      are V1-engine metrics. 0.22.0 predates them; the five V0 metrics named
          #      in vLLM's own docs (spec_decode_draft_acceptance_rate,
          #      spec_decode_efficiency, spec_decode_num_accepted_tokens,
          #      ..._num_draft_tokens, ..._num_emitted_tokens) are gone in V1 —
          #      verified 2026-09-21 against vllm/v1/spec_decode/metrics.py at the
          #      v0.29.0 tag. Wiring a 0.22.0 server would give silently empty series.
          #   3. Studies 13-16 all ran 0.29.0 on L4s — this study's own card as of
          #      2026-09-22 — so the image, FP8 block-quantized Qwen3 weights, every
          #      attention backend and every kv_cache_dtype are already exercised on
          #      exactly this hardware. The SM120 kernel-maturity worry that shaped the
          #      preset grid belonged to the Blackwell and no longer applies: SM89 is
          #      the better-trodden path of the two, not the riskier one.
          # Cost: results are no longer directly comparable with 2-larger-model-g7e's
          # own numbers (different server version, not just a different config) — this
          # study re-establishes its own baseline rather than importing that study's.
          image: vllm/vllm-openai:v0.29.0
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen3-8B-FP8"
            - "--served-model-name=qwen3-8b"
            - "--port=8000"
            - "--host=0.0.0.0"
            - "--enable-mfu-metrics"
            # Carried forward from 1-goodput-realistic-load: prefix caching disabled
            # entirely for this study's traffic pattern (see that study's README,
            # "Load generator" — same ShareGPT-replay goodput methodology here).
            - "--no-enable-prefix-caching"
            # MANDATORY for this checkpoint, added 2026-09-22. Qwen3-32B is a HYBRID
            # THINKING model: its chat template only suppresses reasoning when the caller
            # passes enable_thinking=false, and the guard is
            #   {%- if enable_thinking is defined and enable_thinking is false %}
            # so UNDEFINED is not false. AIPerf sends plain OpenAI chat-completions with no
            # chat_template_kwargs, so every request would get a full <think>...</think>
            # block — the card recommends a 32768-token output budget in thinking mode.
            # The benchmark would measure chain-of-thought length, not ShareGPT replay.
            # This is the ONE server-side flag that stops the tokens being GENERATED;
            # --reasoning-parser and include_reasoning only move them out of `content`
            # while the GPU still pays for them. Request-level kwargs would override this,
            # and AIPerf sends none, so it holds for every request.
            # The previous model (Qwen3-30B-A3B-Instruct-2507) needed no such flag: its
            # chat template contains no thinking logic at all.
            - "--default-chat-template-kwargs"
            - '{"enable_thinking": false}'

            # --- Tuned (parametersSelection) — same 14 as 1-goodput-realistic-load ---
            - "--gpu-memory-utilization=${vLLM.gpu_memory_utilization}"
            - "--max-num-seqs=${vLLM.max_num_seqs}"
            - "--max-num-batched-tokens=${vLLM.max_num_batched_tokens}"
            - "--kv-cache-dtype=${vLLM.kv_cache_dtype}"
            - "--performance-mode=${vLLM.performance_mode}"
            - "--optimization-level=${vLLM.optimization_level}"
            - "--block-size=${vLLM.block_size}"
            - "--attention-backend=${vLLM.attention_backend}"
            - "--enforce-eager=${vLLM.enforce_eager}"
            - "--scheduling-policy=${vLLM.scheduling_policy}"
            - "--disable-cascade-attn=${vLLM.disable_cascade_attn}"
            - "--tokenizer-mode=${vLLM.tokenizer_mode}"
            - "--async-scheduling=${vLLM.async_scheduling}"
            - "--max-cudagraph-capture-size=${vLLM.max_cudagraph_capture_size}"

            # --- Pinned: one GPU, so every parallelism degree is 1 ---
            # NOTE the reasoning changed with the model swap. The comment here used to
            # say "dense non-MoE model", inherited from 1-goodput-realistic-load.
            # Qwen3-30B-A3B IS a Mixture-of-Experts model (128 experts, top-8), so the
            # parallelism knobs are pinned for a different reason now: there is exactly
            # one GPU, so TP = DP = PP = 1 is the only legal world and expert
            # parallelism has nothing to distribute across. That is the whole point of
            # running this model here — studies 15/16 had to shard it over 4 L4s and
            # spent themselves on topology; this study holds topology constant at 1 and
            # varies speculation instead.
            - "--tensor-parallel-size=${vLLM.tensor_parallel_size}"
            - "--pipeline-parallel-size=${vLLM.pipeline_parallel_size}"
            - "--data-parallel-size=${vLLM.data_parallel_size}"
            - "--enable-expert-parallel=${vLLM.enable_expert_parallel}"
            - "--disable-custom-all-reduce=${vLLM.disable_custom_all_reduce}"
            - "--dtype=${vLLM.dtype}"
            - "--decode-context-parallel-size=${vLLM.decode_context_parallel_size}"
            - "--prefill-context-parallel-size=${vLLM.prefill_context_parallel_size}"

            # --- Pinned (carried forward incident-avoidance pins — re-verify these
            #     still apply on Hopper/this model before trusting them, see README) ---
            - "--max-num-partial-prefills=${vLLM.max_num_partial_prefills}"
            - "--max-long-partial-prefills=${vLLM.max_long_partial_prefills}"
            - "--long-prefill-token-threshold=${vLLM.long_prefill_token_threshold}"

            # --max-model-len is a LITERAL, not a ${vLLM.*} token, and that is the whole
            # point. Added 2026-09-22 with the move to the L4.
            #
            # vLLM.max_model_len is not in the study's parametersSelection and is not in
            # any step's values, so FileConfigurator leaves the token unsubstituted
            # (the workflow sets ignoreUnsubstitutedTokens: true) and apply_config.sh's
            # `sed -i -E '/\$\{vLLM\./d'` deletes the whole line. vLLM then falls back to
            # the checkpoint's max_position_embeddings, which for every Qwen3 variant is
            # 40960. On the 96 GB card that was invisible: 40960 tokens of KV cost ~10 GiB
            # against ~50 GiB available. On an L4 it is fatal — vLLM V1 refuses to start
            # when the KV cache cannot hold one full max_model_len sequence.
            #
            # 4096 chosen. The drafter is NOT free here: vLLM 0.29.0 loads it with
            # prefix="draft_model" and its attention layers join the KV cache config, so
            # Qwen3-0.6B's 28 layers add 112 KiB/token on top of the target's 144 —
            # 256 KiB/token combined, +78%. At gpu_memory_utilization 0.95 the pool is
            # ~9.1 GiB, i.e. ~37k bf16 tokens. 4096 costs 1.0 GiB for vLLM's
            # one-request fit check (check_enough_kv_cache_memory only ever tests that a
            # SINGLE max_model_len request fits) and leaves ~9 worst-case concurrent
            # sequences; 8192 costs 2.0 GiB and leaves ~4. ShareGPT replay does not need
            # the extra ceiling. 2048 is the fallback if the measured reserve comes in
            # worse than expected.
            #
            # Watch the interaction with max_num_batched_tokens: vLLM requires
            # max_num_batched_tokens >= max_model_len unless chunked prefill is enabled
            # (SchedulerConfig.verify_max_model_len). Chunked prefill is on by default in
            # V1, which is what makes the study's [256, 8192] domain legal below 4096 —
            # if that default ever changes, the lower half of that domain becomes a hard
            # ValueError at engine init.
            - "--max-model-len=4096"

            # --- Tuned, NEW in this study: speculative decoding ---
            # These two are rendered here but are REMOVED AGAIN by apply_config.sh
            # whenever spec_method renders as "none". That is not a style choice: per
            # vLLM 0.29.0's arg_utils.py (create_speculative_config), speculative
            # decoding is off only when NONE of --speculative-config/--spec-method/
            # --spec-model/--spec-tokens is passed at all. Passing a placeholder makes
            # speculative_config a non-None dict, which then fails validation —
            # argparse rejects "none" as a choice for --spec-method, and Pydantic
            # rejects num_speculative_tokens=0 (the field --spec-tokens maps to, which
            # carries gt=0). So "off" has to be expressed by absence, and the Akamas
            # side expresses it with the pack's documented sentinel pair
            # (spec_method="none" + spec_tokens=0) plus the two parameterConstraints
            # that keep the sentinel and a real value from ever mixing.
            - "--spec-method=${vLLM.spec_method}"
            - "--spec-tokens=${vLLM.spec_tokens}"
            # The drafter for spec_method=draft_model. NOT an Akamas parameter, by the
            # same reasoning that keeps the target model out of the tuned set: its valid
            # values are paired to whichever target this study serves, so it is a study
            # constant, and the vLLM pack's README says so explicitly.
            # Qwen3-0.6B shares the Qwen3 tokenizer and its 151936-token vocabulary with
            # the target, which is what vLLM requires of a drafter
            # (SpeculativeConfig.verify_equal_vocab_size_if_draft_model). Verified against
            # both repos' config.json on 2026-09-22: 151936 on each, so the pairing
            # survived the target swap from 32B to 8B untouched.
            #
            # ITS COST IS NO LONGER NEGLIGIBLE, and this is the single most important
            # change the L4 forces on this file's reasoning. On the 96 GB card the drafter
            # was ~1.2 GB, about 1.25% of the card, and its KV was not worth counting.
            # Here: 1.11 GiB resident (tie_word_embeddings is true, so the duplicate
            # lm_head in the repo is not resident) out of 22.49 GiB. More importantly
            # vLLM 0.29.0 gives the drafter its OWN KV cache — DraftModelProposer loads it
            # with prefix="draft_model" and SpecDecodeBaseProposer.load_model() registers
            # its attention layers in the KV cache config — so its 28 layers add
            # 112 KiB/token on top of the target's 144. Enabling draft_model raises
            # per-token KV cost by 78% and roughly halves resident sequence capacity.
            # The three draft_model presets therefore run with materially less
            # concurrency headroom than the ngram ones at identical max_num_seqs. That is
            # a confound on this card that did not exist on the 96 GB one; it is called
            # out in the study manifest rather than hidden.
            #
            # Kept in BF16 rather than the existing Qwen/Qwen3-0.6B-FP8: that saves only
            # 0.41 GiB, and on SM89 cutlass_scaled_mm_supports_block_fp8() is false
            # (block-FP8 CUTLASS is gated at SM90+), so a block-quantized drafter falls
            # back to a Triton/Marlin kernel. A ~1 GiB model at small batch is
            # latency-bound, not bandwidth-bound, so the fallback plausibly makes the
            # drafter slower — the opposite of what this arm needs.
            #
            # VERIFY THAT PAIRING with a manual start before spending experiment budget.
            # apply_config.sh REMOVES this line for every method except draft_model —
            # ngram, ngram_gpu, suffix and mtp each self-assign an internal placeholder
            # that an explicit --spec-model would fight.
            - "--spec-model=Qwen/Qwen3-0.6B"
          # ADDED 2026-08-28 (explicit user decision, first constraint-discovery run):
          # DEBUG logging so the engine's actual resolved config (incl. computed
          # defaults for unrendered parameters, e.g. max_num_seqs when left to vLLM's
          # own choice at baseline) shows up in the pod's own logs instead of staying
          # opaque — see the earlier back-and-forth in this study's history about not
          # being able to confirm the live baseline's resolved max_num_seqs value any
          # other way. Comment out / remove to go back to default (INFO) verbosity.
          env:
            - name: VLLM_LOGGING_LEVEL
              value: DEBUG
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # Sized for the NODE, not the model — the right instinct, but the node changed.
          # History: 200Gi on p5.4xlarge (256 GiB RAM), lowered to 100Gi for g7e.4xlarge
          # (128 GiB). On g6.4xlarge there are 64 GiB total and ~57 GiB allocatable, so a
          # 100Gi limit exceeded the machine itself. That is not merely untidy: a cgroup
          # limit above physical RAM never binds, so a runaway vLLM triggers node-level
          # OOM or kubelet eviction — which can take the DCGM exporter or the device
          # plugin down with it — instead of a clean, attributable OOMKilled on this
          # container. Lowered to 48Gi on 2026-09-22.
          #
          # CPU is unchanged and deliberately so: g7e.4xlarge and g6.4xlarge are both
          # 16 vCPU, ~15.9 allocatable, so the 8-core request and 14-core limit carry over
          # exactly. The request of 32Gi also carries over — generous for an 8.79 GiB
          # checkpoint, but it is what reserves host RAM for weight loading and the
          # tokenizer pool, and it fits.
          #
          # Only `requests` are scheduled against, which is why the old 100Gi limit would
          # have scheduled fine and failed later. Verified 2026-09-22 against the live
          # node: 15890m CPU and 60397384Ki memory allocatable.
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "32Gi"
            limits:
              nvidia.com/gpu: "1"
              cpu: "14"
              memory: "48Gi"

          # startupProbe allows up to 20 minutes (120 x 10s) — generous relative to
          # 1-goodput-realistic-load's 10-minute budget for the same model, left as-is
          # (no downside to the longer ceiling now that the model is smaller again).
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 180   # 180 x 10 s = 30 min, matching progressDeadlineSeconds
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 60
            failureThreshold: 3

          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /root/.cache/huggingface

      volumes:
        # vLLM uses shared memory for CUDA IPC handles between workers. With
        # tensor-parallel-size pinned at 1 there is exactly one worker and therefore no
        # cross-worker IPC to carry, so 12Gi was reserving a quarter of the container's
        # whole memory limit for something unused. A `medium: Memory` emptyDir is tmpfs:
        # it counts against both the container limit and node RAM, which matters far more
        # on a 64 GiB node than it did on a 128 GiB one. Lowered to 2Gi on 2026-09-22.
        # Raise it again if this study ever un-pins the parallelism knobs.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
