kind: study
name: 19-L4-PD-Disaggregation-TPS-Per-GPU-Rerun
description: >-
  Rerun of study 18 with the router counting tokens as they stream (study 18 counted a
  request's tokens only when it ended, which made the scored throughput noisy).
  Prefill/decode disaggregation (vLLM 0.29.0, NixlConnector, host-staged KV) against
  aggregated serving of Qwen/Qwen3-8B-FP8 on one g6.12xlarge (4x L4, PCIe only, no P2P),
  under a synthetic prefill-heavy load (4096 in / 256 out, 6 concurrency levels x 10 min).
  10 presets (2-GPU aggregated controls, 1P1D variants, 2P1D, 4-GPU aggregated vs 2P2D and
  3P1D), then 100 optimizer experiments over topology and per-role vLLM settings. Goal:
  deployment-wide token throughput per active GPU, TTFT and ITL measured at the router.
system: vLLM_Benchmark_19_L4_PD_Disaggregation
workflow: 19-L4-PD-Disaggregation-Workflow

# Same goal shape as studies 9-16 (tokens/s per GPU actually holding weights), so 2-GPU and
# 4-GPU presets compare fairly. Every term reads from pd_topology, i.e. the router: tokens
# delivered to clients (counted once from vLLM's usage block) and client-side TTFT/ITL. The
# per-instance numbers are not used here, because engine-side TTFT under-reports and
# engine-side prompt tokens double-count once prefill runs elsewhere.
# SLA calibrated at the 2026-09-24 smoke test (60 s levels, 2 GPUs). On L4 one 4096-token
# prefill alone costs ~1.5 s (no native FP8 compute, so it runs as bf16). The aggregated
# baseline has TTFT p90 3.2 s already at concurrency 4. So TTFT p95 <= 5000 ms leaves room
# for a real queue without being violated by construction. ITL p95 <= 75 ms is where the
# aggregated baseline starts to give way (ITL p99 74 ms at concurrency 8, 100 ms at 12)
# while 1P1D stayed at 53-67 ms. Tail ITL is the one thing vLLM's docs say disaggregation
# improves.
goal:
  objective: maximize
  function:
    formula: (pd_topology.prefill_token_throughput + pd_topology.decode_token_throughput) / pd_topology.active_gpus
    unit: tokens per second/gpus
  constraints:
    absolute:
      - name: TTFT P95 SLA at the router
        formula: pd_topology.time_to_first_token_p95 <= 5000
      - name: ITL P95 SLA at the router
        formula: pd_topology.inter_token_latency_p95 <= 75

# As studies 6-16: the most stable 6-sample window at the prefill-throughput peak. The
# per-level picture (where each topology stops meeting the SLA) is read afterwards from
# AIPerf's per-level results and Prometheus, not from this single window.
windowing:
  type: stability
  stability:
    metric: pd_topology.prefill_token_throughput
    width: 6
    maxStdDev: 300000000
    when:
      metric: pd_topology.prefill_token_throughput
      is: max

numberOfTrials: 1

# Declared explicitly (the default would be "all"): the 12 parameters the presets set and
# the optimizer searches.
# Domains are subsets of the vLLM pack 1.11.0 domains, sized to this node.
parametersSelection:
  - name: pd_topology.pd_prefill_instances
    domain: [0, 3]
  - name: pd_topology.pd_decode_instances
    domain: [1, 4]
  - name: pd_topology.pd_kv_connector
    categories: ["NixlConnector", "NixlPushConnector"]
  - name: pd_topology.pd_kv_buffer_device
    categories: ["cuda", "cpu"]
  - name: vllm_prefill.gpu_memory_utilization
    domain: [0.8, 0.92]
  - name: vllm_prefill.max_num_seqs
    domain: [8, 512]
  - name: vllm_prefill.max_num_batched_tokens
    domain: [512, 16384]
  - name: vllm_prefill.kv_cache_dtype
    categories: ["auto", "fp8"]
  - name: vllm_decode.gpu_memory_utilization
    domain: [0.8, 0.92]
  - name: vllm_decode.max_num_seqs
    domain: [8, 512]
  - name: vllm_decode.max_num_batched_tokens
    domain: [512, 16384]
  - name: vllm_decode.kv_cache_dtype
    categories: ["auto", "fp8"]

parameterConstraints:
  - name: one GPU per instance, 4 L4s in the pod
    formula: pd_topology.pd_prefill_instances + pd_topology.pd_decode_instances <= 4
  - name: prefill batch budget covers its sequence cap
    formula: vllm_prefill.max_num_batched_tokens >= vllm_prefill.max_num_seqs
  - name: decode batch budget covers its sequence cap
    formula: vllm_decode.max_num_batched_tokens >= vllm_decode.max_num_seqs
  # Pinned by the 2026-09-24 smoke test, so the optimizer does not spend 1-hour experiments
  # on them. kv_buffer_device=cuda costs ~1.4 s per 564 MB transfer on this node against
  # ~0.06 s for cpu: there is no GPU P2P here (nvidia-smi topo -p2p: NS), so UCX falls back to
  # cuda_copy. NixlPushConnector was never exercised here.
  - name: host-staged KV transfer (no GPU P2P on g6.12xlarge)
    formula: pd_topology.pd_kv_buffer_device == "cpu"
  - name: pull connector only (push not validated on this node)
    formula: pd_topology.pd_kv_connector == "NixlConnector"
  # NIXL's compatibility hash requires the same cache dtype on both sides.
  - name: prefill and decode share the KV cache dtype when disaggregated
    formula: pd_topology.pd_prefill_instances == 0 || (vllm_prefill.kv_cache_dtype == "auto" && vllm_decode.kv_cache_dtype == "auto") || (vllm_prefill.kv_cache_dtype == "fp8" && vllm_decode.kv_cache_dtype == "fp8")

kpis:
  # Akamas 3.7 accepts at most 8 KPIs per study ("No more than 8 KPIs are allowed", seen at
  # `akamas create` on 2026-09-24). Every metric below, and all the others in the telemetry
  # catalog (GPU PCIe TX/RX, requests/s, failed transfers, decode queue), is still collected
  # and visible on its component. These 8 are the ones compared across presets.
  - name: Throughput totale
    formula: pd_topology.total_token_throughput
    direction: maximize
  - name: TTFT P95 (router)
    formula: pd_topology.time_to_first_token_p95
    direction: minimize
  - name: ITL P95 (router)
    formula: pd_topology.inter_token_latency_p95
    direction: minimize
  - name: Tempo in coda P95 prefill
    formula: vllm_prefill.request_queue_time_p95
    direction: minimize
  - name: Tempo trasferimento KV P95
    formula: vllm_decode.nixl_xfer_time_p95
    direction: minimize
  - name: Banda trasferimento KV
    formula: vllm_decode.nixl_transfer_throughput
    direction: maximize
  - name: Utilizzo KV cache decode
    formula: vllm_decode.kv_cache_usage_avg
    direction: maximize
  - name: Preemption decode (picco)
    formula: vllm_decode.preemption_rate
    direction: minimize
    aggregation: max

# Baseline + 9 presets (about 65-70 min each), revised after the 2026-09-24 smoke test, then
# the optimizer. Every preset sets all 12 parameters. In aggregated steps the vllm_prefill
# values are rendered but no process uses them. The buffer is "cpu" everywhere, aggregated
# steps included, so every step satisfies the pin constraints.
steps:
  # 2 GPUs, aggregated: two plain replicas behind the router, vLLM-typical settings (8192-token prefill chunks). The reference point.
  - name: baseline
    type: baseline
    values:
      pd_topology.pd_prefill_instances: 0
      pd_topology.pd_decode_instances: 2
      pd_topology.pd_kv_connector: "NixlConnector"
      pd_topology.pd_kv_buffer_device: "cpu"
      vllm_prefill.gpu_memory_utilization: 0.9
      vllm_prefill.max_num_seqs: 128
      vllm_prefill.max_num_batched_tokens: 8192
      vllm_prefill.kv_cache_dtype: "auto"
      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 128
      vllm_decode.max_num_batched_tokens: 8192
      vllm_decode.kv_cache_dtype: "auto"

  # 2 GPUs, aggregated, 1024-token chunks: a 4096-token prompt is split into 4 chunks interleaved with decode steps (Sarathi-Serve). The strong aggregated control.
  - name: S1 agg2 small chunks
    type: preset
    values:
      pd_topology.pd_prefill_instances: 0
      pd_topology.pd_decode_instances: 2
      pd_topology.pd_kv_connector: "NixlConnector"
      pd_topology.pd_kv_buffer_device: "cpu"
      vllm_prefill.gpu_memory_utilization: 0.9
      vllm_prefill.max_num_seqs: 128
      vllm_prefill.max_num_batched_tokens: 1024
      vllm_prefill.kv_cache_dtype: "auto"
      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 128
      vllm_decode.max_num_batched_tokens: 1024
      vllm_decode.kv_cache_dtype: "auto"

  # 2 GPUs, disaggregated with the baseline's own per-instance settings: isolates the topology change.
  - name: S2 1P1D same settings
    type: preset
    values:
      pd_topology.pd_prefill_instances: 1
      pd_topology.pd_decode_instances: 1
      pd_topology.pd_kv_connector: "NixlConnector"
      pd_topology.pd_kv_buffer_device: "cpu"
      vllm_prefill.gpu_memory_utilization: 0.9
      vllm_prefill.max_num_seqs: 128
      vllm_prefill.max_num_batched_tokens: 8192
      vllm_prefill.kv_cache_dtype: "auto"
      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 128
      vllm_decode.max_num_batched_tokens: 8192
      vllm_decode.kv_cache_dtype: "auto"

  # 2 GPUs, roles specialized: prefill takes 2 whole prompts per step (8192, not 16384: same throughput, half the step time), decode keeps a deep batch and small local steps.
  - name: S3 1P1D specialized
    type: preset
    values:
      pd_topology.pd_prefill_instances: 1
      pd_topology.pd_decode_instances: 1
      pd_topology.pd_kv_connector: "NixlConnector"
      pd_topology.pd_kv_buffer_device: "cpu"
      vllm_prefill.gpu_memory_utilization: 0.9
      vllm_prefill.max_num_seqs: 16
      vllm_prefill.max_num_batched_tokens: 8192
      vllm_prefill.kv_cache_dtype: "auto"
      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 256
      vllm_decode.max_num_batched_tokens: 2048
      vllm_decode.kv_cache_dtype: "auto"

  # S3 with fp8 KV on both roles: half the bytes per transfer (730 vs 1400 ms on the GPU path at the smoke test), twice the KV capacity (126k vs 63k tokens).
  - name: S4 1P1D fp8 KV
    type: preset
    values:
      pd_topology.pd_prefill_instances: 1
      pd_topology.pd_decode_instances: 1
      pd_topology.pd_kv_connector: "NixlConnector"
      pd_topology.pd_kv_buffer_device: "cpu"
      vllm_prefill.gpu_memory_utilization: 0.9
      vllm_prefill.max_num_seqs: 16
      vllm_prefill.max_num_batched_tokens: 8192
      vllm_prefill.kv_cache_dtype: "fp8"
      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 256
      vllm_decode.max_num_batched_tokens: 2048
      vllm_decode.kv_cache_dtype: "fp8"

  # 3 GPUs, ratio skewed to prefill. The smoke test showed 1P1D prefill-bound (prefill always full, decode idle half the time): the load is ~70:30 prefill:decode in GPU time.
  - name: S5 2P1D
    type: preset
    values:
      pd_topology.pd_prefill_instances: 2
      pd_topology.pd_decode_instances: 1
      pd_topology.pd_kv_connector: "NixlConnector"
      pd_topology.pd_kv_buffer_device: "cpu"
      vllm_prefill.gpu_memory_utilization: 0.9
      vllm_prefill.max_num_seqs: 16
      vllm_prefill.max_num_batched_tokens: 8192
      vllm_prefill.kv_cache_dtype: "auto"
      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 256
      vllm_decode.max_num_batched_tokens: 2048
      vllm_decode.kv_cache_dtype: "auto"

  # 4 GPUs, aggregated, S1's settings: the 4-GPU control.
  - name: S6 agg4 small chunks
    type: preset
    values:
      pd_topology.pd_prefill_instances: 0
      pd_topology.pd_decode_instances: 4
      pd_topology.pd_kv_connector: "NixlConnector"
      pd_topology.pd_kv_buffer_device: "cpu"
      vllm_prefill.gpu_memory_utilization: 0.9
      vllm_prefill.max_num_seqs: 128
      vllm_prefill.max_num_batched_tokens: 1024
      vllm_prefill.kv_cache_dtype: "auto"
      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 128
      vllm_decode.max_num_batched_tokens: 1024
      vllm_decode.kv_cache_dtype: "auto"

  # 4 GPUs, balanced ratio, S3's per-role settings.
  - name: S7 2P2D
    type: preset
    values:
      pd_topology.pd_prefill_instances: 2
      pd_topology.pd_decode_instances: 2
      pd_topology.pd_kv_connector: "NixlConnector"
      pd_topology.pd_kv_buffer_device: "cpu"
      vllm_prefill.gpu_memory_utilization: 0.9
      vllm_prefill.max_num_seqs: 16
      vllm_prefill.max_num_batched_tokens: 8192
      vllm_prefill.kv_cache_dtype: "auto"
      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 256
      vllm_decode.max_num_batched_tokens: 2048
      vllm_decode.kv_cache_dtype: "auto"

  # 4 GPUs, ratio matching the measured ~70:30 prefill:decode work, S3's per-role settings.
  - name: S8 3P1D
    type: preset
    values:
      pd_topology.pd_prefill_instances: 3
      pd_topology.pd_decode_instances: 1
      pd_topology.pd_kv_connector: "NixlConnector"
      pd_topology.pd_kv_buffer_device: "cpu"
      vllm_prefill.gpu_memory_utilization: 0.9
      vllm_prefill.max_num_seqs: 16
      vllm_prefill.max_num_batched_tokens: 8192
      vllm_prefill.kv_cache_dtype: "auto"
      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 256
      vllm_decode.max_num_batched_tokens: 2048
      vllm_decode.kv_cache_dtype: "auto"

  # S8 with fp8 KV on both roles: the best-guess combination.
  - name: S9 3P1D fp8 KV
    type: preset
    values:
      pd_topology.pd_prefill_instances: 3
      pd_topology.pd_decode_instances: 1
      pd_topology.pd_kv_connector: "NixlConnector"
      pd_topology.pd_kv_buffer_device: "cpu"
      vllm_prefill.gpu_memory_utilization: 0.9
      vllm_prefill.max_num_seqs: 16
      vllm_prefill.max_num_batched_tokens: 8192
      vllm_prefill.kv_cache_dtype: "fp8"
      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 256
      vllm_decode.max_num_batched_tokens: 2048
      vllm_decode.kv_cache_dtype: "fp8"

  # The repo's usual optimize step (studies 13-16). The presets above seed it. It stays
  # inside the 12-parameter selection and the constraints (host-staged KV, pull connector,
  # P + D <= 4). The node is stopped by hand when enough has been learned.
  - name: optimize
    type: optimize
    optimizer: AKAMAS
    numberOfInitExperiments: 0
    numberOfExperiments: 100
    maxFailedExperiments: 20
