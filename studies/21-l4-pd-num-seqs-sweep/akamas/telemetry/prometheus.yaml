# Study 18 telemetry. The catalog is copied from study 16 (same node, same metric
# conventions: percent = 0-1 ratio, DCGM DEV_* utilizations divided by 100). Additions are
# at the end: NIXL KV transfer (vLLM pack 1.11.0).
#
# HOW ONE CATALOG SERVES THREE vLLM-SHAPED COMPONENTS: every vLLM query filters on
# model_name=~"$MODEL$", and each component's `model` property selects a different source:
#   pd_topology   model qwen3-8b-router   the router's own series (k8s/pd_router.py): TTFT,
#                                         ITL and E2E measured from when the router received
#                                         the request, and prompt/generation tokens counted
#                                         once from vLLM's `usage` block. The goal and SLA
#                                         read from here.
#   vllm_prefill  model qwen3-8b-prefill  the prefill instances (empty in aggregated presets)
#   vllm_decode   model qwen3-8b-decode   the decode instances / aggregated replicas
# Engine-side TTFT on vllm_decode UNDER-REPORTS in disaggregated presets (its clock starts
# after the remote prefill): use it only to split the router's number, never as the SLA.
# Engine-side prompt tokens are counted on BOTH roles in disaggregated presets (decode
# counts the transferred prompt again): never sum vllm_prefill + vllm_decode throughput.
#
# active_dp_engines is filtered by model_name like every other vLLM query and counts
# (instance, engine) pairs, so on vllm_decode it reads the number of decode processes.
# PCIe (gpu_pcie_tx_bytes / gpu_pcie_rx_bytes, per GPU component): DCGM_FI_PROF_PCIE_*_BYTES is
# a RATE in bytes/s, not a counter. It was checked on 2026-09-24: over 3 days the value went
# down in 54 of 114 steps. The GPU pack labels it "bytes since boot": read it as bytes/s.
#
# STUDY 20 changes (audited on real study-19 data, 2026-09-25):
# - prefill_token_throughput / total_token_throughput count only prompt tokens computed
#   locally (prompt_tokens_by_source minus external_kv_transfer), falling back to
#   vllm:prompt_tokens_total with `or` for the router, which has no by_source series. A
#   disaggregated decode counts every transferred prompt as a prompt token (3944 tok/s on
#   BOTH roles in study 19's 3P1D), so the old query double-counted it. The goal reads
#   pd_topology (the router), so it is unchanged.
# - active_dp_engines was always empty: vllm:cache_config_info has no model_name label.
#   It is now filtered by the scrape `endpoint`.
# - cAdvisor/PSI rates use [2m]: the kubelet is scraped too sparsely for 30 s windows, and
#   the AIPerf container lost up to 13 CPU/PSI metrics.
# - 7 vLLM-pack metrics that had no query are added at the end (per-role phase times).
# - active_gpus counts vLLM instances of the component's own role, one
#   vllm:cache_config_info series per process, each process on one GPU (TP1). The role
#   filter is the scrape `endpoint` (prefill-i / decode-j; component property `endpoint`).
#   Study 18/19 counted DCGM GPUs of the whole pod, so vllm_prefill showed every GPU of
#   the topology (3 in a 2P1D). pd_topology matches both roles, so the goal's
#   denominator is unchanged.
# - kv_cache_capacity_* / kv_cache_used_* come from the router's per-instance republishing
#   (k8s/pd_router.py `_kv_poll`, label vllm_instance) and are filtered per role by model_name.
#
# The kv-cache-exporter sidecar of studies 9-16 is NOT deployed (it reads a single vLLM
# on localhost:8000). Its kv_cache_capacity_* / kv_cache_used_* metrics stay in the
# catalog but return no data.
kind: telemetry-instance
system: vLLM_Benchmark_20_L4_PD_Disaggregation

name: Prometheus_20_L4_PD_Disaggregation
provider: Prometheus
config:
  address: kube-prometheus-stack-prometheus.monitoring.svc.cluster.local
  port: 9090
  logLevel: DETAILED
  duration: 30

# Same metric catalog as 1-goodput-realistic-load, unchanged — these query vLLM's own
# `vllm:*` Prometheus metric names, which don't depend on which model is being served.
# Per ROADMAP.md Q7, this catalog has never been independently re-verified against a
# live vLLM /metrics endpoint in this repo — worth doing once for this study too.
# PERCENT CONVENTION (fixed 2026-09-10): Akamas' `percent` unit is a 0-1 RATIO — every
# reference query in Akamas' own Prometheus metrics mapping (container_cpu_util,
# container_memory_util, Linux cpu_util, jvm_heap_util) returns a plain ratio and the UI
# renders it x100 with a % sign; the vLLM pack's kv_cache_usage_* (0-1) follow the same
# rule and display correctly. The 16 Kubernetes-pack percent queries below (11 PSI + cpu/
# memory util/max + cpu_throttle_time) used to prefix `100 *`, so an 8.5% PSI showed as
# 850% in the UI; the `100 *` is removed. Conversely DCGM's DEV_* utilization fields
# GPU_UTIL, MEM_COPY_UTIL, ENC_UTIL, DEC_UTIL, FAN_SPEED are 0-100 natively, so those 5
# queries now divide by 100 (verified: GPU_UTIL/100 = 1.0 at full load). FB_USED_PERCENT and
# every PROF_* field are already 0-1 (verified: FB_USED_PERCENT = 0.986 at baseline) and are
# left as-is. container_cpu_throttled_millicores was also re-pointed at Akamas' reference
# query (see its entry). Studies 5/7/8 still carry the old scale — same fix applies if their
# telemetry instances are ever recreated.
metrics:

  # --- Step 1 — Isolate the symptom: TTFT vs. ITL ---
  - metric: e2e_request_latency_p95
    datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:e2e_request_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
    scale: 1
  - metric: e2e_request_latency_avg
    datasourceMetric: '(sum(rate(vllm:e2e_request_latency_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:e2e_request_latency_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
    scale: 1
  - metric: request_success_rate
    datasourceMetric: 'sum(rate(vllm:request_success_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
  - metric: time_to_first_token_p95
    datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:time_to_first_token_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
    scale: 1
  - metric: time_to_first_token_avg
    datasourceMetric: '(sum(rate(vllm:time_to_first_token_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:time_to_first_token_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
    scale: 1
  - metric: prefill_token_throughput
    datasourceMetric: '(sum(rate(vllm:prompt_tokens_by_source_total{source!="external_kv_transfer", model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) or sum(rate(vllm:prompt_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])))'
  - metric: inter_token_latency_p95
    datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
    scale: 1
  - metric: inter_token_latency_avg
    datasourceMetric: '(sum(rate(vllm:inter_token_latency_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:inter_token_latency_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
    scale: 1
  - metric: decode_token_throughput
    datasourceMetric: 'sum(rate(vllm:generation_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'

  # ADDED FOR THIS STUDY (2026-09-17): study 14 declared these two as KPIs but reused
  # study 13's telemetry instance, which has no query for them — both stayed empty for
  # the whole study. Both names are declared by vLLM pack 1.9.1 (verified with
  # `akamas describe optimization-pack vLLM` on the instance, 2026-09-17).
  #   total_token_throughput: prompt + generation tokens/s. The goal divides by
  #   active_gpus, so this is what shows a 4-GPU layout producing more in total while
  #   scoring worse per GPU.
  - metric: total_token_throughput
    datasourceMetric: '(sum(rate(vllm:prompt_tokens_by_source_total{source!="external_kv_transfer", model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) or sum(rate(vllm:prompt_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))) + sum(rate(vllm:generation_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
  #   request_queue_time_p95: TTFT = queue + prefill, so with TTFT and this one the
  #   prefill time follows by difference — it separates "slow to compute" from "merely
  #   saturated", which is the whole question when comparing topologies.
  - metric: request_queue_time_p95
    datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:request_queue_time_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
    scale: 1

  # --- Step 2 — Detect server saturation ---
  - metric: num_requests_running
    datasourceMetric: 'sum(vllm:num_requests_running{model_name=~"$MODEL$", pod=~"$POD$"})'
  - metric: num_requests_waiting
    datasourceMetric: 'sum(vllm:num_requests_waiting{model_name=~"$MODEL$", pod=~"$POD$"})'

  # --- Step 3 — Evaluate VRAM and KV cache health ---
  - metric: kv_cache_usage_avg
    datasourceMetric: 'avg(vllm:kv_cache_usage_perc{model_name=~"$MODEL$", pod=~"$POD$"})'
  - metric: kv_cache_usage_max
    datasourceMetric: 'max(vllm:kv_cache_usage_perc{model_name=~"$MODEL$", pod=~"$POD$"})'
  - metric: preemption_rate
    datasourceMetric: 'sum(rate(vllm:num_preemptions_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
  - metric: prefix_cache_hit_rate
    datasourceMetric: 'sum(rate(vllm:prefix_cache_hits_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:prefix_cache_queries_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1)'

  # --- NEW 2026-09-08 — absolute KV-cache metrics (vLLM pack 1.6.1 -> 1.7.0,
  #     feature/kv-cache-absolute-metrics — build+install the pack BEFORE creating this
  #     telemetry instance or these 4 names won't resolve). vLLM itself exports KV
  #     usage only as a ratio (vllm:kv_cache_usage_perc, the 3 kv_cache_usage_* entries
  #     above) and the capacity only as STRING labels on vllm:cache_config_info
  #     (num_gpu_blocks, block_size), which PromQL cannot turn into numbers. These read
  #     the kv-cache exporter sidecar instead (k8s/04-kv-cache-exporter-configmap.yaml,
  #     container `kv-cache-exporter` in k8s/01-deployment_template.yaml, scraped via
  #     k8s/02-service.yaml port kv-exporter + k8s/monitoring/servicemonitor.yaml).
  #     Token values are exact (vLLM's own num_gpu_blocks x block_size x usage ratio);
  #     the GB values additionally depend on the bytes-per-token constant configured on
  #     the sidecar (Qwen3-30B-A3B, bf16 KV cache: 98304 B/token = 48 layers x 4 KV heads x 128 x 2 x 2 B; every layer is full attention here, so unlike gpt-oss-20b there is no hybrid sliding-window allocator making it approximate — fp8 KV trials still read 2x high). The sidecar's
  #     gauges carry no model_name label — scoped by pod only, like the DCGM metrics —
  #     and are absent (not stale) while vLLM is still starting, so sum() yields no
  #     datapoint rather than a wrong one. Not yet verified live. ---
  - metric: kv_cache_capacity_tokens
    datasourceMetric: 'sum(vllm_kv_cache_capacity_tokens{model_name=~"$MODEL$", pod=~"$POD$"})'
  - metric: kv_cache_used_tokens
    datasourceMetric: 'sum(vllm_kv_cache_used_tokens{model_name=~"$MODEL$", pod=~"$POD$"})'
  - metric: kv_cache_capacity_gb
    datasourceMetric: 'sum(vllm_kv_cache_capacity_bytes{model_name=~"$MODEL$", pod=~"$POD$"}) / 1e9'
  - metric: kv_cache_used_gb
    datasourceMetric: 'sum(vllm_kv_cache_used_bytes{model_name=~"$MODEL$", pod=~"$POD$"}) / 1e9'

  # --- NEW 2026-09-10 (vLLM pack 1.8.0) — hardware-usage normalizers for this study's
  #     per-GPU goal. Verified live on 2026-09-10 against the running pod
  #     (--data-parallel-size=3, TP=1): both return 3; the idle 4th L4 reads 2 MiB.
  #
  #     active_gpus: GPUs actually holding model weights, from DCGM — vLLM exposes no
  #     metric carrying its TP degree, so this is the only source that also counts TP.
  #     Threshold 1024 MiB: an idle L4 sits at ~2 MiB, a vLLM worker at >= several GB.
  #     Label caveat (verified): on DCGM series the `pod` label is the dcgm-exporter's own
  #     pod (Prometheus Operator target relabeling); the CONSUMING pod is `exported_pod`
  #     (and `exported_namespace`/`exported_container`), so this filters on that one.
  #     $POD$ is `.*` on the vLLM component today (single dedicated GPU node), so it
  #     effectively counts every GPU with weights loaded on the node.
  - metric: active_gpus
    datasourceMetric: 'count(vllm:cache_config_info{endpoint=~"$ENDPOINT$", pod=~"$POD$"})'
  #     active_dp_engines: one vllm:cache_config_info series per data-parallel engine
  #     (engine="0","1",...). Counts DP only — TP=4/DP=1 reads 1 — hence not in the
  #     goal; kept for analysis (TP = active_gpus / active_dp_engines).
  - metric: active_dp_engines
    datasourceMetric: 'count(count by (instance, engine) (vllm:cache_config_info{endpoint=~"$ENDPOINT$", pod=~"$POD$"}))'
  #     gpu_memory_allocated_gb: framebuffer in use on the GPUs holding weights, summed,
  #     DCGM MiB -> decimal GB (x 1048576 / 1e9; same GB unit as kv_cache_capacity_gb so
  #     the two are directly comparable). At steady state vLLM pre-allocates its whole
  #     budget, so this ~ gpu_memory_utilization x active_gpus x 23034 MiB (L4).
  #     Verified live 2026-09-10 at TP=1/DP=3: 61,092 MiB = 64.06 GB.
  - metric: gpu_memory_allocated_gb
    # Study 20: per ROLE. DCGM series carry only the GPU index, and all 4 GPUs belong to the
    #     one vllm-pd pod, so the old exported_pod filter gave the whole pod on every role
    #     (86.4 GB on vllm_decode in study 19's 3P1D, which has 1 GPU). The join goes through
    #     the router's pd_gpu_role_info (GPU index -> instance, launcher layout).
    datasourceMetric: 'sum(DCGM_FI_DEV_FB_USED{exported_pod=~"$POD$"} * on(gpu) group_left() max by(gpu)(pd_gpu_role_info{model_name=~"$MODEL$", pod=~"$POD$"})) * 1048576 / 1e9'

  # --- Step 4 — Analyze request sequence lengths ---
  - metric: input_sequence_length_p95
    datasourceMetric: 'histogram_quantile(0.95, sum by(le)(rate(vllm:request_prompt_tokens_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m])))'
  - metric: input_sequence_length_avg
    datasourceMetric: 'sum(rate(vllm:request_prompt_tokens_sum{model_name=~"$MODEL$", pod=~"$POD$"}[5m])) / clamp_min(sum(rate(vllm:request_prompt_tokens_count{model_name=~"$MODEL$", pod=~"$POD$"}[5m])), 1e-9)'
  - metric: output_sequence_length_p95
    datasourceMetric: 'histogram_quantile(0.95, sum by(le)(rate(vllm:request_generation_tokens_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m])))'
  - metric: output_sequence_length_avg
    datasourceMetric: 'sum(rate(vllm:request_generation_tokens_sum{model_name=~"$MODEL$", pod=~"$POD$"}[5m])) / clamp_min(sum(rate(vllm:request_generation_tokens_count{model_name=~"$MODEL$", pod=~"$POD$"}[5m])), 1e-9)'

  # --- Step 5 — Review distributed inference strategy ---
  - metric: fleet_e2e_latency_percentile
    datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:e2e_request_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m]))))*1000'
    scale: 1
  - metric: fleet_inter_token_latency_percentile
    datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m]))))*1000'
    scale: 1
  - metric: fleet_request_success_rate
    datasourceMetric: 'sum(rate(vllm:request_success_total{model_name=~"$MODEL$", pod=~"$POD$"}[5m]))'
  - metric: fleet_kv_cache_usage_avg
    datasourceMetric: 'avg(vllm:kv_cache_usage_perc{model_name=~"$MODEL$", pod=~"$POD$"})'
  - metric: inter_token_latency_p95_5m
    datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m]))))*1000'
    scale: 1
  #     Study 20: "per pod" is per vLLM INSTANCE (scrape endpoint). Every instance runs in
  #     the one vllm-pd pod, so by(pod) returned the role's overall p95 twice.
  - metric: inter_token_latency_p95_max_per_pod
    datasourceMetric: '(max(histogram_quantile(0.95, sum by(endpoint, le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m])))))*1000'
    scale: 1
  - metric: inter_token_latency_p95_min_per_pod
    datasourceMetric: '(min(histogram_quantile(0.95, sum by(endpoint, le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m])))))*1000'
    scale: 1

  # --- GPU utilization (DCGM-exporter) ---
  #     PER-GPU SPLIT, 2026-09-08: the GPU is modeled as ONE COMPONENT PER GPU
  #     (components/gpu0.yaml .. gpu3.yaml, `prometheus.gpu: "0".."3"`, replacing the
  #     single `gpu` component that had `gpu: .*`). `$GPU$` therefore expands to one
  #     DCGM `gpu` index per component, so every query below returns exactly one series
  #     for that GPU — the metrics show up in Akamas per GPU instance, not as one series
  #     aggregated across the 4 L4s. The former `<agg> by(gpu)(...)` grouping (which
  #     handed 4 series to a single component, collapsed into one aggregated value) was
  #     dropped for the same reason. `gpu_count` (DCGM_FI_DEV_COUNT) returns the node's
  #     device count (4) on every component — expected. Not yet verified live (Akamas
  #     endpoint unreachable 2026-09-08).
  - metric: gpu_util
    datasourceMetric: 'avg(DCGM_FI_DEV_GPU_UTIL{pod=~"$POD$", gpu=~"$GPU$"}) / 100'
  - metric: gpu_sm_active
    datasourceMetric: 'avg(DCGM_FI_PROF_SM_ACTIVE{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_sm_occupancy
    datasourceMetric: 'avg(DCGM_FI_PROF_SM_OCCUPANCY{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_tensor_core_active
    datasourceMetric: 'avg(DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_dram_active
    datasourceMetric: 'avg(DCGM_FI_PROF_DRAM_ACTIVE{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_fb_used
    datasourceMetric: 'sum(DCGM_FI_DEV_FB_USED{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_fb_total
    datasourceMetric: 'sum(DCGM_FI_DEV_FB_USED{pod=~"$POD$", gpu=~"$GPU$"} + DCGM_FI_DEV_FB_FREE{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_power_usage
    datasourceMetric: 'max(DCGM_FI_DEV_POWER_USAGE{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_power_limit
    datasourceMetric: 'max(DCGM_FI_DEV_POWER_MGMT_LIMIT{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_temp
    datasourceMetric: 'max(DCGM_FI_DEV_GPU_TEMP{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_memory_temp
    datasourceMetric: 'max(DCGM_FI_DEV_MEMORY_TEMP{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_power_violation_rate
    datasourceMetric: 'sum(rate(DCGM_FI_DEV_POWER_VIOLATION{pod=~"$POD$", gpu=~"$GPU$"}[$DURATION$]))'
  - metric: gpu_thermal_violation_rate
    datasourceMetric: 'sum(rate(DCGM_FI_DEV_THERMAL_VIOLATION{pod=~"$POD$", gpu=~"$GPU$"}[$DURATION$]))'
  - metric: gpu_pcie_replay_rate
    datasourceMetric: 'sum(rate(DCGM_FI_DEV_PCIE_REPLAY_COUNTER{pod=~"$POD$", gpu=~"$GPU$"}[$DURATION$]))'

  # --- Advanced: non-tensor pipe activity (FP16 / FP32) ---
  - metric: gpu_fp16_pipe_active
    datasourceMetric: 'avg(DCGM_FI_PROF_PIPE_FP16_ACTIVE{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_fp32_pipe_active
    datasourceMetric: 'avg(DCGM_FI_PROF_PIPE_FP32_ACTIVE{pod=~"$POD$", gpu=~"$GPU$"})'

  # --- Model FLOPs Utilization (vLLM --enable-mfu-metrics, already on in this study's
  #     deployment) — NEW 2026-08-28, added ONLY to this study for now:
  #     estimated_flops_per_gpu, estimated_read_bytes_per_gpu,
  #     estimated_write_bytes_per_gpu. Pack MR (feature/mfu-compute-bandwidth-metrics,
  #     vLLM pack 1.5.1 -> 1.6.0) built and installed on the toolbox's live Akamas
  #     instance 2026-08-28 — these metric names now resolve.
  #     Study 20: averaged over the role's instances (each TP1 = one GPU), so the value is
  #     per GPU as the name says. Studies 18/19 summed them: 60.6 TFLOPS on a 0P4D decode
  #     was 4 GPUs' worth, and a 3P1D prefill read 3x a 1P1D one.
  - metric: estimated_flops_per_gpu
    datasourceMetric: 'avg(sum by(endpoint)(rate(vllm:estimated_flops_per_gpu_total{model_name=~"$MODEL$", pod=~"$POD$"}[1m]))) / 1e12'
  - metric: estimated_read_bytes_per_gpu
    datasourceMetric: 'avg(sum by(endpoint)(rate(vllm:estimated_read_bytes_per_gpu_total{model_name=~"$MODEL$", pod=~"$POD$"}[1m]))) / 1e9'
  - metric: estimated_write_bytes_per_gpu
    datasourceMetric: 'avg(sum by(endpoint)(rate(vllm:estimated_write_bytes_per_gpu_total{model_name=~"$MODEL$", pod=~"$POD$"}[1m]))) / 1e9'

  # --- NEW 2026-09-07 — GPU pack 1.0.1 -> 1.1.0 (feature/dcgm-counters-coverage): 23
  #     new DCGM-derived metrics, all fields already enabled in
  #     k8s/monitoring/dcgm_counters.csv on this study's dcgm-exporter release. This
  #     study exists specifically to verify these actually collect end-to-end. ---
  - metric: gpu_fp64_pipe_active
    datasourceMetric: 'avg(DCGM_FI_PROF_PIPE_FP64_ACTIVE{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_sm_clock
    datasourceMetric: 'avg(DCGM_FI_DEV_SM_CLOCK{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_mem_clock
    datasourceMetric: 'avg(DCGM_FI_DEV_MEM_CLOCK{pod=~"$POD$", gpu=~"$GPU$"})'
  - metric: gpu_total_energy_consumption
