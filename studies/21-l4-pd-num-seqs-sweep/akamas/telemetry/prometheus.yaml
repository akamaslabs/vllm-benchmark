  # --- NEW 2026-09-07 — Kubernetes pack PSI metrics (feature/psi-cluster-metrics),
  #     container-level (cAdvisor container_pressure_*, carries a pod label so this
  #     follows the same $POD$ pattern as every other per-pod metric above).
  #     `container!=""` is REQUIRED, not stylistic — verified live: this cluster's
  #     cAdvisor scrape emits 3 series per pod per metric (a pod-level aggregate with
  #     no `container` label, a pause/sandbox container also with no `container` label,
  #     and the real workload container, the only one carrying a `container` label).
  #     Without this filter `sum()` silently double-counts (pod-level + real
  #     container). Fixed here 2026-09-07 — this filter was missing when these 6
  #     queries were first written the same day; caught before the study ran. ---
  - metric: container_cpu_pressure_some
    datasourceMetric: 'sum(rate(container_pressure_cpu_waiting_seconds_total{pod=~"$POD$", container!=""}[2m]))'
  - metric: container_cpu_pressure_full
    datasourceMetric: 'sum(rate(container_pressure_cpu_stalled_seconds_total{pod=~"$POD$", container!=""}[2m]))'
  - metric: container_memory_pressure_some
    datasourceMetric: 'sum(rate(container_pressure_memory_waiting_seconds_total{pod=~"$POD$", container!=""}[2m]))'
  - metric: container_memory_pressure_full
    datasourceMetric: 'sum(rate(container_pressure_memory_stalled_seconds_total{pod=~"$POD$", container!=""}[2m]))'
  - metric: container_io_pressure_some
    datasourceMetric: 'sum(rate(container_pressure_io_waiting_seconds_total{pod=~"$POD$", container!=""}[2m]))'
  - metric: container_io_pressure_full
    datasourceMetric: 'sum(rate(container_pressure_io_stalled_seconds_total{pod=~"$POD$", container!=""}[2m]))'

  # --- NEW 2026-09-07 — the rest of the Kubernetes pack's Container metrics catalog
  #     (kube-state-metrics + cAdvisor), not just PSI. Same `container!=""` filter
  #     requirement as above for every cAdvisor-sourced query; kube-state-metrics
  #     queries (resource requests/limits, restarts) don't need it — verified live,
  #     that exporter emits one clean series per container already, no pod-level
  #     aggregate to exclude. ---
  - metric: container_cpu_used
    datasourceMetric: '1000 * sum(rate(container_cpu_usage_seconds_total{pod=~"$POD$", container!=""}[2m]))'
  - metric: container_cpu_used_max
    datasourceMetric: '1000 * max(sum by(pod)(rate(container_cpu_usage_seconds_total{pod=~"$POD$", container!=""}[2m])))'
  - metric: container_cpu_util
    datasourceMetric: 'sum(rate(container_cpu_usage_seconds_total{pod=~"$POD$", container!=""}[2m])) / clamp_min(sum(kube_pod_container_resource_limits{resource="cpu", pod=~"$POD$", container!=""}), 1e-9)'
  - metric: container_cpu_util_max
    datasourceMetric: 'max(sum by(pod)(rate(container_cpu_usage_seconds_total{pod=~"$POD$", container!=""}[2m])) / clamp_min(sum by(pod)(kube_pod_container_resource_limits{resource="cpu", pod=~"$POD$", container!=""}), 1e-9))'
  # container_cpu_cfs_throttled_seconds_total does not exist on this cluster's cAdvisor
  # (verified live: 0 series) — only the periods-based counters do. Approximated via
  # the standard Linux CFS default period (100ms = 0.1s per period).
  - metric: container_cpu_throttle_time
    datasourceMetric: 'sum(rate(container_cpu_cfs_throttled_periods_total{pod=~"$POD$", container!=""}[2m])) / clamp_min(sum(rate(container_cpu_cfs_periods_total{pod=~"$POD$", container!=""}[2m])), 1e-9)'
  - metric: container_cpu_throttled_millicores
    # FIXED 2026-09-10 to Akamas' reference mapping (1e3 * rate(container_cpu_cfs_throttled_seconds_total)):
    # was 100 * rate(...throttled_PERIODS_total) — wrong metric (periods, not CPU-seconds) and wrong factor.
    # EMPTY ON THIS CLUSTER: kube-prometheus-stack's kubelet ServiceMonitor drops
    # container_cpu_cfs_throttled_seconds_total by default (cAdvisor metricRelabelings). Keep the
    # correct query rather than a wrong number; to collect it, remove that name from the drop
    # regex in k8s/monitoring/values-kube-prometheus.yaml (kubelet.serviceMonitor.cAdvisorMetricRelabelings)
    # and helm-upgrade. Moot for this study: neither vLLM nor AIPerf sets limits.cpu, so throttling is 0.
    datasourceMetric: '1000 * sum(rate(container_cpu_cfs_throttled_seconds_total{pod=~"$POD$", container!=""}[2m]))'
  - metric: container_cpu_request
    datasourceMetric: '1000 * sum(kube_pod_container_resource_requests{resource="cpu", pod=~"$POD$", container!=""})'
  - metric: container_cpu_limit
    datasourceMetric: '1000 * sum(kube_pod_container_resource_limits{resource="cpu", pod=~"$POD$", container!=""})'
  - metric: container_memory_used
    datasourceMetric: 'sum(container_memory_usage_bytes{pod=~"$POD$", container!=""})'
  - metric: container_memory_used_max
    datasourceMetric: 'max(sum by(pod)(container_memory_usage_bytes{pod=~"$POD$", container!=""}))'
  - metric: container_memory_util
    datasourceMetric: 'sum(container_memory_working_set_bytes{pod=~"$POD$", container!=""}) / clamp_min(sum(kube_pod_container_resource_limits{resource="memory", pod=~"$POD$", container!=""}), 1e-9)'
  - metric: container_memory_util_max
    datasourceMetric: 'max(sum by(pod)(container_memory_working_set_bytes{pod=~"$POD$", container!=""}) / clamp_min(sum by(pod)(kube_pod_container_resource_limits{resource="memory", pod=~"$POD$", container!=""}), 1e-9))'
  - metric: container_memory_working_set
    datasourceMetric: 'sum(container_memory_working_set_bytes{pod=~"$POD$", container!=""})'
  - metric: container_memory_resident_set
    datasourceMetric: 'sum(container_memory_rss{pod=~"$POD$", container!=""})'
  - metric: container_memory_cache
    datasourceMetric: 'sum(container_memory_cache{pod=~"$POD$", container!=""})'
  - metric: container_memory_request
    datasourceMetric: 'sum(kube_pod_container_resource_requests{resource="memory", pod=~"$POD$", container!=""})'
  - metric: container_memory_limit
    datasourceMetric: 'sum(kube_pod_container_resource_limits{resource="memory", pod=~"$POD$", container!=""})'
  - metric: container_restarts
    datasourceMetric: 'sum(kube_pod_container_status_restarts_total{pod=~"$POD$", container!=""})'
  - metric: container_oom_kills_count
    datasourceMetric: 'sum(container_oom_events_total{pod=~"$POD$", container!=""})'

  # --- NEW 2026-09-07 — Kubernetes pack PSI metrics, cluster-level (node-exporter
  #     node_pressure_*). Unlike every metric above, these carry NO pod/gpu label —
  #     only a node identity — so they can't use $POD$/$GPU$. Scoped to this study's
  #     GPU node specifically via a two-hop join: node_pressure_* is keyed by
  #     `instance` (node-exporter's own IP:port); node_uname_info (also node-exporter)
  #     maps that to `nodename` (the Kubernetes Node object name); kube_node_labels
  #     (kube-state-metrics, `label_node_role` newly enabled in that chart's
  #     metricLabelsAllowlist 2026-09-07 specifically for this) maps `node` back to
  #     the same name and carries the node-role label this study filters on
  #     ($NODE_ROLE$ = "llm-serving", from this component's own
  #     properties.prometheus.node_role — see akamas/components/cluster.yaml).
  #     Verified live against this cluster's Prometheus before writing these queries;
  #     without this join, an unfiltered node_pressure_* query would mix in the
  #     "system"/"akamas" nodes' pressure alongside the GPU node's.
  #     CPU has no "full"/stalled state at the node-exporter level (only "some"/
  #     waiting) — confirmed live, same as at the container level's cpu_pressure_full.
  - metric: k8s_cluster_cpu_pressure
    datasourceMetric: 'sum(rate(node_pressure_cpu_waiting_seconds_total[2m]) * on(instance) group_left(nodename) node_uname_info * on(nodename) group_left(node) label_replace(kube_node_labels{label_node_role=~"$NODE_ROLE$"}, "nodename", "$1", "node", "(.*)"))'
  - metric: k8s_cluster_memory_pressure_some
    datasourceMetric: 'sum(rate(node_pressure_memory_waiting_seconds_total[2m]) * on(instance) group_left(nodename) node_uname_info * on(nodename) group_left(node) label_replace(kube_node_labels{label_node_role=~"$NODE_ROLE$"}, "nodename", "$1", "node", "(.*)"))'
  - metric: k8s_cluster_memory_pressure_full
    datasourceMetric: 'sum(rate(node_pressure_memory_stalled_seconds_total[2m]) * on(instance) group_left(nodename) node_uname_info * on(nodename) group_left(node) label_replace(kube_node_labels{label_node_role=~"$NODE_ROLE$"}, "nodename", "$1", "node", "(.*)"))'
  - metric: k8s_cluster_io_pressure_some
    datasourceMetric: 'sum(rate(node_pressure_io_waiting_seconds_total[2m]) * on(instance) group_left(nodename) node_uname_info * on(nodename) group_left(node) label_replace(kube_node_labels{label_node_role=~"$NODE_ROLE$"}, "nodename", "$1", "node", "(.*)"))'
  - metric: k8s_cluster_io_pressure_full
    datasourceMetric: 'sum(rate(node_pressure_io_stalled_seconds_total[2m]) * on(instance) group_left(nodename) node_uname_info * on(nodename) group_left(node) label_replace(kube_node_labels{label_node_role=~"$NODE_ROLE$"}, "nodename", "$1", "node", "(.*)"))'

  # --- NIXL KV transfer (vLLM pack 1.11.0; vllm/distributed/kv_transfer/kv_connector/v1/
  #     nixl/stats.py, v0.29.0). Present only when a NIXL connector is configured, with
  #     labels model_name + engine. With NixlConnector (pull) the transfer is observed on
  #     the decode side. With NixlPushConnector it is observed on the prefill side.
  - metric: nixl_xfer_time_p95
    datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:nixl_xfer_time_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
    scale: 1
  - metric: nixl_xfer_time_avg
    datasourceMetric: '(sum(rate(vllm:nixl_xfer_time_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:nixl_xfer_time_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
    scale: 1
  - metric: nixl_transfer_throughput
    datasourceMetric: 'sum(rate(vllm:nixl_bytes_transferred_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / 1e9'
  - metric: nixl_failed_transfers_rate
    datasourceMetric: 'sum(rate(vllm:nixl_num_failed_transfers_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
  - metric: nixl_kv_expired_requests_rate
    datasourceMetric: 'sum(rate(vllm:nixl_num_kv_expired_reqs_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
  - metric: external_kv_prompt_token_throughput
    datasourceMetric: 'sum(rate(vllm:prompt_tokens_by_source_total{source="external_kv_transfer", model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'

  # --- Study 20: vLLM pack metrics bound to the vLLM component type that had no query in
  #     studies 18/19. Per-role phase times make the disaggregated pipeline readable:
  #     prefill time on vllm_prefill, decode time and KV-wait queue on vllm_decode.
  - metric: request_prefill_time_p95
    datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:request_prefill_time_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
    scale: 1
  - metric: request_decode_time_p95
    datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:request_decode_time_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
    scale: 1
  - metric: request_queue_time_avg
    datasourceMetric: '(sum(rate(vllm:request_queue_time_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:request_queue_time_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
    scale: 1
  - metric: time_to_first_token_p90
    datasourceMetric: '(histogram_quantile(0.90, sum by(le)(rate(vllm:time_to_first_token_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
    scale: 1
  - metric: inter_token_latency_p90
    datasourceMetric: '(histogram_quantile(0.90, sum by(le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
    scale: 1
  - metric: time_per_output_token_p95
    datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:request_time_per_output_token_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
    scale: 1
  - metric: time_per_output_token_avg
    datasourceMetric: '(sum(rate(vllm:request_time_per_output_token_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:request_time_per_output_token_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
    scale: 1
