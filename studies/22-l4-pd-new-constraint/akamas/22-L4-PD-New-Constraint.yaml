kind: study
name: 22-L4-PD-New-Constraint
description: >-
  Study 22: prefill/decode disaggregation only (1-3 prefill, 1-3 decode instances) on
  Qwen/Qwen3-8B-FP8, vLLM 0.29.0, one g6.12xlarge (4x L4). The goal is tokens/s per active
  GPU at the highest load where neither role queues: at most 1 waiting request on prefill
  and on decode, TTFT p95 <= 10 s, ITL p95 <= 75 ms. The prefill runs the FP8 Triton block
  kernel instead of Marlin (about 36% faster). The KV-capacity constraints are dropped, and
  both connectors and both KV buffers are in the search space. The baseline is imported
  from study 20 (2 aggregated replicas, vLLM defaults), then a P1D1 preset, 9 random and
  100 AKAMAS experiments.
# Reuses study 20's system, telemetry instance and workflow (the precedent of studies 14,
# 16 and 21), so the imported baseline stays on the same scale. The files under
# system.yaml/components/telemetry/ and the workflow are copies kept for the record. Do NOT
# create them again.
# The workflow runs studies/20-l4-pd-disaggregation-tuned/k8s. Since commit b29754b
# (2026-09-28) that template gives the prefill instances
# VLLM_DISABLED_KERNELS=Marlin...,Humming... (TritonFp8BlockScaledMMKernel, W8A8 FP8). The
# imported baseline (aggregated, decode-only processes) ran on Marlin, as every study 18-21
# experiment did.
system: vLLM_Benchmark_20_L4_PD_Disaggregation
workflow: 20-L4-PD-Disaggregation-Workflow

# Same goal shape as studies 9-16 (tokens/s per GPU actually holding weights), so 2-GPU and
# 4-GPU presets compare fairly. Every term reads from pd_topology, i.e. the router: tokens
# delivered to clients (counted once from vLLM's usage block) and client-side TTFT/ITL. The
# per-instance numbers are not used here, because engine-side TTFT under-reports and
# engine-side prompt tokens double-count once prefill runs elsewhere.
# Study 22 changes: the goal numerator is total_token_throughput, which is the same sum at the
# router. TTFT is relaxed to 10 s. Two queue constraints are added: at most 1 request
# waiting, on average over the window, on the prefill instances (summed) and on the decode
# instances. The score is therefore the throughput at the load where both roles still keep
# up. Decode "waiting" also counts requests whose KV is still being pulled (NIXL), so slow
# transfers weigh on it.
# Study 20's SLA, for reference, was calibrated at the 2026-09-24 smoke test (60 s levels, 2 GPUs). On L4 one 4096-token
# prefill alone costs ~1.5 s (no native FP8 compute, so it runs as bf16). The aggregated
# baseline has TTFT p90 3.2 s already at concurrency 4. So TTFT p95 <= 5000 ms leaves room
# for a real queue without being violated by construction. ITL p95 <= 75 ms is where the
# aggregated baseline starts to give way (ITL p99 74 ms at concurrency 8, 100 ms at 12)
# while 1P1D stayed at 53-67 ms. Tail ITL is the one thing vLLM's docs say disaggregation
# improves.
goal:
  objective: maximize
  function:
    formula: pd_topology.total_token_throughput / pd_topology.active_gpus
    unit: tokens per second/gpus
  constraints:
    absolute:
      - name: TTFT P95 SLA at the router
        formula: pd_topology.time_to_first_token_p95 <= 10000
      - name: ITL P95 SLA at the router
        formula: pd_topology.inter_token_latency_p95 <= 75
      - name: request waiting for prefill
        formula: vllm_prefill.num_requests_waiting <= 1
      - name: request waiting for decode
        formula: vllm_decode.num_requests_waiting <= 1

# As studies 6-16, on total instead of prefill throughput: the most stable 6-sample window at the peak. The
# per-level picture (where each topology stops meeting the SLA) is read afterwards from
# AIPerf's per-level results and Prometheus, not from this single window.
windowing:
  type: stability
  stability:
    metric: pd_topology.total_token_throughput
    width: 6
    maxStdDev: 300000000
    when:
      metric: pd_topology.total_token_throughput
      is: max

numberOfTrials: 1

# The 12 parameters. Disaggregated only (P >= 1). Study 20's pins on connector and KV buffer
# are gone, so the optimizer also tries NixlPushConnector and kv_buffer_device=cuda. No GPU
# P2P on this node: study 18 measured ~1.4 s per bf16 transfer with a cuda buffer.
parametersSelection:
  - name: pd_topology.pd_prefill_instances
    domain: [1, 3]
  - name: pd_topology.pd_decode_instances
    domain: [1, 3]
  - name: pd_topology.pd_kv_connector
    categories: ["NixlConnector", "NixlPushConnector"]
  - name: pd_topology.pd_kv_buffer_device
    categories: ["cuda", "cpu"]
  - name: vllm_prefill.gpu_memory_utilization
    domain: [0.8, 0.92]
  - name: vllm_prefill.max_num_seqs
    domain: [8, 512]
  - name: vllm_prefill.max_num_batched_tokens
    domain: [512, 16384]
  - name: vllm_prefill.kv_cache_dtype
    categories: ["auto", "fp8"]
  - name: vllm_decode.gpu_memory_utilization
    domain: [0.8, 0.92]
  - name: vllm_decode.max_num_seqs
    domain: [8, 512]
  - name: vllm_decode.max_num_batched_tokens
    domain: [512, 16384]
  - name: vllm_decode.kv_cache_dtype
    categories: ["auto", "fp8"]

# Study 20's KV-capacity constraints are left out on purpose. They left only 0.07% of the
# space disaggregated, and the queue constraint on decode now catches an over-admitting
# decode through the measurement instead (fp8 at gmu 0.9 holds ~31 full 4352-token requests,
# bf16 ~14). The remaining constraints are the physical and NIXL ones.
parameterConstraints:
  - name: one GPU per instance, 4 L4s in the pod
    formula: pd_topology.pd_prefill_instances + pd_topology.pd_decode_instances <= 4
  - name: decode batch budget covers its sequence cap
    formula: vllm_decode.max_num_batched_tokens >= vllm_decode.max_num_seqs
  - name: prefill batch budget covers its sequence cap
    formula: vllm_prefill.max_num_batched_tokens >= vllm_prefill.max_num_seqs
  - name: prefill and decode share the KV cache dtype when disaggregated
    formula: pd_topology.pd_prefill_instances == 0 || (vllm_prefill.kv_cache_dtype == "auto" && vllm_decode.kv_cache_dtype == "auto") || (vllm_prefill.kv_cache_dtype == "fp8" && vllm_decode.kv_cache_dtype == "fp8")

# At most 8 (Akamas 3.7): throughput and latency at the router, plus where each role saturates.
kpis:
  - name: Throughput totale
    formula: pd_topology.total_token_throughput
    direction: maximize
  - name: TTFT P95 (router)
    formula: pd_topology.time_to_first_token_p95
    direction: minimize
  - name: ITL P95 (router)
    formula: pd_topology.inter_token_latency_p95
    direction: minimize
  - name: Richieste in esecuzione decode (picco)
    formula: vllm_decode.num_requests_running
    direction: maximize
    aggregation: max
  - name: Utilizzo KV cache decode
    formula: vllm_decode.kv_cache_usage_avg
    direction: maximize
  - name: Richieste in coda prefill (picco)
    formula: vllm_prefill.num_requests_waiting
    direction: minimize
    aggregation: max
  - name: Tempo in coda P95 prefill
    formula: vllm_prefill.request_queue_time_p95
    direction: minimize
  - name: Preemption decode (picco)
    formula: vllm_decode.preemption_rate
    direction: minimize
    aggregation: max

# Imported baseline + 1 preset + 9 random + 100 AKAMAS (~65 min per experiment).
steps:
  # Study 20's experiment 1: 2 aggregated replicas, vLLM defaults, 1056.02 tokens/s/GPU.
  # Imported, not re-run.
  - name: baseline from study 20
    type: baseline
    from:
      - study: 552141b9-1e05-49ca-a298-878c95bc16ec
        experiments: [1]

  # 1P1D at round, pack-default-like values: 128 seqs on both roles, 8192 batched tokens
  # (two prompts per prefill step), bf16 KV. No KV cap: the bf16 decode holds ~14 full requests.
  - name: P1D1 nums_seqs 128
    type: preset
    values:
      pd_topology.pd_prefill_instances: 1
      pd_topology.pd_decode_instances: 1
      pd_topology.pd_kv_connector: "NixlConnector"
      pd_topology.pd_kv_buffer_device: "cpu"
      vllm_prefill.gpu_memory_utilization: 0.9
      vllm_prefill.max_num_seqs: 128
      vllm_prefill.max_num_batched_tokens: 8192
      vllm_prefill.kv_cache_dtype: "auto"
      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 128
      vllm_decode.max_num_batched_tokens: 8192
      vllm_decode.kv_cache_dtype: "auto"

  - name: random
    type: optimize
    optimizer: RANDOM
    numberOfExperiments: 9

  - name: optimize
    type: optimize
    optimizer: AKAMAS
    numberOfInitExperiments: 0
    numberOfExperiments: 100
    maxFailedExperiments: 20
