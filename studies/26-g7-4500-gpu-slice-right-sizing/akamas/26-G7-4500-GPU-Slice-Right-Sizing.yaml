kind: study
name: 26-G7-4500-GPU-Slice-Right-Sizing
description: >-
  MIG right-sizing sweep, no optimizer: how much traffic does each MIG partition size of an
  NVIDIA RTX PRO 4500 Blackwell (g7.4xlarge, 32 GB) sustain within the SLO, serving
  Qwen/Qwen3-4B-Instruct-2507-FP8 with vLLM 0.29.0? gpu0.mig_profile is none (whole GPU, no
  MIG), 2g.32gb (whole GPU as one MIG instance) or 1g.16gb (two halves, both serving: the
  GPU is always fully partitioned, one replica per instance). Seven presets vary
  max_num_seqs per size. Goal: aggregate prefill + decode tokens/s under TTFT p95 1500 ms /
  ITL p95 300 ms; capacity per slice = aggregate / slices. Windowing on total throughput.
  Requires GPU pack >= 1.4.0.
system: vLLM_Benchmark_26_G7_4500_GPU_Slice
workflow: 26-G7-4500-GPU-Slice-Right-Sizing-Workflow
goal:
  objective: maximize
  function:
    # Aggregate over every replica. The GPU is always fully used (one replica per MIG
    # instance), so the configurations compare like with like; the README reports the
    # per-slice capacity (this value / number of instances).
    formula: vllm.prefill_token_throughput + vllm.decode_token_throughput
    unit: tokens per second
  constraints:
    absolute:
      - name: TTFT P95 interactive-chat SLA
        formula: vllm.time_to_first_token_p95 <= 1500
      - name: ITL P95 interactive-chat SLA
        formula: vllm.inter_token_latency_p95 <= 300
# On TOTAL throughput, not prefill (study 25 used prefill): the prefill peak sits at high
# concurrency where decode slows, so a prefill-ranked window under-scored the split modes
# by up to 15 % against the best SLA-compliant window on total throughput (study 25's
# re-scoring, 2026-09-30).
windowing:
  type: stability
  stability:
    metric: vllm.total_token_throughput
    width: 6
    maxStdDev: 300000000
    when:
      metric: vllm.total_token_throughput
      is: max
numberOfTrials: 1
parametersSelection:
  - name: gpu0.mig_profile
    categories: [none, 2g.32gb, 1g.16gb]
  # The vLLM parameters are selected so every step renders them (all params.env tokens
  # must resolve); each preset pins them. Per replica.
  - name: vllm.gpu_memory_utilization
    domain: [0.80, 0.90]
  - name: vllm.max_num_seqs
    domain: [64, 768]
  - name: vllm.max_num_batched_tokens
    domain: [1024, 8192]
  - name: vllm.stream_interval
    domain: [1, 16]
kpis:
  - name: TTFT P95
    formula: vllm.time_to_first_token_p95
    direction: minimize
  - name: ITL P95
    formula: vllm.inter_token_latency_p95
    direction: minimize
  - name: Richieste in esecuzione
    formula: vllm.num_requests_running
    direction: maximize
  - name: Tempo in coda medio
    formula: vllm.request_queue_time_avg
    direction: minimize
  - name: KV cache usata
    formula: vllm.kv_cache_usage_avg
    direction: minimize
  - name: Preemption (picco)
    formula: vllm.preemption_rate
    direction: minimize
    aggregation: max
  # MIG isolates compute and memory bandwidth but not power: with both halves busy the
  # GPU sits at its 165 W cap (study 25), alone a slice ran unthrottled at 2400 MHz.
  - name: Potenza GPU
    formula: gpu0.gpu_power_usage
    direction: minimize
  - name: Clock SM
    formula: gpu0.gpu_sm_clock
    direction: maximize
steps:
  - name: baseline
    type: baseline
    numberOfTrials: 1
    values:
      gpu0.mig_profile: none
      vllm.gpu_memory_utilization: 0.90
      vllm.max_num_seqs: 256
      vllm.max_num_batched_tokens: 2048
      vllm.stream_interval: 1
  - name: MIG whole GPU seqs 256
    type: preset
    values:
      gpu0.mig_profile: 2g.32gb
      vllm.gpu_memory_utilization: 0.90
      vllm.max_num_seqs: 256
      vllm.max_num_batched_tokens: 2048
      vllm.stream_interval: 1
  # The whole GPU has 159k tokens of KV (study 25 phase 0): room for bigger batches.
  - name: MIG whole GPU seqs 512
    type: preset
    values:
      gpu0.mig_profile: 2g.32gb
      vllm.gpu_memory_utilization: 0.90
      vllm.max_num_seqs: 512
      vllm.max_num_batched_tokens: 2048
      vllm.stream_interval: 1
  - name: MIG half GPU seqs 256
    type: preset
    values:
      gpu0.mig_profile: 1g.16gb
      vllm.gpu_memory_utilization: 0.90
      vllm.max_num_seqs: 256
      vllm.max_num_batched_tokens: 2048
      vllm.stream_interval: 1
  # A 1g.16gb slice holds 56k tokens of KV: fewer sequences, less KV pressure, lower ITL.
  - name: MIG half GPU seqs 128
    type: preset
    values:
      gpu0.mig_profile: 1g.16gb
      vllm.gpu_memory_utilization: 0.90
      vllm.max_num_seqs: 128
      vllm.max_num_batched_tokens: 2048
      vllm.stream_interval: 1
  - name: MIG half GPU seqs 384
    type: preset
    values:
      gpu0.mig_profile: 1g.16gb
      vllm.gpu_memory_utilization: 0.90
      vllm.max_num_seqs: 384
      vllm.max_num_batched_tokens: 2048
      vllm.stream_interval: 1
  # The baseline again, last: a drift check on the node before trusting the gaps.
  - name: no MIG repeat
    type: preset
    values:
      gpu0.mig_profile: none
      vllm.gpu_memory_utilization: 0.90
      vllm.max_num_seqs: 256
      vllm.max_num_batched_tokens: 2048
      vllm.stream_interval: 1
