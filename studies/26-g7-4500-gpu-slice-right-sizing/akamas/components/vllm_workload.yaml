kind: component
system: vLLM_Benchmark_26_G7_4500_GPU_Slice

name: vllm_workload
description: >-
  The vLLM StatefulSet (namespace gpu-sharing) as a Kubernetes workload. Carries only
  replicas: how many of the GPU's pieces serve (1 = one MIG slice / one MPS client with the
  other piece idle, 2 = both). Rendered into params.env and applied by apply_config.sh; no
  telemetry is mapped on it.
componentType: Kubernetes Workload
