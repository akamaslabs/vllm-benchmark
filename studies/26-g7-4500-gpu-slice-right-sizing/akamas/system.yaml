kind: system

name: vLLM_Benchmark_26_G7_4500_GPU_Slice
description: >-
  GPU right-sizing sweep on one NVIDIA RTX PRO 4500 Blackwell Server Edition (g7.4xlarge, 32 GB,
  165 W, node group llm-serving-g7-4500) serving Qwen/Qwen3-4B-Instruct-2507-FP8 with
  vllm/vllm-openai:v0.29.0: how much goodput per unit of GPU one MIG slice or one MPS client
  delivers alone and with a busy neighbour, against the whole GPU. Companion of study 25
  (same node, same GPU sharing layer). Requires GPU pack >= 1.3.0, vLLM pack 1.12.0,
  Kubernetes pack. Created 2026-09-29.
