kind: system

name: vLLM_Benchmark_26_G7_4500_GPU_Slice
description: >-
  MIG right-sizing on one NVIDIA RTX PRO 4500 Blackwell Server Edition (g7.4xlarge, 32 GB,
  165 W, node group llm-serving-g7-4500) serving Qwen/Qwen3-4B-Instruct-2507-FP8 with
  vllm/vllm-openai:v0.29.0: how much traffic each MIG partition size (none, 2g.32gb, 1g.16gb)
  sustains within the SLO, the GPU always fully partitioned with one replica per instance.
  Requires GPU pack >= 1.4.0 (mig_profile), vLLM pack 1.12.0, Kubernetes pack. Created
  2026-09-29, redesigned as MIG-only 2026-09-30.
