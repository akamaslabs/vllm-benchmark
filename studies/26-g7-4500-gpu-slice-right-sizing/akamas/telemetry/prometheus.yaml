# Prometheus telemetry for 26-g7-4500-gpu-slice-right-sizing — the same 117-metric catalog
# as study 25 (derived from study 17's: same vLLM, container and node queries, GPU queries
# rewritten for a shared GPU), except active_gpus, redefined below. Rules from phase 0 and
# the audit of 2026-09-29 (study 25 README, "Telemetry rules"):
#
#   - GPU (component type GPU) queries filter on modelName=~"$GPU_MODEL$" and gpu, NEVER
#     on pod: under time-slicing and MPS the one DCGM series carries only one of the two
#     pods' names. The model-name filter also keeps any other GPU node's series out.
#     (Checked in Prometheus: after the scrape, `pod` on DCGM series is the dcgm-exporter
#     pod itself and the workload's name moves to `exported_pod` — study 17's
#     `pod=~".*"` only ever worked because it matched everything.)
#   - Under MIG every series comes once per 1g.16gb slice (label GPU_I_ID). PROF_* are
#     averaged (two equal slices -> the GPU's value); framebuffer used/reserved is summed;
#     device-level values that DCGM repeats on each slice (power, temperature, clocks,
#     violation counters, energy) use max, never sum.
#   - gpu_power_violation_rate / gpu_thermal_violation_rate are the FRACTION OF TIME the
#     GPU was throttled (0-1): DCGM counts nanoseconds of violation and updates the
#     counter every 30 s, so a [30s] rate read 0 or ~1.2e9 depending on alignment; now
#     rate over [2m] divided by 1e9.
#   - gpu_util (absent under MIG, 0 under MPS) and gpu_dram_active (absent under MIG) stay
#     in the catalog for the modes where they work, but are kept out of goal, constraints
#     and KPIs.
#   - vLLM queries: sum over the pods matched by $POD$ (both replicas for the aggregate
#     `vllm` component), p95 from the MERGED histograms (sum by le), never an average of
#     per-replica p95s. TTFT p95 near the 1500 ms SLA is interpolated inside vLLM 0.29's
#     1.0-2.5 s bucket; ITL's 300 ms is an exact bucket edge. request_queue_time_p95
#     floors at ~285 ms (first bucket 0.3 s) — use request_queue_time_avg for real values.
#   - active_gpus is REDEFINED in this study as the FRACTION of the physical GPU the
#     matched vLLM pods hold: GPU units they request (kube-state-metrics) divided by the
#     units the node advertises in the current mode. exclusive x1 = 1, one MIG slice or one
#     MPS client = 0.5, both = 1; per replica (vllm_r0/vllm_r1) 0.5 each in a split mode.
#     It is the goal's denominator (goodput per unit of GPU), checked live on 2026-09-29
#     (0.5 with one replica on one of two MIG slices). gpu_memory_allocated_gb reads DCGM
#     through exported_pod and is per-replica unreliable under mps; not scored.
#   - active_dp_engines counts (pod, engine) pairs: 1 in exclusive, 2 with two replicas.
#   - cAdvisor rate queries (container_*, k8s_cluster_cpu_util) use [2m], as studies 20/24:
#     the kubelet sometimes yields one cAdvisor point per 60 s, and a [30s] window lost
#     ~12 % of samples.
#   Dropped from study 17's catalog: the five spec_decode_* metrics (no speculation), the
#   four NVLink metrics (no NVLink on this GPU), kv_cache_capacity_* / kv_cache_used_*
#   (they read a kv-cache-exporter sidecar this StatefulSet does not have; use
#   kv_cache_usage_*) and container_cpu_throttled_millicores (its cAdvisor series is
#   dropped cluster-wide by the kubelet ServiceMonitor, and no CPU limit is set anyway).
kind: telemetry-instance
system: vLLM_Benchmark_26_G7_4500_GPU_Slice
name: Prometheus_26_G7_4500_GPU_Slice
provider: Prometheus
config:
  address: kube-prometheus-stack-prometheus.monitoring.svc.cluster.local
  port: 9090
  logLevel: DETAILED
  duration: 30
metrics:
- metric: e2e_request_latency_p95
  datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:e2e_request_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
  scale: 1
- metric: e2e_request_latency_avg
  datasourceMetric: '(sum(rate(vllm:e2e_request_latency_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:e2e_request_latency_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
  scale: 1
- metric: request_success_rate
  datasourceMetric: 'sum(rate(vllm:request_success_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
- metric: time_to_first_token_p95
  datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:time_to_first_token_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
  scale: 1
- metric: time_to_first_token_avg
  datasourceMetric: '(sum(rate(vllm:time_to_first_token_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:time_to_first_token_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
  scale: 1
- metric: prefill_token_throughput
  datasourceMetric: 'sum(rate(vllm:prompt_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
- metric: inter_token_latency_p95
  datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
  scale: 1
- metric: inter_token_latency_avg
  datasourceMetric: '(sum(rate(vllm:inter_token_latency_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:inter_token_latency_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
  scale: 1
- metric: decode_token_throughput
  datasourceMetric: 'sum(rate(vllm:generation_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
- metric: total_token_throughput
  datasourceMetric: 'sum(rate(vllm:prompt_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) + sum(rate(vllm:generation_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
- metric: request_queue_time_p95
  datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:request_queue_time_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
  scale: 1
- metric: num_requests_running
  datasourceMetric: 'sum(vllm:num_requests_running{model_name=~"$MODEL$", pod=~"$POD$"})'
- metric: num_requests_waiting
  datasourceMetric: 'sum(vllm:num_requests_waiting{model_name=~"$MODEL$", pod=~"$POD$"})'
- metric: kv_cache_usage_avg
  datasourceMetric: 'avg(vllm:kv_cache_usage_perc{model_name=~"$MODEL$", pod=~"$POD$"})'
- metric: kv_cache_usage_max
  datasourceMetric: 'max(vllm:kv_cache_usage_perc{model_name=~"$MODEL$", pod=~"$POD$"})'
- metric: preemption_rate
  datasourceMetric: 'sum(rate(vllm:num_preemptions_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
- metric: prefix_cache_hit_rate
  datasourceMetric: 'sum(rate(vllm:prefix_cache_hits_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:prefix_cache_queries_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1)'
- metric: active_gpus
  datasourceMetric: 'sum(kube_pod_container_resource_requests{resource="nvidia_com_gpu", namespace="gpu-sharing", pod=~"$POD$"}) / sum(kube_node_status_allocatable{resource="nvidia_com_gpu"} * on(node) group_left() kube_node_labels{label_node_role="llm-serving-g7-4500"})'
- metric: active_dp_engines
  datasourceMetric: 'count(count by (pod, engine) (vllm:cache_config_info{pod=~"$POD$"}))'
- metric: gpu_memory_allocated_gb
  datasourceMetric: 'sum(DCGM_FI_DEV_FB_USED{exported_pod=~"$POD$"} > 1024) * 1048576 / 1e9'
- metric: input_sequence_length_p95
  datasourceMetric: 'histogram_quantile(0.95, sum by(le)(rate(vllm:request_prompt_tokens_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m])))'
- metric: input_sequence_length_avg
  datasourceMetric: 'sum(rate(vllm:request_prompt_tokens_sum{model_name=~"$MODEL$", pod=~"$POD$"}[5m])) / clamp_min(sum(rate(vllm:request_prompt_tokens_count{model_name=~"$MODEL$", pod=~"$POD$"}[5m])), 1e-9)'
- metric: output_sequence_length_p95
  datasourceMetric: 'histogram_quantile(0.95, sum by(le)(rate(vllm:request_generation_tokens_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m])))'
- metric: output_sequence_length_avg
  datasourceMetric: 'sum(rate(vllm:request_generation_tokens_sum{model_name=~"$MODEL$", pod=~"$POD$"}[5m])) / clamp_min(sum(rate(vllm:request_generation_tokens_count{model_name=~"$MODEL$", pod=~"$POD$"}[5m])), 1e-9)'
- metric: fleet_e2e_latency_percentile
  datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:e2e_request_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m]))))*1000'
  scale: 1
- metric: fleet_inter_token_latency_percentile
  datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m]))))*1000'
  scale: 1
- metric: fleet_request_success_rate
  datasourceMetric: 'sum(rate(vllm:request_success_total{model_name=~"$MODEL$", pod=~"$POD$"}[5m]))'
- metric: fleet_kv_cache_usage_avg
  datasourceMetric: 'avg(vllm:kv_cache_usage_perc{model_name=~"$MODEL$", pod=~"$POD$"})'
- metric: inter_token_latency_p95_5m
  datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m]))))*1000'
  scale: 1
- metric: inter_token_latency_p95_max_per_pod
  datasourceMetric: '(max(histogram_quantile(0.95, sum by(pod, le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m])))))*1000'
  scale: 1
- metric: inter_token_latency_p95_min_per_pod
  datasourceMetric: '(min(histogram_quantile(0.95, sum by(pod, le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m])))))*1000'
  scale: 1
- metric: gpu_util
  datasourceMetric: 'avg(DCGM_FI_DEV_GPU_UTIL{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"}) / 100'
- metric: gpu_sm_active
  datasourceMetric: 'avg(DCGM_FI_PROF_SM_ACTIVE{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_sm_occupancy
  datasourceMetric: 'avg(DCGM_FI_PROF_SM_OCCUPANCY{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_tensor_core_active
  datasourceMetric: 'avg(DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_dram_active
  datasourceMetric: 'avg(DCGM_FI_PROF_DRAM_ACTIVE{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_fb_used
  datasourceMetric: 'sum(DCGM_FI_DEV_FB_USED{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_fb_total
  datasourceMetric: 'sum(DCGM_FI_DEV_FB_USED{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"} + DCGM_FI_DEV_FB_FREE{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_power_usage
  datasourceMetric: 'max(DCGM_FI_DEV_POWER_USAGE{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_power_limit
  datasourceMetric: 'max(DCGM_FI_DEV_POWER_MGMT_LIMIT{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_temp
  datasourceMetric: 'max(DCGM_FI_DEV_GPU_TEMP{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_memory_temp
  datasourceMetric: 'max(DCGM_FI_DEV_MEMORY_TEMP{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_power_violation_rate
  datasourceMetric: 'max(rate(DCGM_FI_DEV_POWER_VIOLATION{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"}[2m])) / 1e9'
- metric: gpu_thermal_violation_rate
  datasourceMetric: 'max(rate(DCGM_FI_DEV_THERMAL_VIOLATION{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"}[2m])) / 1e9'
- metric: gpu_pcie_replay_rate
  datasourceMetric: 'max(rate(DCGM_FI_DEV_PCIE_REPLAY_COUNTER{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"}[$DURATION$]))'
- metric: gpu_fp16_pipe_active
  datasourceMetric: 'avg(DCGM_FI_PROF_PIPE_FP16_ACTIVE{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_fp32_pipe_active
  datasourceMetric: 'avg(DCGM_FI_PROF_PIPE_FP32_ACTIVE{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: estimated_flops_per_gpu
  datasourceMetric: 'sum(rate(vllm:estimated_flops_per_gpu_total{model_name=~"$MODEL$", pod=~"$POD$"}[1m])) / 1e12'
- metric: estimated_read_bytes_per_gpu
  datasourceMetric: 'sum(rate(vllm:estimated_read_bytes_per_gpu_total{model_name=~"$MODEL$", pod=~"$POD$"}[1m])) / 1e9'
- metric: estimated_write_bytes_per_gpu
  datasourceMetric: 'sum(rate(vllm:estimated_write_bytes_per_gpu_total{model_name=~"$MODEL$", pod=~"$POD$"}[1m])) / 1e9'
- metric: gpu_fp64_pipe_active
  datasourceMetric: 'avg(DCGM_FI_PROF_PIPE_FP64_ACTIVE{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_sm_clock
  datasourceMetric: 'avg(DCGM_FI_DEV_SM_CLOCK{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_mem_clock
  datasourceMetric: 'avg(DCGM_FI_DEV_MEM_CLOCK{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_total_energy_consumption
  datasourceMetric: 'max(DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_mem_copy_util
  datasourceMetric: 'avg(DCGM_FI_DEV_MEM_COPY_UTIL{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"}) / 100'
- metric: gpu_enc_util
  datasourceMetric: 'avg(DCGM_FI_DEV_ENC_UTIL{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"}) / 100'
- metric: gpu_dec_util
  datasourceMetric: 'avg(DCGM_FI_DEV_DEC_UTIL{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"}) / 100'
- metric: gpu_gr_engine_active
  datasourceMetric: 'avg(DCGM_FI_PROF_GR_ENGINE_ACTIVE{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_xid_errors
  datasourceMetric: 'max(DCGM_FI_DEV_XID_ERRORS{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_uncorrectable_remapped_rows
  datasourceMetric: 'max(DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_correctable_remapped_rows
  datasourceMetric: 'max(DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_row_remap_failure
  datasourceMetric: 'max(DCGM_FI_DEV_ROW_REMAP_FAILURE{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_clock_throttle_reasons
  datasourceMetric: 'max(DCGM_FI_DEV_CLOCK_THROTTLE_REASONS{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_fb_reserved
  datasourceMetric: 'sum(DCGM_FI_DEV_FB_RESERVED{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_fb_used_percent
  datasourceMetric: 'max(DCGM_FI_DEV_FB_USED_PERCENT{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_vgpu_license_status
  datasourceMetric: 'max(DCGM_FI_DEV_VGPU_LICENSE_STATUS{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_pcie_tx_bytes
  datasourceMetric: 'sum(DCGM_FI_PROF_PCIE_TX_BYTES{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_pcie_rx_bytes
  datasourceMetric: 'sum(DCGM_FI_PROF_PCIE_RX_BYTES{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_count
  datasourceMetric: 'max(DCGM_FI_DEV_COUNT{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_fan_speed
  datasourceMetric: 'avg(DCGM_FI_DEV_FAN_SPEED{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"}) / 100'
- metric: gpu_slowdown_temp
  datasourceMetric: 'max(DCGM_FI_DEV_SLOWDOWN_TEMP{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: gpu_pstate
  datasourceMetric: 'min(DCGM_FI_DEV_PSTATE{modelName=~"$GPU_MODEL$", gpu=~"$GPU$"})'
- metric: container_cpu_pressure_some
  datasourceMetric: 'sum(rate(container_pressure_cpu_waiting_seconds_total{pod=~"$POD$", container!=""}[2m]))'
- metric: container_cpu_pressure_full
  datasourceMetric: 'sum(rate(container_pressure_cpu_stalled_seconds_total{pod=~"$POD$", container!=""}[2m]))'
- metric: container_memory_pressure_some
  datasourceMetric: 'sum(rate(container_pressure_memory_waiting_seconds_total{pod=~"$POD$", container!=""}[2m]))'
- metric: container_memory_pressure_full
  datasourceMetric: 'sum(rate(container_pressure_memory_stalled_seconds_total{pod=~"$POD$", container!=""}[2m]))'
- metric: container_io_pressure_some
  datasourceMetric: 'sum(rate(container_pressure_io_waiting_seconds_total{pod=~"$POD$", container!=""}[2m]))'
- metric: container_io_pressure_full
  datasourceMetric: 'sum(rate(container_pressure_io_stalled_seconds_total{pod=~"$POD$", container!=""}[2m]))'
- metric: container_cpu_used
  datasourceMetric: '1000 * sum(rate(container_cpu_usage_seconds_total{pod=~"$POD$", container!=""}[2m]))'
- metric: container_cpu_used_max
  datasourceMetric: '1000 * max(sum by(pod)(rate(container_cpu_usage_seconds_total{pod=~"$POD$", container!=""}[2m])))'
- metric: container_cpu_util
  datasourceMetric: 'sum(rate(container_cpu_usage_seconds_total{pod=~"$POD$", container!=""}[2m])) / clamp_min(sum(kube_pod_container_resource_limits{resource="cpu", pod=~"$POD$", container!=""}), 1e-9)'
- metric: container_cpu_util_max
  datasourceMetric: 'max(sum by(pod)(rate(container_cpu_usage_seconds_total{pod=~"$POD$", container!=""}[2m])) / clamp_min(sum by(pod)(kube_pod_container_resource_limits{resource="cpu", pod=~"$POD$", container!=""}), 1e-9))'
- metric: container_cpu_throttle_time
  datasourceMetric: 'sum(rate(container_cpu_cfs_throttled_periods_total{pod=~"$POD$", container!=""}[2m])) / clamp_min(sum(rate(container_cpu_cfs_periods_total{pod=~"$POD$", container!=""}[2m])), 1e-9)'
- metric: container_cpu_request
  datasourceMetric: '1000 * sum(kube_pod_container_resource_requests{resource="cpu", pod=~"$POD$", container!=""})'
- metric: container_cpu_limit
  datasourceMetric: '1000 * sum(kube_pod_container_resource_limits{resource="cpu", pod=~"$POD$", container!=""})'
- metric: container_memory_used
  datasourceMetric: 'sum(container_memory_usage_bytes{pod=~"$POD$", container!=""})'
- metric: container_memory_used_max
  datasourceMetric: 'max(sum by(pod)(container_memory_usage_bytes{pod=~"$POD$", container!=""}))'
- metric: container_memory_util
