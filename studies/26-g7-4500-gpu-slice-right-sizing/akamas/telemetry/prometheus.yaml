- metric: container_memory_cache
  datasourceMetric: 'sum(container_memory_cache{pod=~"$POD$", container!=""})'
- metric: container_memory_request
  datasourceMetric: 'sum(kube_pod_container_resource_requests{resource="memory", pod=~"$POD$", container!=""})'
- metric: container_memory_limit
  datasourceMetric: 'sum(kube_pod_container_resource_limits{resource="memory", pod=~"$POD$", container!=""})'
