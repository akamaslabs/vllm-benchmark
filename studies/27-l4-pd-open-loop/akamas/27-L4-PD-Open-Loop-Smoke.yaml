kind: study
name: 27-L4-PD-Open-Loop-Smoke
description: >-
  Smoke test of study 27's open-loop load before the real study: one trial of the P1D1
  (prefill triton tuned, bf16 KV) with a 10-minute ramp to 1.5 req/s, ended by the watchdog.
  It checks the ramp, the watchdog, the metrics and the constraints in Akamas. Delete it after
  the check.
# Same system, telemetry, goal, constraints, windowing and parameters as 27-L4-PD-Open-Loop.yaml
# (copied), with the smoke workflow (27-L4-PD-Open-Loop-Smoke-Workflow.yaml).
system: vLLM_Benchmark_27_L4_PD_Open_Loop
workflow: 27-L4-PD-Open-Loop-Smoke-Workflow

# Same goal as studies 22-23: tokens/s per GPU holding weights, all terms from pd_topology
# (the router). Latency constraints change: the p95 is taken over 150 s (the span of the
# 6-sample stability window) and aggregated with :max, instead of the average of six 30 s
# p95s. The 30 s p95 made the score of configs near the limits depend on sample alignment
# (study 22's P1D1: 986 / 1399 / 1383 for offsets of 0 / 10 / 20 s). See the STUDY 24 note in
# telemetry/prometheus.yaml. TTFT stays at 10 s: the kernel differences show at high load,
# where the prefill is the bottleneck; a 5 s limit would cut the windows near concurrency 8.
# A 5 s view can be recomputed afterwards from Prometheus.
# STUDY 27: the two `num_requests_waiting <= 1` constraints of studies 22-24 are removed. They
# showed saturation in a closed loop, where the queue cannot grow past the concurrency. With
# an open loop, past the capacity the queue grows without limit and the TTFT constraint shows
# it. With Poisson arrivals the queue also moves up and down below the capacity, so a
# waiting constraint would fail windows that meet the SLA.
goal:
  objective: maximize
  function:
    formula: pd_topology.total_token_throughput / pd_topology.active_gpus
    unit: tokens per second/gpus
  constraints:
    absolute:
      - name: TTFT P95 over 150 s at the router
        formula: pd_topology.time_to_first_token_p95_150s:max <= 10000
      - name: ITL P95 over 150 s at the router
        formula: pd_topology.inter_token_latency_p95_150s:max <= 75

windowing:
  type: stability
  stability:
    metric: pd_topology.total_token_throughput
    width: 6
    maxStdDev: 300000000
    when:
      metric: pd_topology.total_token_throughput
      is: max

numberOfTrials: 1

# Kernel domains from kernel-bench (2026-09-29):
# - prefill linear: triton (-36% prefill step against Marlin), humming (-24%), marlin (the
#   reference; auto selects Marlin on L4, so auto is not listed separately).
# - decode linear: marlin and humming (equal); triton is slower on decode (+8% TPOT even
#   tuned), so it is out.
# - attention: FLASHINFER and FLASH_ATTN (equal prefill step); TRITON_ATTN is 14% slower on
#   prefill, so it is out. One parameter for both roles (NIXL compatibility hash): the
#   template renders vllm_decode.attention_backend and vllm_decode.kv_cache_dtype in
#   common.args. vllm_prefill.attention_backend / kv_cache_dtype must NOT be selected, and no
#   equality constraint between two categoricals may be written (it breaks the AKAMAS step).
# - tuned_kernel_configs: -4% prefill step for triton. One value for the pod.
# Topology: prefill 0-3, decode 1-2 (0 prefill = aggregated replicas, for the baseline). The
# connector is pinned to NixlConnector (push: TTFT above 10 s at concurrency 8 in study 23) and
# the buffer to cpu (no GPU P2P), by constraints: a one-value domain is rejected.
parametersSelection:
  - name: pd_topology.pd_prefill_instances
    domain: [0, 3]
  - name: pd_topology.pd_decode_instances
    domain: [1, 2]
  - name: pd_topology.pd_kv_connector
    categories: ["NixlConnector", "NixlPushConnector"]
  - name: pd_topology.pd_kv_buffer_device
    categories: ["cuda", "cpu"]
  - name: vllm_prefill.gpu_memory_utilization
    domain: [0.8, 0.92]
  - name: vllm_prefill.max_num_seqs
    domain: [8, 512]
  - name: vllm_prefill.max_num_batched_tokens
    domain: [512, 16384]
  - name: vllm_prefill.linear_backend
    categories: ["marlin", "humming", "triton"]
  - name: vllm_decode.gpu_memory_utilization
    domain: [0.8, 0.92]
  - name: vllm_decode.max_num_seqs
    domain: [8, 512]
  - name: vllm_decode.max_num_batched_tokens
    domain: [512, 16384]
  - name: vllm_decode.linear_backend
    categories: ["marlin", "humming"]
  - name: vllm_decode.attention_backend
    categories: ["FLASHINFER", "FLASH_ATTN"]
  - name: vllm_decode.kv_cache_dtype
    categories: ["auto", "fp8"]
  - name: vllm_decode.tuned_kernel_configs
    categories: ["true", "false"]

# Every constraint with a quoted value or || is evaluated as a boolean (rejection sampling).
parameterConstraints:
  - name: one GPU per instance, 4 L4s in the pod
    formula: pd_topology.pd_prefill_instances + pd_topology.pd_decode_instances <= 4
  - name: decode batch budget covers its sequence cap
    formula: vllm_decode.max_num_batched_tokens >= vllm_decode.max_num_seqs
  - name: prefill batch budget covers its sequence cap
    formula: vllm_prefill.max_num_batched_tokens >= vllm_prefill.max_num_seqs
  - name: pull connector (push breaks TTFT with a host buffer, study 23)
    formula: pd_topology.pd_kv_connector == "NixlConnector"
  - name: host-staged KV transfer (no GPU P2P on g6.12xlarge)
    formula: pd_topology.pd_kv_buffer_device == "cpu"
  - name: FLASH_ATTN is FlashAttention 2 on sm89 and rejects an fp8 KV cache
    formula: vllm_decode.attention_backend != "FLASH_ATTN" || vllm_decode.kv_cache_dtype == "auto"
  - name: tuned configs matter only for the triton linear backend (no duplicate points)
    formula: vllm_decode.tuned_kernel_configs == "false" || vllm_prefill.linear_backend == "triton"
  # Prefill OOM of study 23 experiments 12-13 (0.92 with ~16k batched tokens, triton: the
  # 768 MiB gate/up output did not fit). Headroom (1 - gmu) x 22.03 GiB must cover ~0.16 MiB
  # per batched token. Calibrated on 2 crashes and 3 good runs.
  - name: prefill activation headroom for the batched tokens
    formula: vllm_prefill.gpu_memory_utilization * 22.03 + vllm_prefill.max_num_batched_tokens * 0.00016 <= 22.03

# At most 8 (Akamas 3.7).
kpis:
  - name: Throughput totale
    formula: pd_topology.total_token_throughput
    direction: maximize
  - name: TTFT P95 150s (router)
    formula: pd_topology.time_to_first_token_p95_150s
    direction: minimize
    aggregation: max
  - name: ITL P95 150s (router)
    formula: pd_topology.inter_token_latency_p95_150s
    direction: minimize
    aggregation: max
  - name: Richieste in esecuzione decode (picco)
    formula: vllm_decode.num_requests_running
    direction: maximize
    aggregation: max
  - name: Utilizzo KV cache decode
    formula: vllm_decode.kv_cache_usage_avg
    direction: maximize
  - name: Richieste in coda prefill (picco)
    formula: vllm_prefill.num_requests_waiting
    direction: minimize
    aggregation: max
  - name: Tempo in coda P95 prefill
    formula: vllm_prefill.request_queue_time_p95
    direction: minimize
  - name: Preemption decode (picco)
    formula: vllm_decode.preemption_rate
    direction: minimize
    aggregation: max

# One trial: the ramp crosses the P1D1's capacity (~0.69 req/s) at ~4.6 min, and the
# watchdog should end it at ~6-8 min. About 20-25 min with the pod start.
steps:
  - name: P1D1 prefill triton tuned
    type: baseline
    values:
      pd_topology.pd_prefill_instances: 1
      pd_topology.pd_decode_instances: 1
      pd_topology.pd_kv_connector: "NixlConnector"
      pd_topology.pd_kv_buffer_device: "cpu"
      vllm_prefill.gpu_memory_utilization: 0.9
      vllm_prefill.max_num_seqs: 128
      vllm_prefill.max_num_batched_tokens: 8192
      vllm_prefill.linear_backend: "triton"
      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 128
      vllm_decode.max_num_batched_tokens: 8192
      vllm_decode.linear_backend: "marlin"
      vllm_decode.attention_backend: "FLASHINFER"
      vllm_decode.kv_cache_dtype: "auto"
      vllm_decode.tuned_kernel_configs: "true"
