      vllm_decode.tuned_kernel_configs: "true"

  # "P1D1 kv fp8" with the decode sequence cap at the expected limit: ITL 75 ms and the fp8
  # KV capacity both allow ~29-31 sequences. Expected: the same score as with 128.
  - name: P1D1 kv fp8 decode seqs 32
    type: preset
    values:
