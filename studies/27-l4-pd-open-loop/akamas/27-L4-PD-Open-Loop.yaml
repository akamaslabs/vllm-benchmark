      vllm_decode.gpu_memory_utilization: 0.9
      vllm_decode.max_num_seqs: 32
      vllm_decode.max_num_batched_tokens: 8192
      vllm_decode.linear_backend: "marlin"
      vllm_decode.attention_backend: "FLASHINFER"
      vllm_decode.kv_cache_dtype: "fp8"
      vllm_decode.tuned_kernel_configs: "true"

  - name: optimize
    type: optimize
    optimizer: AKAMAS
    numberOfInitExperiments: 0
    numberOfExperiments: 60
    maxFailedExperiments: 20
