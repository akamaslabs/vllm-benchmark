kind: system

name: vLLM_Benchmark_30_L40S_Gemma4_TPS
description: >-
  Study 30: base vLLM configuration tuning (single GPU, no parallelism) of
  RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic (vllm/vllm-openai:v0.29.0, served as
  gemma4-26b-l40s) on one NVIDIA L40S 48 GB (g6e.xlarge, node group llm-serving-l40s-1xl).
  Goal: total tokens/s (prompt + generation) under TTFT p95 <= 1.5 s and ITL p95 <= 300 ms,
  with study 27's open-loop AIPerf rate ramp on ShareGPT. Requires vLLM pack 1.12.0, GPU
  pack, Kubernetes pack. Created 2026-10-05.
