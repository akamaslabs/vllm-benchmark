# OPTIONAL — RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic and the ShareGPT dataset are ungated
# (checked 2026-10-05). vLLM and AIPerf read the token with `optional: true`, only to
# avoid anonymous Hugging Face rate limits on the ~27 GiB download.
# Template — do NOT commit with a real token. Create it by hand if needed:
#
#   kubectl create secret generic hf-token \
#     --from-literal=token=hf_xxxxxxxxxxxxxxxxxxxx \
#     --namespace llm-l40s
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: llm-l40s
type: Opaque
stringData:
  token: "REPLACE_WITH_YOUR_HF_TOKEN"
