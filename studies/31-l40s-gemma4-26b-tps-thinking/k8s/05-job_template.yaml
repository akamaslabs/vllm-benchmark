# AIPerf Job for 31-l40s-gemma4-26b-tps-thinking. Rendered by render_job.sh (token LOAD_ARGS
# between at-signs).
#
# ShareGPT replay (AIPerf's --public-dataset sharegpt, tokenized once with the Gemma 4
# tokenizer and cached as inputs.json, as studies 26/28), OPEN LOOP with study 27's
# generator: a linear rate ramp 0 -> R over D s (--request-rate R
# --request-rate-ramp-duration D), gamma arrivals (smoothness 4), fixed seed, so every
# trial receives the same arrival sequence. AIPERF_TIMING_RATE_RAMP_UPDATE_INTERVAL=10:
# without it AIPerf 0.11.0 draws the first wait at ~0 req/s and the ramp sends nothing for
# minutes (study 27, smoke run 1).
# Before the measured run: 8 requests at concurrency 4 (discarded). Study 30 ran 60 s at
# concurrency 4; with thinking a request can outlive that, and AIPerf 0.11.0 then exits non-zero
# ("No profile results to export": no request completed in the window), which would fail every
# trial (seen in k8s/tests/dry_run_thinking.sh with 72 s requests). A count ends when the 8
# requests complete, however long they reason. The marker line "MEASURED RUN START" arms
# run_test.sh's watchdog.
#
# Thinking mode (the one difference from study 30): AIPerf's ShareGPT loader sets each
# request's max_tokens to the length of the ShareGPT reply (aiperf 0.11.0
# dataset/loader/sharegpt.py, `max_tokens=completion_length`), and the inputs_json replay sends
# the payloads verbatim. With thinking on, the reasoning trace would use up that budget and
# almost every request would stop mid-thought. The Job therefore derives, once, a copy of the
# cache without max_tokens / max_completion_tokens (inputs-<model>-nomax.json): each request
# reasons and answers until it stops, capped by vLLM at max_model_len - prompt. Both AIPerf runs
# read that copy. At the end of a run that completes (not one the watchdog stops), the Job
# prints the distribution of reasoning / answer tokens and TTFT / time to the first answer
# token from profile_export.jsonl ("LENGTHS" lines), and how many outputs may have hit
# max_model_len.
apiVersion: batch/v1
kind: Job
metadata:
  name: aiperf-l40s
  namespace: llm-l40s
  labels:
    app: aiperf-l40s
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: aiperf-l40s
    spec:
      restartPolicy: Never
      nodeSelector:
        node-role: system-m8a
      initContainers:
        - name: wait-for-vllm
          image: alpine:3
          command:
            - sh
            - -c
            - |
              until wget -qO- http://vllm-0.vllm-headless.llm-l40s.svc.cluster.local:8000/health >/dev/null 2>&1; do
                echo "$(date -u +%T) waiting for vllm-0..."
                sleep 10
              done
              echo "vllm-0 is ready."
      containers:
        - name: aiperf
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - |
              set -e
              pip install --quiet aiperf==0.11.0
              MODEL_NAME=gemma4-26b-l40s-think
              TOKENIZER=RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
              URL=http://vllm-0.vllm-headless.llm-l40s.svc.cluster.local:8000
              OUT=/benchmarks/study31
              rm -rf "$OUT"; mkdir -p "$OUT"
              CACHE_DIR=/benchmarks/sharegpt-cache
              CACHE_FILE=$CACHE_DIR/inputs-$MODEL_NAME.json
              mkdir -p "$CACHE_DIR"
              if [ ! -f "$CACHE_FILE" ]; then
                echo "No cached ShareGPT inputs for $MODEL_NAME: generating once (~5-10 min)..."
                set +e
                aiperf profile --model "$MODEL_NAME" --tokenizer "$TOKENIZER" --url "$URL" \
                  --endpoint-type chat --streaming --public-dataset sharegpt \
                  --concurrency 1 --request-count 1 --ui simple \
                  --output-artifact-dir /tmp/sharegpt-prep
                set -e
                [ -f /tmp/sharegpt-prep/inputs.json ] || { echo "ERROR: prep run did not produce inputs.json" >&2; exit 1; }
                cp /tmp/sharegpt-prep/inputs.json "$CACHE_FILE.tmp" && mv "$CACHE_FILE.tmp" "$CACHE_FILE"
              fi
              if grep -o '"model": *"[^"]*"' "$CACHE_FILE" | grep -qv "\"$MODEL_NAME\""; then
                echo "ERROR: $CACHE_FILE references a model other than $MODEL_NAME" >&2; exit 1
              fi
              NOMAX_FILE=$CACHE_DIR/inputs-$MODEL_NAME-nomax.json
              if [ ! -f "$NOMAX_FILE" ]; then
                python3 - "$CACHE_FILE" "$NOMAX_FILE.tmp" <<'EOF'
              import json, sys
              d = json.load(open(sys.argv[1]))
              n = dropped = 0
              for session in d["data"]:
                  for p in session["payloads"]:
                      n += 1
                      for k in ("max_tokens", "max_completion_tokens"):
                          if p.pop(k, None) is not None:
                              dropped += 1
              json.dump(d, open(sys.argv[2], "w"))
              print("nomax: %d payloads, %d max_tokens fields dropped" % (n, dropped))
              if dropped == 0:
                  sys.exit("ERROR: no max_tokens field found: the cache format changed")
              EOF
                mv "$NOMAX_FILE.tmp" "$NOMAX_FILE"
              fi
              if grep -qE '"max_(completion_)?tokens"' "$NOMAX_FILE"; then
                echo "ERROR: $NOMAX_FILE still carries max_tokens" >&2; exit 1
              fi
              echo "$(date -u +%T) warm-up: 8 requests at concurrency 4 (discarded)"
              aiperf profile --model "$MODEL_NAME" --tokenizer "$TOKENIZER" --url "$URL" \
                --endpoint-type chat --streaming \
                --input-file "$NOMAX_FILE" --custom-dataset-type inputs_json \
                --concurrency 4 --request-count 8 --ui simple \
                --output-artifact-dir /tmp/warmup > /tmp/warmup.log 2>&1 \
                || { tail -50 /tmp/warmup.log; exit 1; }
              echo "$(date -u +%T) MEASURED RUN START: @LOAD_ARGS@"
              RUN_DIR=$OUT/aiperf-$(date +%s)
              aiperf profile --model "$MODEL_NAME" --tokenizer "$TOKENIZER" --url "$URL" \
                --endpoint-type chat --streaming \
                --input-file "$NOMAX_FILE" --custom-dataset-type inputs_json \
                @LOAD_ARGS@ \
                --goodput "time_to_first_token:1500 inter_token_latency:300" \
                --ui simple \
                --output-artifact-dir "$RUN_DIR"
              python3 - "$RUN_DIR/profile_export.jsonl" <<'EOF' || true
              import json, sys
              # No input_sequence_length: AIPerf 0.11.0 does not tokenize inputs_json payloads.
              cols = {"reasoning_token_count": [], "output_token_count": [], "output_sequence_length": [],
                      "time_to_first_token": [], "time_to_first_output_token": []}
              errors = 0
              for line in open(sys.argv[1]):
                  r = json.loads(line)
                  if r.get("error"):
                      errors += 1
                      continue
                  for k, v in cols.items():
                      m = r.get("metrics", {}).get(k)
                      if m is not None and m.get("value") is not None:
                          v.append(float(m["value"]))
              def pct(v, q):
                  v = sorted(v)
                  return v[min(len(v) - 1, int(q * len(v)))]
              print("LENGTHS: %d requests ok, %d errors" % (len(cols["output_sequence_length"]), errors))
              for k, v in cols.items():
                  if v:
                      print("LENGTHS %-28s n=%5d mean=%9.1f p50=%9.1f p90=%9.1f p99=%9.1f max=%9.1f"
                            % (k, len(v), sum(v) / len(v), pct(v, .5), pct(v, .9), pct(v, .99), max(v)))
                  else:
                      print("LENGTHS %-28s no values" % k)
              # AIPerf keeps ShareGPT prompts <= 1024 tokens (base_public_dataset.py max_prompt_len),
              # so an output past 16384 - 1024 - ~60 template tokens may have hit max_model_len.
              osl = cols["output_sequence_length"]
              if osl:
                  print("LENGTHS output >= 15300 tokens (may have hit max_model_len 16384): %d of %d"
                        % (sum(o >= 15300 for o in osl), len(osl)))
              EOF
          env:
            - name: AIPERF_TIMING_RATE_RAMP_UPDATE_INTERVAL
              value: "10"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: HF_HOME
              value: /hf-cache
          resources:
            # Study 30's request, kept: with thinking the ramp tops out at a few req/s, but every
            # request streams far more tokens; study 26 measured ~1.3 cores at ~20 req/s.
            # system-m8a has 3.92 allocatable, ~0.3 requested.
            requests:
              cpu: 2000m
              memory: 3Gi
          volumeMounts:
            - name: results
              mountPath: /benchmarks
            - name: hf-cache
              mountPath: /hf-cache
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: aiperf-results
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
