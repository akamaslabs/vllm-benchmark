kind: workflow
name: 32-L40S-Gemma4-AWQ-Thinking-Workflow
# The study: study 27's open-loop linear rate ramp of synthetic multi-turn chat, 0 -> 2 req/s
# over 6000 s. PROVISIONAL until the smoke run (README "Runbook"): estimated from study 31's knee
# scaled to ~3.4k-token prompts and the compose's 64 sequences; the smoke run sets R so that both
# the baseline and the "kv fp8 large batch" preset reach their knee. The RunTest timeout stays
# above RT_RAMP_S + 1500 s; once this workflow is created, a change means delete and recreate.
# All three tasks run on the toolbox host over SSH with the toolbox's own key
# (/home/akamas/.ssh/id_rsa, mounted from the toolbox-keys secret; the path must exist on
# the toolbox when `akamas create workflow` runs, so run it from the toolbox).
tasks:
  # The parameters are rendered into an env file, not into a manifest: render_statefulset.sh
  # validates them and writes the vLLM flags (booleans as --x / --no-x, which a plain
  # ${vllm.param} token in the manifest could not do). ignoreUnsubstitutedTokens false: every
  # token must resolve.
  - name: Write config
    operator: FileConfigurator
    arguments:
      ignoreUnsubstitutedTokens: false
      source:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/vllm-benchmark/studies/32-l40s-gemma4-26b-awq-thinking/k8s/params.env.template
      target:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/vllm-benchmark/studies/32-l40s-gemma4-26b-awq-thinking/k8s/params.env
  - name: Apply config
    operator: Executor
    arguments:
      retries: 0
      # apply_config.sh's rollout wait (2400 s: cold node = image pull + 16 GiB model
      # download) plus the warm-up and the log dump.
      timeout: 45m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/vllm-benchmark/studies/32-l40s-gemma4-26b-awq-thinking/k8s/apply_config.sh
  - name: RunTest
    operator: Executor
    arguments:
      retries: 0
      # Above run_test.sh's own deadline (RT_RAMP_S + 1500 s), so its log dump always runs.
      timeout: 130m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: RT_RATE=2 RT_RAMP_S=6000 bash /work/vllm-benchmark/studies/32-l40s-gemma4-26b-awq-thinking/k8s/run_test.sh
