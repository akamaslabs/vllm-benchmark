- metric: gpu_pcie_replay_rate
  datasourceMetric: 'max(rate(DCGM_FI_DEV_PCIE_REPLAY_COUNTER{modelName=~"$GPUMODEL$", gpu=~"$GPU$"}[$DURATION$]))'
- metric: gpu_fp16_pipe_active
  datasourceMetric: 'avg(DCGM_FI_PROF_PIPE_FP16_ACTIVE{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_fp32_pipe_active
  datasourceMetric: 'avg(DCGM_FI_PROF_PIPE_FP32_ACTIVE{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: estimated_flops_per_gpu
  datasourceMetric: 'sum(rate(vllm:estimated_flops_per_gpu_total{model_name=~"$MODEL$", pod=~"$POD$"}[1m])) / 1e12'
- metric: estimated_read_bytes_per_gpu
  datasourceMetric: 'sum(rate(vllm:estimated_read_bytes_per_gpu_total{model_name=~"$MODEL$", pod=~"$POD$"}[1m])) / 1e9'
- metric: estimated_write_bytes_per_gpu
  datasourceMetric: 'sum(rate(vllm:estimated_write_bytes_per_gpu_total{model_name=~"$MODEL$", pod=~"$POD$"}[1m])) / 1e9'
- metric: gpu_fp64_pipe_active
  datasourceMetric: 'avg(DCGM_FI_PROF_PIPE_FP64_ACTIVE{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_sm_clock
  datasourceMetric: 'avg(DCGM_FI_DEV_SM_CLOCK{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_mem_clock
  datasourceMetric: 'avg(DCGM_FI_DEV_MEM_CLOCK{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_total_energy_consumption
  datasourceMetric: 'max(DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_mem_copy_util
  datasourceMetric: 'avg(DCGM_FI_DEV_MEM_COPY_UTIL{modelName=~"$GPUMODEL$", gpu=~"$GPU$"}) / 100'
- metric: gpu_enc_util
  datasourceMetric: 'avg(DCGM_FI_DEV_ENC_UTIL{modelName=~"$GPUMODEL$", gpu=~"$GPU$"}) / 100'
- metric: gpu_dec_util
  datasourceMetric: 'avg(DCGM_FI_DEV_DEC_UTIL{modelName=~"$GPUMODEL$", gpu=~"$GPU$"}) / 100'
- metric: gpu_gr_engine_active
  datasourceMetric: 'avg(DCGM_FI_PROF_GR_ENGINE_ACTIVE{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_xid_errors
  datasourceMetric: 'max(DCGM_FI_DEV_XID_ERRORS{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_uncorrectable_remapped_rows
  datasourceMetric: 'max(DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_correctable_remapped_rows
  datasourceMetric: 'max(DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_row_remap_failure
  datasourceMetric: 'max(DCGM_FI_DEV_ROW_REMAP_FAILURE{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_clock_throttle_reasons
  datasourceMetric: 'max(DCGM_FI_DEV_CLOCK_THROTTLE_REASONS{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_fb_reserved
  datasourceMetric: 'sum(DCGM_FI_DEV_FB_RESERVED{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_fb_used_percent
