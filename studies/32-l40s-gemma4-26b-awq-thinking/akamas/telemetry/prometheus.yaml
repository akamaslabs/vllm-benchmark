- metric: gpu_fb_total
  datasourceMetric: 'sum(DCGM_FI_DEV_FB_USED{modelName=~"$GPUMODEL$", gpu=~"$GPU$"} + DCGM_FI_DEV_FB_FREE{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_power_usage
  datasourceMetric: 'max(DCGM_FI_DEV_POWER_USAGE{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_power_limit
  datasourceMetric: 'max(DCGM_FI_DEV_POWER_MGMT_LIMIT{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_temp
  datasourceMetric: 'max(DCGM_FI_DEV_GPU_TEMP{modelName=~"$GPUMODEL$", gpu=~"$GPU$"})'
- metric: gpu_memory_temp
