# Namespaces for 32-l40s-gemma4-26b-awq-thinking. The vLLM StatefulSet and the AIPerf Job live in
# llm-l40s, shared with study 30 (which runs before it on the same node); nothing is shared
# with the namespaces other studies use (llm-serving,
