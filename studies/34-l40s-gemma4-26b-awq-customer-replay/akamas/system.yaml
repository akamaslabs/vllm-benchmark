kind: system

name: vLLM_Benchmark_34_L40S_Gemma4_AWQ_Replay
description: >-
  Study 34: a customer's Docker Compose setup on one NVIDIA L40S 48 GB (g6e.xlarge, node group
  llm-serving-l40s-1xl), thinking on (enable_thinking true, as study 32). Base vLLM
  configuration tuning (single GPU, no parallelism) of cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit rev
  0ef577a (W4A16 int4; vllm/vllm-openai:v0.29.0, served as aiservices_gemma with
  max_model_len 96000, tool calling, the gemma4 reasoning parser). Goal: completed requests/s
  with the e2e p95 <= 30 s (provisional), under the customer's own AIPerf replay (/v1/responses,
  their dataset, users ramping in a closed loop). Requires vLLM pack 1.12.0, GPU pack, Kubernetes pack. Created 2026-10-12.
