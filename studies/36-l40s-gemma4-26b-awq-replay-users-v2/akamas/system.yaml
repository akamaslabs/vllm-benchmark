kind: system

name: vLLM_Benchmark_36_L40S_Gemma4_AWQ_Replay_Users_v2
description: >-
  Study 36 (study 35 with the parameters fixed): a customer's Docker Compose setup of Gemma 4 26B-A4B (cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
  rev 0ef577a, W4A16; vllm/vllm-openai:v0.29.0, served as aiservices_gemma, max_model_len 96000,
  tool calling, gemma4 reasoning parser, thinking off by default) on one NVIDIA L40S 48 GB
  (g6e.xlarge, cluster vllm-bench), under the customer's own AIPerf replay of their
  dataset template rendered with Italian texts, users ramping in a closed loop. Goal: the most
  users (AIPerf sessions) with the client-side e2e median (150 s) at most 3 s. Requires the vLLM
  pack 1.14.0, the AIPerf pack 1.0.0, the GPU and Kubernetes packs. Created 2026-10-14.
