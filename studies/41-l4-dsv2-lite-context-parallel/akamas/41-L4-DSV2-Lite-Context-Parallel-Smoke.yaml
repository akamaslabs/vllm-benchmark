kind: study
name: 41-L4-DSV2-Lite-Context-Parallel-Smoke
description: 'Calibration run for study 41: TP4 baseline, TP4+DCP4, TP4+DCP4 fp8 KV and TP1xPCP4+EP, one
  trial each, with the Smoke workflow''s steeper users ramp, same system, goal, constraints, windowing,
  parameters and KPIs as 41-L4-DSV2-Lite-Context-Parallel. It checks the pipeline end to end, prefix caching
  with DCP and PCP, fp8 KV with DCP, and places the knees, which set the main workflow''s RT_USERS / RT_RAMP_S.
  Delete it afterwards.'
workflow: 41-L4-DSV2-Lite-Context-Parallel-Smoke-Workflow
system: vLLM_Benchmark_41_L4_DSV2_Lite_CP
goal:
  objective: maximize
  function:
    formula: vllm.decode_token_throughput
    unit: tokens per second
  constraints:
    absolute:
    - name: TTFT P95 over 150 s
      formula: vllm.time_to_first_token_p95:max <= 10000
    - name: TPOT P95 over 150 s
      formula: vllm.time_per_output_token_p95:max <= 50
windowing:
  type: stability
  stability:
    metric: vllm.decode_token_throughput
    width: 6
    maxStdDev: 300000000
    when:
      metric: vllm.decode_token_throughput
      is: max
numberOfTrials: 1
parametersSelection:
- name: vllm.tensor_parallel_size
  domain:
  - 1
  - 4
- name: vllm.data_parallel_size
  domain:
  - 1
  - 4
- name: vllm.decode_context_parallel_size
  domain:
  - 1
  - 4
- name: vllm.prefill_context_parallel_size
  domain:
  - 1
  - 4
- name: vllm.enable_expert_parallel
  categories:
  - 'true'
  - 'false'
- name: vllm.kv_cache_dtype
  categories:
  - auto
  - fp8
- name: vllm.max_num_seqs
  domain:
  - 16
  - 512
- name: vllm.max_num_batched_tokens
  domain:
  - 2048
  - 32768
- name: vllm.gpu_memory_utilization
  domain:
  - 0.8
  - 0.94
parameterConstraints:
- name: tensor_parallel_size is 1, 2 or 4
  formula: vllm.tensor_parallel_size != 3
- name: data_parallel_size is 1, 2 or 4
  formula: vllm.data_parallel_size != 3
- name: decode_context_parallel_size is 1, 2 or 4
  formula: vllm.decode_context_parallel_size != 3
- name: prefill_context_parallel_size is 1, 2 or 4
  formula: vllm.prefill_context_parallel_size != 3
- name: TP x PCP x DP uses exactly the 4 GPUs
  formula: vllm.tensor_parallel_size * vllm.prefill_context_parallel_size * vllm.data_parallel_size ==
    4
- name: DCP divides TP
  formula: vllm.decode_context_parallel_size <= vllm.tensor_parallel_size
- name: PCP needs DCP 1 on dense MLA
  formula: vllm.prefill_context_parallel_size == 1 || vllm.decode_context_parallel_size == 1
- name: PCP needs expert parallelism
  formula: vllm.prefill_context_parallel_size == 1 || vllm.enable_expert_parallel == "true"
- name: PCP without DP
  formula: vllm.prefill_context_parallel_size == 1 || vllm.data_parallel_size == 1
- name: max_num_batched_tokens must be at least max_num_seqs
  formula: vllm.max_num_batched_tokens >= vllm.max_num_seqs
kpis:
- name: Generation throughput
  formula: vllm.decode_token_throughput
  direction: maximize
- name: TTFT P95 150s
  formula: vllm.time_to_first_token_p95
  direction: minimize
  aggregation: max
- name: TPOT P95 150s
  formula: vllm.time_per_output_token_p95
  direction: minimize
  aggregation: max
- name: Completed requests
  formula: vllm.request_success_rate
  direction: maximize
- name: KV cache usage
  formula: vllm.kv_cache_usage_max
  direction: minimize
  aggregation: max
- name: Preemptions
  formula: vllm.preemption_rate
  direction: minimize
- name: Waiting requests
  formula: vllm.num_requests_waiting
  direction: minimize
  aggregation: max
- name: Prefix cache hit rate
  formula: vllm.prefix_cache_hit_rate
  direction: maximize
