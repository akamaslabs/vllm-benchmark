  (MLA + MoE, bf16) on 4x L4, vLLM 0.32.0, always on all four GPUs (TP x PCP x DP = 4). Goal: generation
  tokens/s (= turns/s x 256) under TTFT p95 <= 10 s and TPOT p95 <= 100 ms (150 s p95, :max). Load: closed-loop
  AIPerf users ramp of multi-turn sessions with 8k-token shared prefixes, ended by a watchdog past 2 x
  the SLO. Steps: TP4 baseline (2 trials), 6 layout presets, 60 AKAMAS experiments. Needs vLLM pack 1.14.0
  and GPU pack 1.4.0.'
workflow: 41-L4-DSV2-Lite-Context-Parallel-Workflow
system: vLLM_Benchmark_41_L4_DSV2_Lite_CP
goal:
  objective: maximize
  function:
    formula: vllm.decode_token_throughput
    unit: tokens per second
  constraints:
    absolute:
    - name: TTFT P95 over 150 s
      formula: vllm.time_to_first_token_p95:max <= 10000
    - name: TPOT P95 over 150 s
      formula: vllm.time_per_output_token_p95:max <= 100
