# AIPerf results (one directory per measured run). Own namespace, own volume: nothing
# shared with the other studies' AIPerf Jobs. The dataset is synthetic (generated by AIPerf
# from a fixed seed at every run), so unlike study 30 there is no inputs cache here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiperf-results-42
  namespace: llm-cpu
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
