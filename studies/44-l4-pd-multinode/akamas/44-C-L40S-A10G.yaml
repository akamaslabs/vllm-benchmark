kind: study
name: 44-C-L40S-A10G
description: >-
  Study 44 tappa C: Qwen/Qwen3-8B-FP8 (vLLM 0.29.0) on two fixed single-GPU nodes, L40S
  (g6e.2xlarge) and A10G (g5.2xlarge), $3.454/h. Akamas chooses the topology (P/D: prefill
  L40S -> decode A10G over TCP; or both GPUs aggregated behind a least-in-flight router) and
  the vLLM flags of each GPU. Goal: router tokens/s per $/h with TTFT p95 <= 10 s and ITL p95
  <= 75 ms over 150 s. Load: study 27's AIPerf open-loop gamma ramp (4096 in / 256 out).
  Steps: P/D baseline twice, 3 presets from tappe A/B, 25 AKAMAS experiments (30 in total).
  Needs vLLM pack 1.14.0.
# Own system, telemetry instance and workflow (akamas/system.yaml, components/, telemetry/,
# 44-C-L40S-A10G-Workflow.yaml); the workflow runs a copy of studies/44-l4-pd-multinode/k8s
# in /work/study44 on the toolbox. Why this study: README.md and the tracker
# (https://claude.ai/artifact/71LTADBPt2k3eiDwpUQ9GU).
# Preset values are written out in full (no YAML anchors), as in study 27.
system: vLLM_Benchmark_44_L40S_A10G_PD
workflow: 44-C-L40S-A10G-Workflow

# The hardware is fixed, so the cost is a constant: g6e.2xlarge $2.24208/h + g5.2xlarge
# $1.212/h on demand in us-east-2 (AWS Pricing API, 2026-10-29) = $3.454/h. Dividing by it
# does not change which configuration wins; it puts the score in the unit tappe A/B compare
# in (the aggregated g6.xlarge of tappa A scored 2445 tokens/s per $/h). total_token_throughput
# is read at the router: every prompt and output token delivered to clients, counted once,
# whatever the topology. Latency constraints: study 27's, p95 over 150 s read with :max.
goal:
  objective: maximize
  function:
    formula: pd_topology.total_token_throughput / 3.454
    unit: tokens per second per dollar per hour
  constraints:
    absolute:
      - name: TTFT P95 over 150 s at the router
        formula: pd_topology.time_to_first_token_p95_150s:max <= 10000
      - name: ITL P95 over 150 s at the router
        formula: pd_topology.inter_token_latency_p95_150s:max <= 75

windowing:
  type: stability
  stability:
    metric: pd_topology.total_token_throughput
    width: 6
    maxStdDev: 300000000
    when:
      metric: pd_topology.total_token_throughput
      is: max

numberOfTrials: 1

# Topology: pd_prefill_instances 1 = P/D (L40S prefill, A10G decode), 0 = aggregated on both
# GPUs. apply_config_c.sh derives the rest (roles, router URLs); pd_decode_instances is not
# rendered. Not tuned (pinned in the templates): NixlConnector pull, kv_buffer_device cpu (the
# only path over TCP, tappe A/B), attention FLASHINFER on both (FlashAttention 2 rejects an fp8
# KV cache, and P and D must match), A10G linear backend marlin (no FP8 tensor cores on Ampere).
# Domains: tappe A/B used gmu 0.9, 128 seqs, 8192 batched on P/D and 4655 batched aggregated.
parametersSelection:
  - name: pd_topology.pd_prefill_instances
    domain: [0, 1]
  - name: vllm_l40s.gpu_memory_utilization
    domain: [0.6, 0.92]
  - name: vllm_l40s.max_num_seqs
    domain: [8, 256]
  - name: vllm_l40s.max_num_batched_tokens
    domain: [2048, 16384]
  - name: vllm_l40s.linear_backend
    categories: ["marlin", "humming", "triton"]
  - name: vllm_a10g.gpu_memory_utilization
    domain: [0.8, 0.92]
  - name: vllm_a10g.max_num_seqs
    domain: [8, 256]
  - name: vllm_a10g.max_num_batched_tokens
    domain: [2048, 16384]
  - name: vllm_a10g.kv_cache_dtype
    categories: ["auto", "fp8"]

parameterConstraints:
  - name: L40S batch budget covers its sequence cap
    formula: vllm_l40s.max_num_batched_tokens >= vllm_l40s.max_num_seqs
  - name: A10G batch budget covers its sequence cap
    formula: vllm_a10g.max_num_batched_tokens >= vllm_a10g.max_num_seqs
  # Study 27's activation-headroom rule (~0.16 MiB per batched token must fit in the memory
  # vLLM leaves free, (1 - gmu) x usable GiB), with each GPU's usable memory: A10G 24 GB like
  # the L4 (22.03 GiB), L40S 48 GB (44.39 GiB, scaled from the L4 by the nominal size).
  - name: L40S activation headroom for the batched tokens
    formula: vllm_l40s.gpu_memory_utilization * 44.39 + vllm_l40s.max_num_batched_tokens * 0.00016 <= 44.39
  - name: A10G activation headroom for the batched tokens
    formula: vllm_a10g.gpu_memory_utilization * 22.03 + vllm_a10g.max_num_batched_tokens * 0.00016 <= 22.03

# At most 8.
kpis:
  - name: Total throughput (router)
    formula: pd_topology.total_token_throughput
    direction: maximize
  - name: TTFT P95 150s (router)
    formula: pd_topology.time_to_first_token_p95_150s
    direction: minimize
    aggregation: max
  - name: ITL P95 150s (router)
    formula: pd_topology.inter_token_latency_p95_150s
    direction: minimize
    aggregation: max
  - name: Running requests A10G (peak)
    formula: vllm_a10g.num_requests_running
    direction: maximize
    aggregation: max
  - name: Running requests L40S (peak)
    formula: vllm_l40s.num_requests_running
    direction: maximize
    aggregation: max
  - name: KV cache usage A10G
    formula: vllm_a10g.kv_cache_usage_avg
    direction: maximize
  - name: Waiting requests L40S (peak)
    formula: vllm_l40s.num_requests_waiting
    direction: minimize
    aggregation: max
  - name: Preemptions A10G (peak)
    formula: vllm_a10g.preemption_rate
    direction: minimize
    aggregation: max

steps:
  # Tappa B's B2, now under Akamas: P/D L40S -> A10G with tappa A's P1D1 flags (study 27 exp
  # 8): gmu 0.9, 128 seqs, 8192 batched on both, L40S triton (default Triton configs: the
  # tuned ones are for the L4), fp8 KV. B2 scored 5343.6 tokens/s = 1547 per $/h by score.py.
  - name: baseline PD
    type: baseline
    values:
      pd_topology.pd_prefill_instances: 1
      vllm_l40s.gpu_memory_utilization: 0.9
      vllm_l40s.max_num_seqs: 128
      vllm_l40s.max_num_batched_tokens: 8192
      vllm_l40s.linear_backend: "triton"
      vllm_a10g.gpu_memory_utilization: 0.9
      vllm_a10g.max_num_seqs: 128
      vllm_a10g.max_num_batched_tokens: 8192
      vllm_a10g.kv_cache_dtype: "fp8"

  # The same values again: the run-to-run noise on this hardware (tappa A saw ~13% between two
  # runs of the same aggregated config on different nodes).
  - name: baseline PD repeat
    type: preset
    values:
      pd_topology.pd_prefill_instances: 1
      vllm_l40s.gpu_memory_utilization: 0.9
      vllm_l40s.max_num_seqs: 128
      vllm_l40s.max_num_batched_tokens: 8192
      vllm_l40s.linear_backend: "triton"
      vllm_a10g.gpu_memory_utilization: 0.9
      vllm_a10g.max_num_seqs: 128
      vllm_a10g.max_num_batched_tokens: 8192
      vllm_a10g.kv_cache_dtype: "fp8"

  # Aggregated on both GPUs with the flags of study 27's best aggregated family (tappa A's A6:
  # 1967 tokens/s on one L4): fp8 KV, 4655 batched (one 4108-token prompt per step), Humming on
  # the L40S, Marlin on the A10G (pinned), vLLM's server default of 256 seqs.
  - name: aggregated both B4 B5 flags
    type: preset
    values:
      pd_topology.pd_prefill_instances: 0
      vllm_l40s.gpu_memory_utilization: 0.9
      vllm_l40s.max_num_seqs: 256
      vllm_l40s.max_num_batched_tokens: 4655
      vllm_l40s.linear_backend: "humming"
      vllm_a10g.gpu_memory_utilization: 0.9
      vllm_a10g.max_num_seqs: 256
      vllm_a10g.max_num_batched_tokens: 4655
      vllm_a10g.kv_cache_dtype: "fp8"

  # P/D with the decode capped near its KV capacity: B2 ended on the A10G's ITL (74 ms at
  # ~1.3 req/s, then 350 ms). With fp8 the A10G holds ~133k tokens, ~30 sequences of 4352
  # tokens; 32 seqs keeps the decode batch small, trading ITL for a queue (TTFT).
  - name: PD decode 32 seqs
    type: preset
    values:
      pd_topology.pd_prefill_instances: 1
      vllm_l40s.gpu_memory_utilization: 0.9
      vllm_l40s.max_num_seqs: 128
      vllm_l40s.max_num_batched_tokens: 8192
      vllm_l40s.linear_backend: "triton"
      vllm_a10g.gpu_memory_utilization: 0.9
      vllm_a10g.max_num_seqs: 32
      vllm_a10g.max_num_batched_tokens: 8192
      vllm_a10g.kv_cache_dtype: "fp8"

  # Aggregated with Triton on the L40S (fastest prefill step on Ada in study 24's kernel-bench)
  # and a larger prefill budget on the faster GPU.
  - name: aggregated both L40S triton
    type: preset
    values:
      pd_topology.pd_prefill_instances: 0
      vllm_l40s.gpu_memory_utilization: 0.9
      vllm_l40s.max_num_seqs: 256
      vllm_l40s.max_num_batched_tokens: 8192
      vllm_l40s.linear_backend: "triton"
      vllm_a10g.gpu_memory_utilization: 0.9
      vllm_a10g.max_num_seqs: 256
      vllm_a10g.max_num_batched_tokens: 4655
      vllm_a10g.kv_cache_dtype: "fp8"

  - name: optimize
    type: optimize
    optimizer: AKAMAS
    numberOfInitExperiments: 0
    numberOfExperiments: 25
    maxFailedExperiments: 8
