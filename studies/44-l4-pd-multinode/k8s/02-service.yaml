# Study 44 Services. vllm-pd-mn is the front door (router); the role Services are what the
# router and the ServiceMonitor reach. All carry app=vllm-pd-mn (not vllm-pd), so study 27's
# ServiceMonitor never scrapes them.
apiVersion: v1
kind: Service
metadata:
  name: vllm-pd-mn
  namespace: llm-serving
  labels: {app: vllm-pd-mn, role: router}
spec:
  selector: {app: vllm-pd-mn, role: router}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-pd-mn-prefill
  namespace: llm-serving
  labels: {app: vllm-pd-mn, role: prefill}
spec:
  selector: {app: vllm-pd-mn, role: prefill}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-pd-mn-decode
  namespace: llm-serving
  labels: {app: vllm-pd-mn, role: decode}
spec:
  selector: {app: vllm-pd-mn, role: decode}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
