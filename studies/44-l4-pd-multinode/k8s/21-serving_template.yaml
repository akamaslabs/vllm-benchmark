# Study 44 serving layout, rendered by run.sh (sed) and applied. Placeholders:
#   __P_NODE_ROLE__   llm-serving-l4-pd (2x g6.4xlarge) or llm-serving-l4-pd-xl (2x g6.xlarge)
#   __P_CPU_REQ__ / __P_MEM_REQ__ / __P_MEM_LIM__ / __P_SHM__   per node size (see run.sh)
#   __CONFIG_SHA__  checksum of 20-pd-config.yaml + serve.sh, so a change restarts the pods
#
#   AIPerf ──► Service vllm-pd-mn:8000 ──► router (pod on the decode node)
#                                           │ 1. prefill leg (max_tokens=1)   ──► Service vllm-pd-mn-prefill:8000
#                                           │                                    pod on node A (anti-affinity)
#                                           │ 2. decode leg + kv_transfer_params ──► Service vllm-pd-mn-decode:8000
#                                           ▼                                    pod on node B
#                                decode pulls the KV from prefill's pod IP (NIXL side channel
#                                5600, data over UCX/TCP), across the VPC network
#
# Model cache: an emptyDir per pod (8.8 GiB download at each start, minutes). The RWO EBS
# model-cache volume of study 27 can attach to one node only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-pd-mn-prefill
  namespace: llm-serving
  labels: {app: vllm-pd-mn, role: prefill}
spec:
  replicas: 1
  progressDeadlineSeconds: 1500
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: vllm-pd-mn, role: prefill}
  template:
    metadata:
      labels: {app: vllm-pd-mn, role: prefill, topology: "1P1D"}
      annotations: {pd-config-sha: "__CONFIG_SHA__"}
    spec:
      enableServiceLinks: false
      nodeSelector: {node-role: __P_NODE_ROLE__}
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - {key: role, operator: In, values: [decode, aggregated]}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: engine
          image: vllm/vllm-openai:v0.29.0
          command: ["bash", "/pd-scripts/serve.sh"]
          env:
            - {name: PD_ROLE, value: prefill}
            - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: VLLM_LOGGING_LEVEL, value: INFO}
            - {name: UCX_PROTO_INFO, value: "y"}
          ports:
            - {name: http, containerPort: 8000}
            - {name: nixl, containerPort: 5600}
          resources:
            requests: {nvidia.com/gpu: "1", cpu: "__P_CPU_REQ__", memory: "__P_MEM_REQ__"}
            limits: {nvidia.com/gpu: "1", memory: "__P_MEM_LIM__"}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 150
            periodSeconds: 10
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: model-cache, mountPath: /root/.cache/huggingface}
            - {name: pd-config, mountPath: /pd-config, readOnly: true}
            - {name: pd-scripts, mountPath: /pd-scripts, readOnly: true}
            - {name: pd-tuned-configs, mountPath: /pd-tuned-configs, readOnly: true}
      volumes:
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: __P_SHM__}}
        - {name: model-cache, emptyDir: {sizeLimit: 40Gi}}
        - {name: pd-config, configMap: {name: pd-mn-config}}
        - {name: pd-scripts, configMap: {name: pd-mn-scripts, defaultMode: 0555}}
        - {name: pd-tuned-configs, configMap: {name: pd-tuned-configs, optional: true}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-pd-mn-decode
  namespace: llm-serving
  labels: {app: vllm-pd-mn, role: decode}
spec:
  replicas: 1
  progressDeadlineSeconds: 1500
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: vllm-pd-mn, role: decode}
  template:
    metadata:
      labels: {app: vllm-pd-mn, role: decode, topology: "1P1D"}
      annotations: {pd-config-sha: "__CONFIG_SHA__"}
    spec:
      enableServiceLinks: false
      nodeSelector: {node-role: __D_NODE_ROLE__}
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - {key: role, operator: In, values: [prefill]}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: engine
          image: vllm/vllm-openai:v0.29.0
          command: ["bash", "/pd-scripts/serve.sh"]
          env:
            - {name: PD_ROLE, value: decode}
            - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: VLLM_LOGGING_LEVEL, value: INFO}
            - {name: UCX_PROTO_INFO, value: "y"}
          ports:
            - {name: http, containerPort: 8000}
            - {name: nixl, containerPort: 5600}
          resources:
            requests: {nvidia.com/gpu: "1", cpu: "__D_CPU_REQ__", memory: "__D_MEM_REQ__"}
            limits: {nvidia.com/gpu: "1", memory: "__D_MEM_LIM__"}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 150
            periodSeconds: 10
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: model-cache, mountPath: /root/.cache/huggingface}
            - {name: pd-config, mountPath: /pd-config, readOnly: true}
            - {name: pd-scripts, mountPath: /pd-scripts, readOnly: true}
            - {name: pd-tuned-configs, mountPath: /pd-tuned-configs, readOnly: true}
      volumes:
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: __D_SHM__}}
        - {name: model-cache, emptyDir: {sizeLimit: 40Gi}}
        - {name: pd-config, configMap: {name: pd-mn-config}}
        - {name: pd-scripts, configMap: {name: pd-mn-scripts, defaultMode: 0555}}
        - {name: pd-tuned-configs, configMap: {name: pd-tuned-configs, optional: true}}
---
# Router: study 27's pd_router.py with the backends from env. On the decode node (pod
# affinity), so only the prefill leg and the KV cross the network, as in a real deployment
# where the router sits next to the decode pool.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-pd-mn-router
  namespace: llm-serving
  labels: {app: vllm-pd-mn, role: router}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: vllm-pd-mn, role: router}
  template:
    metadata:
      labels: {app: vllm-pd-mn, role: router, topology: "1P1D"}
      annotations: {pd-config-sha: "__CONFIG_SHA__"}
    spec:
      enableServiceLinks: false
      nodeSelector: {node-role: __D_NODE_ROLE__}
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - {key: role, operator: In, values: [decode]}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: router
          image: vllm/vllm-openai:v0.29.0
          command: ["python3", "-u", "/pd-scripts/pd_router.py"]
          env:
            - {name: PD_ROUTER_MODEL_LABEL, value: qwen3-8b-router}
            - {name: PD_ROUTER_PORT, value: "8000"}
            - {name: PD_TOPOLOGY_FILE, value: /nonexistent}
            - {name: PD_PREFILL_URLS, value: "http://vllm-pd-mn-prefill.llm-serving.svc.cluster.local:8000"}
            - {name: PD_DECODE_URLS, value: "http://vllm-pd-mn-decode.llm-serving.svc.cluster.local:8000"}
          ports:
            - {name: http, containerPort: 8000}
          resources:
            requests: {cpu: "500m", memory: "512Mi"}
            limits: {memory: "2Gi"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 15
          volumeMounts:
            - {name: pd-scripts, mountPath: /pd-scripts, readOnly: true}
      volumes:
        - {name: pd-scripts, configMap: {name: pd-mn-scripts, defaultMode: 0555}}
