apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-pd-mn-router
  namespace: llm-serving
  labels: {app: vllm-pd-mn, role: router}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: vllm-pd-mn, role: router}
  template:
    metadata:
      labels: {app: vllm-pd-mn, role: router, topology: "__TOPOLOGY__"}
      annotations: {pd-config-sha: "__CONFIG_SHA__"}
    spec:
      enableServiceLinks: false
      nodeSelector: {node-role: __ROUTER_NODE_ROLE__}
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: router
          image: vllm/vllm-openai:v0.29.0
          command: ["python3", "-u", "/pd-scripts/pd_router.py"]
          env:
            - {name: PD_ROUTER_MODEL_LABEL, value: qwen3-8b-router}
            - {name: PD_ROUTER_PORT, value: "8000"}
            - {name: PD_ROUTER_POLICY, value: least}
            - {name: PD_TOPOLOGY_FILE, value: /nonexistent}
            - {name: PD_PREFILL_URLS, value: "__PREFILL_URLS__"}
            - {name: PD_DECODE_URLS, value: "__DECODE_URLS__"}
            - {name: PD_NODE_A_INSTANCE, value: "__A_INSTANCE__"}
            - {name: PD_NODE_A_PRICE, value: "__A_PRICE__"}
            - {name: PD_NODE_B_INSTANCE, value: "__B_INSTANCE__"}
            - {name: PD_NODE_B_PRICE, value: "__B_PRICE__"}
          ports:
            - {name: http, containerPort: 8000}
          resources:
            requests: {cpu: "300m", memory: "512Mi"}
            limits: {memory: "2Gi"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 15
          volumeMounts:
            - {name: pd-scripts, mountPath: /pd-scripts, readOnly: true}
      volumes:
        - {name: pd-scripts, configMap: {name: pd-mn-scripts, defaultMode: 0555}}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-pd-mn-a
  namespace: llm-serving
  labels: {app: vllm-pd-mn, gpu: a}
spec:
  selector: {app: vllm-pd-mn, gpu: a}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-pd-mn-b
  namespace: llm-serving
  labels: {app: vllm-pd-mn, gpu: b}
spec:
  selector: {app: vllm-pd-mn, gpu: b}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
