# Study 46 vLLM serving: N replicas, each with its own DRA ResourceClaim generated from
# the ResourceClaimTemplate @CLAIM@ (00-claims.yaml), so every pod gets its own MIG slice
# (or the whole GPU). Rendered by apply_config.sh. Tokens (between two at-signs): CLAIM
# REPLICAS NODE_ROLE CPU MEM GMU MAX_NUM_SEQS MAX_NUM_BATCHED_TOKENS KV_CACHE_DTYPE.
# requests == limits for cpu and memory (Guaranteed QoS, the CPU-fairness guard).
# Service `vllm` (label app: vllm) is what the ServiceMonitor vllm-dra-mig scrapes;
# the headless one gives each AIPerf client a stable DNS name for its replica.
apiVersion: v1
kind: Service
metadata: {name: vllm, namespace: dra-mig, labels: {app: vllm}}
spec:
  selector: {app: vllm}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata: {name: vllm-headless, namespace: dra-mig, labels: {app: vllm-headless}}
spec:
  clusterIP: None
  selector: {app: vllm}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: vllm, namespace: dra-mig}
spec:
  serviceName: vllm-headless
  replicas: @REPLICAS@
  # OrderedReady: vllm-0 fills the hostPath HF cache, the others reuse it.
  podManagementPolicy: OrderedReady
  selector: {matchLabels: {app: vllm}}
  template:
    metadata: {labels: {app: vllm}}
    spec:
      enableServiceLinks: false
      nodeSelector: {node-role: @NODE_ROLE@}
      tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
      terminationGracePeriodSeconds: 30
      resourceClaims: [{name: gpu, resourceClaimTemplateName: @CLAIM@}]
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.29.0
        args:
        - "--model=Qwen/Qwen3-8B-FP8"
        - "--served-model-name=qwen3-8b-dra"
        - "--port=8000"
        - "--host=0.0.0.0"
        - "--no-enable-prefix-caching"
        - "--max-model-len=4096"
        # Tuned flags, written by apply_config.sh (render_args): one line per flag, none for a
        # parameter left to vLLM's default.
        @TUNED_ARGS@
        env:
        - {name: HF_HOME, value: /hf-cache}
        - {name: VLLM_USE_V2_MODEL_RUNNER, value: "0"}
        ports: [{name: http, containerPort: 8000}]
        resources:
          claims: [{name: gpu}]
          requests: {cpu: "@CPU@m", memory: "@MEM@Gi"}
          limits: {cpu: "@CPU@m", memory: "@MEM@Gi"}
        volumeMounts:
        - {name: hf-cache, mountPath: /hf-cache}
        - {name: shm, mountPath: /dev/shm}
        startupProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 10, failureThreshold: 120}
        readinessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 10, failureThreshold: 3}
      volumes:
      - {name: hf-cache, hostPath: {path: /var/lib/hf-cache-study46, type: DirectoryOrCreate}}
      - {name: shm, emptyDir: {medium: Memory, sizeLimit: 1Gi}}
