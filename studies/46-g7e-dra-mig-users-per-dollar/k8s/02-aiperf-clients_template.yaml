# Study 46 load generator: one long-lived AIPerf client pod per vLLM replica
# (aiperf-client-N drives vllm-N), on the m8a-2xlarge load node. run_ramp.sh / run_hold.sh
# start each concurrency level with `kubectl exec`, so aiperf is installed and ShareGPT is
# downloaded once per experiment instead of once per level. Rendered by apply_config.sh
# (token @REPLICAS@). Results stay in the pod's /work (emptyDir) — no PVC to fill up
# (study 41's lesson); the scripts print what they need to stdout.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: aiperf-client, namespace: dra-mig}
spec:
  serviceName: aiperf-client
  replicas: @REPLICAS@
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: aiperf-client}}
  template:
    metadata: {labels: {app: aiperf-client}}
    spec:
      nodeSelector: {node-role: m8a-2xlarge}
      tolerations: [{key: dedicated, operator: Equal, value: m8a-2xlarge, effect: NoSchedule}]
      terminationGracePeriodSeconds: 5
      containers:
      - name: aiperf
        image: python:3.12-slim
        workingDir: /work
        command: ["sh","-c"]
        args:
        - |
          set -e
          pip install --quiet aiperf==0.11.0
          # Download ShareGPT once into /work/.cache (aiperf caches it relative to cwd).
          python3 - <<'PY'
          import urllib.request, os
          d = "/work/.cache/aiperf/datasets"; os.makedirs(d, exist_ok=True)
          f = d + "/ShareGPT_V3_unfiltered_cleaned_split.json"
          if not os.path.exists(f):
              urllib.request.urlretrieve("https://huggingface.co/datasets/anon8231489123/ShareGPT_Vicuna_unfiltered/resolve/main/ShareGPT_V3_unfiltered_cleaned_split.json", f)
          PY
          touch /work/ready
          exec sleep infinity
        readinessProbe: {exec: {command: [test, -f, /work/ready]}, periodSeconds: 5}
        env:
        - {name: AIPERF_TIMING_RATE_RAMP_UPDATE_INTERVAL, value: "10"}
        resources:
          requests: {cpu: 1500m, memory: 3Gi}
          limits: {cpu: 1900m, memory: 6Gi}
        volumeMounts: [{name: work, mountPath: /work}]
      volumes: [{name: work, emptyDir: {}}]
