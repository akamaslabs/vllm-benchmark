kind: study
name: 47-G7-KV-Offload-TTFT
description: >-
  Multi-turn chat under KV memory pressure: Qwen/Qwen3-8B-FP8 (vLLM 0.29.0, prefix caching on)
  on one RTX PRO 4500 32 GB (g7.4xlarge, 3.04 USD/h), fixed AIPerf load (64 users, one turn
  each every 64 s, 10 turns with the history re-sent; workload.env). Goal: minimize TTFT p95 in
  steady state, tuning CPU KV offload together with the other KV-memory levers (FP8 KV cache,
  memory utilization, batching, block size). Presets measure each lever alone. Requires vLLM
  pack 1.15.0, Kubernetes pack 1.9.0. Design:
  docs/superpowers/specs/2026-11-05-study-47-kv-cache-offload-design.md.
system: vLLM_Benchmark_47_G7_KV_Offload
workflow: 47-G7-KV-Offload-Workflow
goal:
  objective: minimize
  function:
    # Server-side TTFT p95 (vLLM histogram) over the Load window. The client-side p95 over the
    # same steady window is printed by run_load.sh (RESULT line) for the README.
    formula: vllm.time_to_first_token_p95
    unit: milliseconds
  constraints:
    absolute:
      # Absolute, so it stays meaningful whatever the baseline does (design). Server-side vLLM
      # histogram = the gap between EVERY two tokens, so prefill chunks of recomputed histories
      # show up in it: the baseline (exp 1, 2026-11-05) read ~96 ms on average over the window
      # (30 s p95 values up to 164 ms), while AIPerf's per-request average ITL p95 was 33 ms.
      # The first threshold, 50 ms, came from that client-side number and flagged the baseline
      # itself; 120 ms (~baseline + 25 %, user's choice 2026-11-05) instead of the design's +10 %
      # because the p95 interpolates inside the 75-100 ms bucket and is noisy. Errors and falling
      # behind are enforced client-side by run_load.sh (exit 6: the trial fails).
      - name: ITL P95 not degraded
        formula: vllm.inter_token_latency_p95 <= 120
# Only the Load task. Start trim 360s: the conversations reach their steady context size around
# minute 5-6 (spike); end trim 90s: grace period, parsing and log dump. One unit per value (study
# 46: "1m30s" breaks scoring).
windowing:
  type: trim
  trim: [360s, 90s]
  task: Load
numberOfTrials: 1
parametersSelection:
  # 0 = offload off (no flag). 28 GiB max: 28 + 20 GiB (vLLM) + 6 GiB (AIPerf) fits the 57 GiB
  # allocatable of the g7.4xlarge (the design said 0-32; apply_config.sh refuses > 28).
  - name: vllm.kv_offloading_size
    domain: [0, 28]
  - name: vllm.kv_cache_dtype
    categories: [auto, fp8]
  - name: vllm.gpu_memory_utilization
    domain: [0.80, 0.94]
  - name: vllm.max_num_seqs
    domain: [16, 256]
  - name: vllm.max_num_batched_tokens
    domain: [1024, 16384]
  # Powers of two only (as study 46: other sizes not known to be supported on SM 12.0).
  - name: vllm.block_size
    categories: ["16", "32", "64", "128"]
parameterConstraints:
  # vLLM 0.29.0 config/scheduler.py raises ValueError otherwise.
  - name: max_num_batched_tokens must be at least max_num_seqs
    formula: vllm.max_num_batched_tokens >= vllm.max_num_seqs
kpis:
  - name: TTFT P95
    formula: vllm.time_to_first_token_p95
    direction: minimize
  - name: TTFT avg
    formula: vllm.time_to_first_token_avg
    direction: minimize
  - name: ITL P95
    formula: vllm.inter_token_latency_p95
    direction: minimize
  - name: Prompt not recomputed
    formula: vllm.prefix_cache_hit_rate_with_offload
    direction: maximize
  - name: Prompt from CPU offload
    formula: vllm.cpu_offload_prefix_hit_rate
    direction: maximize
  - name: Offload reload GB/s
    formula: vllm.kv_offload_cpu_to_gpu_throughput
    direction: maximize
  - name: Preemptions
    formula: vllm.preemption_rate
    direction: minimize
  - name: vLLM CPU throttled
    formula: container.container_cpu_throttle_time
    direction: minimize
# Baseline = vLLM 0.29.0's own defaults on this GPU (calibration 2026-11-05: vLLM log,
# vllm:cache_config_info and EngineArgs.get_batch_defaults for a 32 GB GPU): gmu 0.92,
# max_num_seqs 256, max_num_batched_tokens 2048, kv auto, block 16, no offload. Akamas 4.1 refuses
# a parameter both in `values` and in doNotRenderParameters, so the defaults are rendered as
# explicit flags (same configuration, and the optimizer knows the starting point); only
# block_size stays unrendered (an explicit --block-size may change vLLM's attention backend
# choice). Presets change one lever at a time, then both (design: offload must not be favoured
# by construction).
steps:
  - name: baseline
    type: baseline
    values:
      vllm.kv_offloading_size: 0
      vllm.kv_cache_dtype: auto
      vllm.gpu_memory_utilization: 0.92
      vllm.max_num_seqs: 256
      vllm.max_num_batched_tokens: 2048
    doNotRenderParameters:
      - vllm.block_size
  - name: Offload only
    type: preset
    values:
      vllm.kv_offloading_size: 24
      vllm.kv_cache_dtype: auto
      vllm.gpu_memory_utilization: 0.92
      vllm.max_num_seqs: 256
      vllm.max_num_batched_tokens: 2048
    doNotRenderParameters:
      - vllm.block_size
  - name: FP8 KV only
    type: preset
    values:
      vllm.kv_offloading_size: 0
      vllm.kv_cache_dtype: fp8
      vllm.gpu_memory_utilization: 0.92
      vllm.max_num_seqs: 256
      vllm.max_num_batched_tokens: 2048
    doNotRenderParameters:
      - vllm.block_size
  - name: Offload and FP8
    type: preset
    values:
      vllm.kv_offloading_size: 24
      vllm.kv_cache_dtype: fp8
      vllm.gpu_memory_utilization: 0.92
      vllm.max_num_seqs: 256
      vllm.max_num_batched_tokens: 2048
    doNotRenderParameters:
      - vllm.block_size
  # The baseline again: drift check before trusting the gaps.
  - name: Baseline repeat
    type: preset
    values:
      vllm.kv_offloading_size: 0
      vllm.kv_cache_dtype: auto
      vllm.gpu_memory_utilization: 0.92
      vllm.max_num_seqs: 256
      vllm.max_num_batched_tokens: 2048
    doNotRenderParameters:
      - vllm.block_size
  - name: optimize
    type: optimize
    optimizer: AKAMAS
    numberOfInitExperiments: 4
    numberOfExperiments: 25
    maxFailedExperiments: 10
