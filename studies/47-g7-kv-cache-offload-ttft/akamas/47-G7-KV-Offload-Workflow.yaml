kind: workflow
name: 47-G7-KV-Offload-Workflow
# Three tasks, all on the akamas-41 toolbox (study copied to /work/study47 with tar, as 45/46):
#   Write config  render params.env from the experiment's parameters
#   Apply config  vLLM Deployment with the tuned flags, /dev/shm and memory sized from the CPU
#                 offload; AIPerf pod kept; vLLM logs dumped to stdout
#   Load          20 min multi-turn chat load (AIPerf user-centric rate); the study windows on it;
#                 client-side summary, per-minute TTFT, vLLM counters and AIPerf log on stdout
tasks:
  # ignoreUnsubstitutedTokens false on purpose: every token must resolve.
  - name: Write config
    operator: FileConfigurator
    arguments:
      ignoreUnsubstitutedTokens: false
      source:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/study47/47-g7-kv-cache-offload-ttft/k8s/params.env.template
      target:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/study47/47-g7-kv-cache-offload-ttft/k8s/params.env
  - name: Apply config
    operator: Executor
    arguments:
      retries: 0
      # Above apply_config.sh's own 2400 s vLLM wait + 600 s AIPerf wait, so its log dump runs.
      timeout: 60m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study47/47-g7-kv-cache-offload-ttft/k8s/apply_config.sh
  - name: Load
    operator: Executor
    arguments:
      retries: 0
      # 1200 s load + 60 s grace + AIPerf start-up, parsing and log dump.
      timeout: 35m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study47/47-g7-kv-cache-offload-ttft/k8s/run_load.sh
