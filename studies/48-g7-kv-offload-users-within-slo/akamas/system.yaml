kind: system

name: vLLM_Benchmark_48_G7_KV_Offload_Users
description: >-
  One NVIDIA RTX PRO 4500 Blackwell 32 GB (g7.4xlarge, node group llm-serving-g7-kv) serving
  Qwen/Qwen3-8B-FP8 with vllm/vllm-openai:v0.29.0, prefix caching on, optional CPU KV cache
  offload (native backend). Load: AIPerf 0.11.0 multi-turn chat, user-centric rate, ramped in users. Goal:
  maximize users within client TTFT p95 <= 500 ms. Requires vLLM pack 1.15.0, Kubernetes pack
  1.9.0. Created 2026-11-06 (study 48, copied from study 47).
