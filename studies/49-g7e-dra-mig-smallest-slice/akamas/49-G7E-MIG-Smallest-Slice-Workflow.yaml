kind: workflow
name: 49-G7E-MIG-Smallest-Slice-Workflow
# Three tasks, all on the akamas-41 toolbox (study copied to /work/study49 with tar, as 45-48):
#   Write config  render params.env from the experiment's parameters
#   Apply config  ResourceClaimTemplate for the slice size; the customer vLLM (tuned) and the
#                 neighbour vLLMs (defaults) on the other slices; slice-roles mapping for DCGM;
#                 one AIPerf client per vLLM pod; logs dumped to stdout
#   Load          customer at 128 users and neighbours at their load, all at once, 10 min; the
#                 study windows on this task
tasks:
  # ignoreUnsubstitutedTokens false on purpose: every token must resolve.
  - name: Write config
    operator: FileConfigurator
    arguments:
      ignoreUnsubstitutedTokens: false
      source:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/study49/49-g7e-dra-mig-smallest-slice/k8s/params.env.template
      target:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/study49/49-g7e-dra-mig-smallest-slice/k8s/params.env
  - name: Apply config
    operator: Executor
    arguments:
      retries: 0
      # Above apply_config.sh's own waits (claims 300 s, vLLM 2400 s, slice-roles 300 s, AIPerf
      # 600 s), so its log dump always runs.
      timeout: 70m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study49/49-g7e-dra-mig-smallest-slice/k8s/apply_config.sh
  - name: Load
    operator: Executor
    arguments:
      retries: 0
      # ~25 s AIPerf start-up + 20 s warm-up + 600 s + 30 s grace + parsing and log dumps.
      timeout: 20m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study49/49-g7e-dra-mig-smallest-slice/k8s/run_load.sh
