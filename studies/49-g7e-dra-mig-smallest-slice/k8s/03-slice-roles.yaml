# Study 49 slice-roles exporter. Under DRA, dcgm-exporter's per-MIG series carry GPU_I_ID and
# GPU_I_PROFILE but no pod label (study 46), so nothing says which slice is the customer's.
# apply_config.sh reads each vLLM pod's GPU instance id (nvidia-smi -q) and writes the ConfigMap
# key `metrics`:
#   study49_slice_role{GPU_I_ID="<id>",role="customer"} 1
#   study49_slice_role{GPU_I_ID="<id>",role="neighbour"} 1    (one line per neighbour)
#   (whole GPU, no MIG: study49_slice_role{role="customer"} 1, no GPU_I_ID label)
# then restarts this Deployment. The Akamas telemetry joins every DCGM query with
#   * on(GPU_I_ID) group_left max by(GPU_I_ID)(study49_slice_role{role=~"$SLICE$"})
# to get per-slice GPU metrics, and the goal reads the customer slice's framebuffer.
# Runs on the load node (no GPU), stdlib Python only.
apiVersion: v1
kind: ConfigMap
metadata: {name: slice-roles, namespace: dra-mig-49}
data:
  metrics: ""
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: slice-roles, namespace: dra-mig-49}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: slice-roles}}
  template:
    metadata: {labels: {app: slice-roles}}
    spec:
      nodeSelector: {node-role: m8a-2xlarge}
      tolerations: [{key: dedicated, operator: Equal, value: m8a-2xlarge, effect: NoSchedule}]
      terminationGracePeriodSeconds: 2
      containers:
      - name: exporter
        image: python:3.12-slim
        command: ["python3", "-c"]
        args:
        - |
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = open("/roles/metrics", "rb").read() if self.path == "/metrics" else b""
                  self.send_response(200 if self.path == "/metrics" else 404)
                  self.send_header("Content-Type", "text/plain; version=0.0.4")
                  self.end_headers(); self.wfile.write(body)
              def log_message(self, *a): pass
          http.server.HTTPServer(("", 9400), H).serve_forever()
        ports: [{name: metrics, containerPort: 9400}]
        readinessProbe: {httpGet: {path: /metrics, port: 9400}, periodSeconds: 5}
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
        volumeMounts: [{name: roles, mountPath: /roles}]
      volumes: [{name: roles, configMap: {name: slice-roles}}]
---
apiVersion: v1
kind: Service
metadata: {name: slice-roles, namespace: dra-mig-49, labels: {app: slice-roles}}
spec:
  selector: {app: slice-roles}
  ports: [{name: metrics, port: 9400, targetPort: 9400}]
