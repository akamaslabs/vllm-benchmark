kind: workflow

name: 5-Pack-Changes-Workflow
tasks:
  - name: Write config
    operator: FileConfigurator
    arguments:
      # ignoreUnsubstitutedTokens: true is REQUIRED for the baseline step's
      # doNotRenderParameters (see akamas/5-Pack-Changes.yaml, corrected 2026-08-21
      # to match 1-goodput-realistic-load's design) to work at all: a parameter
      # excluded via doNotRenderParameters has no computed value, so its ${vLLM.*}
      # token is left unsubstituted in the rendered file. Without this flag,
      # FileConfigurator would FAIL on every baseline trial. apply_config.sh's Step 2
      # then strips those unsubstituted lines entirely before the file is applied.
      ignoreUnsubstitutedTokens: true
      source:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/vllm-benchmark/studies/5-pack-changes/k8s/01-deployment_template.yaml
      target:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/vllm-benchmark/studies/5-pack-changes/k8s/01-deployment.yaml

  - name: Apply config
    operator: Executor
    arguments:
      retries: 0
      # Longer than 1-goodput-realistic-load's 60m — this model's startupProbe alone
      # budgets up to 20min (vs. that study's 10min) for a ~56GB weight load.
      timeout: 75m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/vllm-benchmark/studies/5-pack-changes/k8s/apply_config.sh

  - name: RunTest
    operator: Executor
    arguments:
      # Lowered from 3-comparison-a10's 105m (sized for its 12-level sweep):
      # k8s/run_test_goodput.sh's own kubectl wait is now 1800s (30m, single flat
      # 5min level, not a sweep — see that script's own comment); this task's timeout
      # keeps the same 15min margin above that.
      retries: 0
      timeout: 45m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/vllm-benchmark/studies/5-pack-changes/k8s/run_test_goodput.sh
