# Study 50 GPU pair: two g7e.8xlarge ON-DEMAND nodes (1x RTX PRO 6000 Blackwell 96 GB, 32 vCPU,
# 256 GiB, 100 Gbit/s, EFA; 5.27 USD/h each) in ONE availability zone, in one cluster placement
# group. eksctl (not the AWS-CLI scripts of the other studies) because `efaEnabled: true` builds
# the launch template with the EFA interface, the placement group and the self-referencing
# security-group rules (spike: docs/spikes/2026-11-10-efa-eks/README.md).
# Rendered by nodegroups.sh create <az> (the AZ token below is replaced with the AZ the capacity
# probe found), always with --install-nvidia-plugin=false: on the spike eksctl overwrote the
# cluster's shared NVIDIA device plugin DaemonSet.
# Created at desiredCapacity 0; nodegroups.sh up scales to 2.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: vllm-bench
  region: us-east-2
managedNodeGroups:
  - name: llm-serving-g7e-8xl-efa
    instanceType: g7e.8xlarge
    minSize: 0
    maxSize: 2
    desiredCapacity: 0
    availabilityZones: ["@AZ@"]
    privateNetworking: true        # private subnet + NAT: an EFA primary interface gets no public IP
    efaEnabled: true
    # gpt-oss-120b is ~65 GB on disk: gp3 at 1000 MiB/s loads it in about a minute.
    volumeSize: 300
    volumeType: gp3
    volumeIOPS: 6000
    volumeThroughput: 1000
    labels:
      node-role: llm-serving-g7e-8xl-efa
    # Kept (the spike removed it by hand): the study's own EFA device plugin (../efa/) tolerates it.
    taints:
      - key: nvidia.com/gpu
        value: present
        effect: NoSchedule
    tags:
      Project: vllm-bench
      Study: 50-g7e-efa-moe-parallelism
