# Prometheus scrapes for study 50 (namespace moe-efa), applied by apply_config.sh (idempotent).
# Without them the goal and the constraints are empty.
# - vllm-moe-efa: the Service `vllm` (label app: vllm) in front of the pods that run an API
#   server, 5 s like the other vLLM ServiceMonitors. The per-role headless Services carry
#   app: vllm-role, so no pod is scraped twice.
# - efa-exporter-50: the EFA counters and node roles (efa-exporter.yaml). honorLabels keeps its
#   node / role labels as written.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-moe-efa
  namespace: monitoring
  labels: {app: vllm}
spec:
  endpoints:
  - {interval: 5s, path: /metrics, port: http, scrapeTimeout: 4s}
  namespaceSelector: {matchNames: [moe-efa]}
  selector: {matchLabels: {app: vllm}}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: efa-exporter-50
  namespace: monitoring
  labels: {app: efa-exporter}
spec:
  endpoints:
  - {interval: 5s, path: /metrics, port: metrics, scrapeTimeout: 4s, honorLabels: true}
  namespaceSelector: {matchNames: [moe-efa]}
  selector: {matchLabels: {app: efa-exporter}}
