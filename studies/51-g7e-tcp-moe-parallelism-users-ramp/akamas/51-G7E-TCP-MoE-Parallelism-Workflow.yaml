kind: workflow
name: 51-G7E-TCP-MoE-Parallelism-Workflow
# Four tasks, all on the akamas-41 toolbox (study copied to /work/study51 with tar, as 45-49):
#   Write config  render params.env from the experiment's parameters
#   Apply config  delete and re-create the StatefulSets vllm-a / vllm-b in the experiment's
#                 layout (lib_layout.sh), wait for them, then prove on the running pods the
#                 flags, cache_config_info, the two ranks, expert parallelism and the NCCL
#                 transport (TCP); vLLM logs dumped to stdout
#   Ramp          levels 32-768 users (workload.env), one fresh 16 min AIPerf run each on two
#                 clients, judged on client TTFT p95 <= 500 ms; stops at the first failing
#                 level; writes level.current
#   Hold          the chosen level re-run fresh; the study windows on this task
# Every load prints its client-side RESULT, per-minute TTFT, vLLM counters and AIPerf log tail.
tasks:
  # ignoreUnsubstitutedTokens false on purpose: every token must resolve.
  - name: Write config
    operator: FileConfigurator
    arguments:
      ignoreUnsubstitutedTokens: false
      source:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/study51/51-g7e-tcp-moe-parallelism-users-ramp/k8s/params.env.template
      target:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/study51/51-g7e-tcp-moe-parallelism-users-ramp/k8s/params.env
  - name: Apply config
    operator: Executor
    arguments:
      retries: 0
      # Above apply_config.sh's own waits (300 s old pods + 300 s head IP + 2400 s vLLM +
      # 600 s AIPerf clients), so its log dump always runs.
      timeout: 75m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study51/51-g7e-tcp-moe-parallelism-users-ramp/k8s/apply_config.sh
  - name: Ramp
    operator: Executor
    arguments:
      retries: 0
      # 8 levels x (960 s load + 60 s grace + start-up and parsing ~40 s) = ~141 min.
      timeout: 180m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study51/51-g7e-tcp-moe-parallelism-users-ramp/k8s/run_ramp.sh
  - name: Hold
    operator: Executor
    arguments:
      retries: 0
      # 960 s load + 60 s grace + start-up, parsing and log dump.
      timeout: 25m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study51/51-g7e-tcp-moe-parallelism-users-ramp/k8s/run_hold.sh
