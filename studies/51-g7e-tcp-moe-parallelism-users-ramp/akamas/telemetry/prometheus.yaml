# Prometheus telemetry for 51-g7e-tcp-moe-parallelism-users-ramp (Akamas 4.1).
# Placeholder keys keep NO underscore ($POD$, $MODEL$, $WORKLOAD$, $GPUMODEL$, $ROLE$): keys with
# an underscore are not substituted (study 25). They come from the component properties.
# - vLLM (component vllm): study 48's catalog without the four CPU KV offload metrics. $POD$ matches
#   both vLLM pods (vllm-[ab]-0); only the pods with an API server are scraped (Service label
#   study51/serving="true"). Rates and averages sum over the serving pods. Every percentile over
#   $DURATION$ is computed per pod and the worst pod is taken:
#       max(histogram_quantile(Q, sum by(pod, le)(rate(X[$DURATION$]))))
#   so that with two API servers (layouts replicas, dp2, dp2ep) the slower node decides, the same
#   rule the ramp applies to the two AIPerf clients. active_gpus = Ready vLLM pods (one GPU each;
#   a headless worker is Ready as soon as it runs). prefix_cache_hit_rate is in percent.
# - Kubernetes Workload (component vllm_workload): the two single-replica StatefulSets vllm-a and
#   vllm-b seen as one workload ($WORKLOAD$ = vllm-[ab]).
# - GPU (components gpu_a, gpu_b: one per physical GPU): study 49's DCGM catalog. Every DCGM selector
#   is joined to the node role published by k8s/monitoring/role-exporter.yaml:
#       (DCGM_FI_X{...} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"}))
#   dcgm-exporter labels its series with `hostname` = node name (checked on this cluster).
# - Kubernetes Node (components node_a, node_b): node-exporter series joined to the role through
#   node_uname_info (`nodename` = node name). Network bytes are the ENA interfaces: the traffic
#   between the two vLLM pods (NCCL on TCP) is in them. k8s_node_cpu_util is a 0-1 ratio.
# - Kubernetes Container (components container, container_loadtest): study 48's queries scoped to
#   namespace="moe-tcp".
kind: telemetry-instance
system: vLLM_Benchmark_51_G7E_TCP_MoE_Parallelism
name: Prometheus_51_G7E_TCP_MoE_Parallelism
provider: Prometheus
config:
  address: kube-prometheus-stack-prometheus.monitoring.svc.cluster.local
  port: 9090
  logLevel: DETAILED
  duration: 30
metrics:
# --- vLLM (component vllm)
- metric: e2e_request_latency_p95
  datasourceMetric: '(max(histogram_quantile(0.95, sum by(pod, le)(rate(vllm:e2e_request_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])))))*1000'
  scale: 1
- metric: e2e_request_latency_avg
  datasourceMetric: '(sum(rate(vllm:e2e_request_latency_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:e2e_request_latency_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
  scale: 1
- metric: request_success_rate
  datasourceMetric: 'sum(rate(vllm:request_success_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
- metric: time_to_first_token_p95
  datasourceMetric: '(max(histogram_quantile(0.95, sum by(pod, le)(rate(vllm:time_to_first_token_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])))))*1000'
  scale: 1
- metric: time_to_first_token_avg
  datasourceMetric: '(sum(rate(vllm:time_to_first_token_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:time_to_first_token_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
  scale: 1
- metric: prefill_token_throughput
  datasourceMetric: 'sum(rate(vllm:prompt_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
- metric: inter_token_latency_p95
  datasourceMetric: '(max(histogram_quantile(0.95, sum by(pod, le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])))))*1000'
  scale: 1
- metric: inter_token_latency_avg
  datasourceMetric: '(sum(rate(vllm:inter_token_latency_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:inter_token_latency_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
  scale: 1
- metric: decode_token_throughput
  datasourceMetric: 'sum(rate(vllm:generation_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
- metric: total_token_throughput
  datasourceMetric: 'sum(rate(vllm:prompt_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) + sum(rate(vllm:generation_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
- metric: request_queue_time_p95
  datasourceMetric: '(max(histogram_quantile(0.95, sum by(pod, le)(rate(vllm:request_queue_time_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])))))*1000'
  scale: 1
- metric: num_requests_running
  datasourceMetric: 'sum(vllm:num_requests_running{model_name=~"$MODEL$", pod=~"$POD$"})'
- metric: num_requests_waiting
  datasourceMetric: 'sum(vllm:num_requests_waiting{model_name=~"$MODEL$", pod=~"$POD$"})'
- metric: kv_cache_usage_avg
  datasourceMetric: 'avg(vllm:kv_cache_usage_perc{model_name=~"$MODEL$", pod=~"$POD$"})'
- metric: kv_cache_usage_max
  datasourceMetric: 'max(vllm:kv_cache_usage_perc{model_name=~"$MODEL$", pod=~"$POD$"})'
- metric: preemption_rate
  datasourceMetric: 'sum(rate(vllm:num_preemptions_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))'
- metric: prefix_cache_hit_rate
  datasourceMetric: '100 * sum(rate(vllm:prefix_cache_hits_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:prefix_cache_queries_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1)'
- metric: active_gpus
  datasourceMetric: 'count(kube_pod_status_ready{namespace="moe-tcp", pod=~"$POD$", condition="true"} == 1)'
- metric: active_dp_engines
  datasourceMetric: 'count(count by (pod, engine) (vllm:cache_config_info{pod=~"$POD$"}))'
- metric: input_sequence_length_p95
  datasourceMetric: 'histogram_quantile(0.95, sum by(le)(rate(vllm:request_prompt_tokens_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m])))'
- metric: input_sequence_length_avg
  datasourceMetric: 'sum(rate(vllm:request_prompt_tokens_sum{model_name=~"$MODEL$", pod=~"$POD$"}[5m])) / clamp_min(sum(rate(vllm:request_prompt_tokens_count{model_name=~"$MODEL$", pod=~"$POD$"}[5m])), 1e-9)'
- metric: output_sequence_length_p95
  datasourceMetric: 'histogram_quantile(0.95, sum by(le)(rate(vllm:request_generation_tokens_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m])))'
- metric: output_sequence_length_avg
  datasourceMetric: 'sum(rate(vllm:request_generation_tokens_sum{model_name=~"$MODEL$", pod=~"$POD$"}[5m])) / clamp_min(sum(rate(vllm:request_generation_tokens_count{model_name=~"$MODEL$", pod=~"$POD$"}[5m])), 1e-9)'
- metric: fleet_e2e_latency_percentile
  datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:e2e_request_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m]))))*1000'
  scale: 1
- metric: fleet_inter_token_latency_percentile
  datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m]))))*1000'
  scale: 1
- metric: fleet_request_success_rate
  datasourceMetric: 'sum(rate(vllm:request_success_total{model_name=~"$MODEL$", pod=~"$POD$"}[5m]))'
- metric: fleet_kv_cache_usage_avg
  datasourceMetric: 'avg(vllm:kv_cache_usage_perc{model_name=~"$MODEL$", pod=~"$POD$"})'
- metric: inter_token_latency_p95_5m
  datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m]))))*1000'
  scale: 1
- metric: inter_token_latency_p95_max_per_pod
  datasourceMetric: '(max(histogram_quantile(0.95, sum by(pod, le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m])))))*1000'
  scale: 1
- metric: inter_token_latency_p95_min_per_pod
  datasourceMetric: '(min(histogram_quantile(0.95, sum by(pod, le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[5m])))))*1000'
  scale: 1
- metric: estimated_flops_per_gpu
  datasourceMetric: 'sum(rate(vllm:estimated_flops_per_gpu_total{model_name=~"$MODEL$", pod=~"$POD$"}[1m])) / 1e12'
- metric: estimated_read_bytes_per_gpu
  datasourceMetric: 'sum(rate(vllm:estimated_read_bytes_per_gpu_total{model_name=~"$MODEL$", pod=~"$POD$"}[1m])) / 1e9'
- metric: estimated_write_bytes_per_gpu
  datasourceMetric: 'sum(rate(vllm:estimated_write_bytes_per_gpu_total{model_name=~"$MODEL$", pod=~"$POD$"}[1m])) / 1e9'
- metric: time_to_first_token_p90
  datasourceMetric: '(max(histogram_quantile(0.90, sum by(pod, le)(rate(vllm:time_to_first_token_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])))))*1000'
  scale: 1
- metric: inter_token_latency_p90
  datasourceMetric: '(max(histogram_quantile(0.90, sum by(pod, le)(rate(vllm:inter_token_latency_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])))))*1000'
  scale: 1
- metric: time_per_output_token_p95
  datasourceMetric: '(max(histogram_quantile(0.95, sum by(pod, le)(rate(vllm:request_time_per_output_token_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])))))*1000'
  scale: 1
- metric: time_per_output_token_avg
  datasourceMetric: '(sum(rate(vllm:request_time_per_output_token_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:request_time_per_output_token_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
  scale: 1
- metric: request_prefill_time_p95
  datasourceMetric: '(max(histogram_quantile(0.95, sum by(pod, le)(rate(vllm:request_prefill_time_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])))))*1000'
  scale: 1
- metric: request_decode_time_p95
  datasourceMetric: '(max(histogram_quantile(0.95, sum by(pod, le)(rate(vllm:request_decode_time_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])))))*1000'
  scale: 1
- metric: request_queue_time_avg
  datasourceMetric: '(sum(rate(vllm:request_queue_time_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:request_queue_time_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
  scale: 1
# --- Kubernetes Workload (component vllm_workload)
- metric: k8s_workload_desired_pods
  datasourceMetric: 'sum(kube_statefulset_replicas{namespace="moe-tcp", statefulset=~"$WORKLOAD$"})'
- metric: k8s_workload_running_pods
  datasourceMetric: 'count(kube_pod_status_phase{namespace="moe-tcp", pod=~"$POD$", phase="Running"} == 1) or vector(0)'
- metric: k8s_workload_ready_pods
  datasourceMetric: 'count(kube_pod_status_ready{namespace="moe-tcp", pod=~"$POD$", condition="true"} == 1) or vector(0)'
- metric: k8s_workload_cpu_used
  datasourceMetric: '1000 * sum(rate(container_cpu_usage_seconds_total{namespace="moe-tcp", pod=~"$POD$", container!=""}[2m]))'
- metric: k8s_workload_memory_used
  datasourceMetric: 'sum(container_memory_working_set_bytes{namespace="moe-tcp", pod=~"$POD$", container!=""})'
# --- GPU (components gpu_a, gpu_b): DCGM joined to the node role
- metric: gpu_util
  datasourceMetric: 'avg((DCGM_FI_DEV_GPU_UTIL{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"}))) / 100'
- metric: gpu_sm_active
  datasourceMetric: 'avg((DCGM_FI_PROF_SM_ACTIVE{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_sm_occupancy
  datasourceMetric: 'avg((DCGM_FI_PROF_SM_OCCUPANCY{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_tensor_core_active
  datasourceMetric: 'avg((DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_dram_active
  datasourceMetric: 'avg((DCGM_FI_PROF_DRAM_ACTIVE{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_fb_used
  datasourceMetric: 'sum((DCGM_FI_DEV_FB_USED{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_fb_total
  datasourceMetric: 'sum((DCGM_FI_DEV_FB_USED{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})) + (DCGM_FI_DEV_FB_FREE{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_power_usage
  datasourceMetric: 'max((DCGM_FI_DEV_POWER_USAGE{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_power_limit
  datasourceMetric: 'max((DCGM_FI_DEV_POWER_MGMT_LIMIT{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_temp
  datasourceMetric: 'max((DCGM_FI_DEV_GPU_TEMP{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_memory_temp
  datasourceMetric: 'max((DCGM_FI_DEV_MEMORY_TEMP{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_power_violation_rate
  datasourceMetric: 'max((rate(DCGM_FI_DEV_POWER_VIOLATION{modelName=~"$GPUMODEL$"}[2m]) * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"}))) / 1e9'
- metric: gpu_thermal_violation_rate
  datasourceMetric: 'max((rate(DCGM_FI_DEV_THERMAL_VIOLATION{modelName=~"$GPUMODEL$"}[2m]) * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"}))) / 1e9'
- metric: gpu_pcie_replay_rate
  datasourceMetric: 'max((rate(DCGM_FI_DEV_PCIE_REPLAY_COUNTER{modelName=~"$GPUMODEL$"}[$DURATION$]) * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_fp16_pipe_active
  datasourceMetric: 'avg((DCGM_FI_PROF_PIPE_FP16_ACTIVE{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_fp32_pipe_active
  datasourceMetric: 'avg((DCGM_FI_PROF_PIPE_FP32_ACTIVE{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_fp64_pipe_active
  datasourceMetric: 'avg((DCGM_FI_PROF_PIPE_FP64_ACTIVE{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_sm_clock
  datasourceMetric: 'avg((DCGM_FI_DEV_SM_CLOCK{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_mem_clock
  datasourceMetric: 'avg((DCGM_FI_DEV_MEM_CLOCK{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_total_energy_consumption
  datasourceMetric: 'max((DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_mem_copy_util
  datasourceMetric: 'avg((DCGM_FI_DEV_MEM_COPY_UTIL{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"}))) / 100'
- metric: gpu_enc_util
  datasourceMetric: 'avg((DCGM_FI_DEV_ENC_UTIL{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"}))) / 100'
- metric: gpu_dec_util
  datasourceMetric: 'avg((DCGM_FI_DEV_DEC_UTIL{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"}))) / 100'
- metric: gpu_gr_engine_active
  datasourceMetric: 'avg((DCGM_FI_PROF_GR_ENGINE_ACTIVE{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_xid_errors
  datasourceMetric: 'max((DCGM_FI_DEV_XID_ERRORS{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_uncorrectable_remapped_rows
  datasourceMetric: 'max((DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_correctable_remapped_rows
  datasourceMetric: 'max((DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_row_remap_failure
  datasourceMetric: 'max((DCGM_FI_DEV_ROW_REMAP_FAILURE{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_clock_throttle_reasons
  datasourceMetric: 'max((DCGM_FI_DEV_CLOCK_THROTTLE_REASONS{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_fb_reserved
  datasourceMetric: 'sum((DCGM_FI_DEV_FB_RESERVED{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_fb_used_percent
  datasourceMetric: 'max((DCGM_FI_DEV_FB_USED_PERCENT{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_vgpu_license_status
  datasourceMetric: 'max((DCGM_FI_DEV_VGPU_LICENSE_STATUS{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_pcie_tx_bytes
  datasourceMetric: 'sum((DCGM_FI_PROF_PCIE_TX_BYTES{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_pcie_rx_bytes
  datasourceMetric: 'sum((DCGM_FI_PROF_PCIE_RX_BYTES{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_count
  datasourceMetric: 'max((DCGM_FI_DEV_COUNT{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_fan_speed
  datasourceMetric: 'avg((DCGM_FI_DEV_FAN_SPEED{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"}))) / 100'
- metric: gpu_slowdown_temp
  datasourceMetric: 'max((DCGM_FI_DEV_SLOWDOWN_TEMP{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
- metric: gpu_pstate
  datasourceMetric: 'min((DCGM_FI_DEV_PSTATE{modelName=~"$GPUMODEL$"} * on(hostname) group_left max by(hostname)(study51_node_role{role=~"$ROLE$"})))'
# --- Kubernetes Node (components node_a, node_b): node-exporter joined to the node role
- metric: k8s_node_cpu_util
  datasourceMetric: '1 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m]) * on(instance) group_left(nodename) node_uname_info * on(nodename) group_left() max by(nodename)(study51_node_role{role=~"$ROLE$"}))'
- metric: k8s_node_mem_used
  datasourceMetric: 'sum((node_memory_MemTotal_bytes - node_memory_MemFree_bytes) * on(instance) group_left(nodename) node_uname_info * on(nodename) group_left() max by(nodename)(study51_node_role{role=~"$ROLE$"}))'
- metric: k8s_node_mem_used_nocache
  datasourceMetric: 'sum((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) * on(instance) group_left(nodename) node_uname_info * on(nodename) group_left() max by(nodename)(study51_node_role{role=~"$ROLE$"}))'
- metric: k8s_node_network_in_bytes
