# dcgm-exporter Helm values as deployed (helm get values, revision 27, chart 4.8.3) plus study 51.
# Study 51 only adds llm-serving-g7e-4xl-tcp to the node-role list, so its two nodes get a
# dcgm-exporter pod (study 50's llm-serving-g7e-8xl-efa stays, as revision 27 left it). Applied once before the study:
#   helm -n monitoring upgrade dcgm-exporter gpu-helm-charts/dcgm-exporter --version 4.8.3 \
#     -f k8s/monitoring/dcgm-exporter-values.yaml
# The series carry `hostname` = node name: the telemetry joins them to study51_node_role on it.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role
          operator: In
          values:
          - llm-serving-l4
          - llm-serving-g7-4500
          - llm-serving-l40s-1xl
          - llm-serving-g7e-2xl
          - llm-serving-g7e-4xl
          - llm-serving-g7e-8xl-efa
          - llm-serving-g7e-4xl-tcp
extraConfigMapVolumes:
- configMap:
    items:
    - key: metrics
      path: dcgm_counters.csv
    name: dcgm-custom-metrics
  name: exporter-metrics-volume
extraVolumeMounts:
- mountPath: /etc/dcgm-exporter/default-counters.csv
  name: exporter-metrics-volume
  subPath: dcgm_counters.csv
serviceMonitor:
  enabled: true
  interval: 5s
  namespace: monitoring
  scrapeTimeout: 4s
tolerations:
- effect: NoSchedule
  key: nvidia.com/gpu
  operator: Exists
- effect: NoSchedule
  key: akamas.io/gpu-sharing
  operator: Exists
# Study 46: map metrics to pods for GPUs/MIG slices allocated through DRA ResourceClaims
# (the pod-resources API reports DRA devices separately from device-plugin ones). Without
# it, the g7e node's MIG series carry no pod label. Device-plugin nodes are unaffected.
extraEnv:
- name: KUBERNETES_ENABLE_DRA
  value: "true"
