kind: workflow
name: 52-G7E-GLM53-Coding-Workflow
# Four tasks, all on the akamas-41 toolbox (study copied to /work/study52 with tar, as 45-51):
#   Write config  render params.env from the experiment's parameters
#   Apply config  wait for the spot GPU node (a reclaimed one is replaced by its ASG), re-create the
#                 vLLM Deployment with the rendered VLLM_ADDITIONAL_ARGS (the checkpoint is
#                 re-downloaded on a new node), wait for it, prove on the running pod the
#                 arguments and cache_config_info; vLLM logs dumped to stdout, and on a failed start
#                 the log line that explains it
#   Ramp          levels 4-64 coding sessions (workload.env), one fresh 17 min AIPerf run each on
#                 two clients, judged on client TTFT p95 <= 5 s and ITL p95 <= 50 ms; stops at the
#                 first failing level; writes level.current
#   Hold          the chosen level re-run fresh for 18 min; the study windows on this task
# Every load prints its client-side RESULT (with the worst session's TTFT p95), per-minute TTFT,
# vLLM counters (prefix cache, offload, MTP) and the AIPerf log tails.
tasks:
  # ignoreUnsubstitutedTokens false on purpose: every token must resolve.
  - name: Write config
    operator: FileConfigurator
    arguments:
      ignoreUnsubstitutedTokens: false
      source:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/study52/52-g7e-glm53-coding-sessions-within-slo/k8s/params.env.template
      target:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/study52/52-g7e-glm53-coding-sessions-within-slo/k8s/params.env
  - name: Apply config
    operator: Executor
    arguments:
      retries: 0
      # Above apply_config.sh's own waits (1800 s spot node + 4800 s vLLM start incl. the 328 GB
      # download on a new node + 2 x 600 s AIPerf clients), so its log dump always runs.
      timeout: 140m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study52/52-g7e-glm53-coding-sessions-within-slo/k8s/apply_config.sh
  - name: Ramp
    operator: Executor
    arguments:
      retries: 0
      # 8 levels x (960 s load + 60 s grace + AIPerf start-up, dataset generation and parsing ~90 s)
      # = ~148 min.
      timeout: 180m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study52/52-g7e-glm53-coding-sessions-within-slo/k8s/run_ramp.sh
  - name: Hold
    operator: Executor
    arguments:
      retries: 0
      # 1080 s load + 60 s grace + start-up, parsing and log dump.
      timeout: 30m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study52/52-g7e-glm53-coding-sessions-within-slo/k8s/run_hold.sh
