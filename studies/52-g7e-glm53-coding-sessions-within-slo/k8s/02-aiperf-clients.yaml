# Study 52 load generator (from study 51): two long-lived AIPerf client pods on the m8a-2xlarge load
# node, each driving half of the sessions of a level against the vLLM Service. 100k-token prompts
# make client-side work heavier than in studies 48 and 51 (prompt generation, history, token
# counting), hence a node of their own. The runs are started by lib_load.sh with kubectl exec.
# Results stay in the pod's /work (emptyDir) and are deleted after every level: no PVC to fill up
# (study 41's lesson); the scripts print what they need to stdout.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: aiperf-client, namespace: glm53-coding}
spec:
  serviceName: aiperf-client
  replicas: 2
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: aiperf-client}}
  template:
    metadata: {labels: {app: aiperf-client}}
    spec:
      nodeSelector: {node-role: m8a-2xlarge}
      tolerations: [{key: dedicated, operator: Equal, value: m8a-2xlarge, effect: NoSchedule}]
      terminationGracePeriodSeconds: 5
      containers:
      - name: aiperf
        image: python:3.12-slim
        workingDir: /work
        command: ["sh", "-c"]
        args:
        - |
          set -e
          pip install --quiet aiperf==0.11.0
          # The tokenizer at the checkpoint's pinned revision (AIPerf has no revision flag), passed
          # to --tokenizer as a local path (final review I6).
          hf download zai-org/GLM-5.3-Flash --revision 46a050bec13002ad29ee795c16e61cf4fa3c4a9c --include 'tokenizer*' 'config.json' 'chat_template*' 'generation_config.json' --local-dir /work/tokenizer
          touch /work/ready
          exec sleep infinity
        readinessProbe: {exec: {command: [test, -f, /work/ready]}, periodSeconds: 5}
        env:
        - {name: AIPERF_TIMING_RATE_RAMP_UPDATE_INTERVAL, value: "10"}
        resources:
          requests: {cpu: "3", memory: 8Gi}
          limits: {cpu: 3500m, memory: 13Gi}
        volumeMounts: [{name: work, mountPath: /work}]
      volumes: [{name: work, emptyDir: {sizeLimit: 8Gi}}]
