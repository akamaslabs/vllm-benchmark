affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role
          operator: In
          values:
          - llm-serving-l4
          - llm-serving-g7-4500
          - llm-serving-l40s-1xl
          - llm-serving-g7e-2xl
          - llm-serving-g7e-4xl
          - llm-serving-g7e-8xl-efa
          - llm-serving-g7e-4xl-tcp
          - llm-serving-g7e-12xl
          - llm-serving-g7e-24xl-spot
extraConfigMapVolumes:
- configMap:
    items:
    - key: metrics
      path: dcgm_counters.csv
    name: dcgm-custom-metrics
  name: exporter-metrics-volume
extraEnv:
- name: KUBERNETES_ENABLE_DRA
  value: 'true'
extraVolumeMounts:
- mountPath: /etc/dcgm-exporter/default-counters.csv
  name: exporter-metrics-volume
  subPath: dcgm_counters.csv
serviceMonitor:
  enabled: true
  interval: 5s
  namespace: monitoring
  scrapeTimeout: 4s
tolerations:
- effect: NoSchedule
  key: nvidia.com/gpu
  operator: Exists
- effect: NoSchedule
  key: akamas.io/gpu-sharing
  operator: Exists
