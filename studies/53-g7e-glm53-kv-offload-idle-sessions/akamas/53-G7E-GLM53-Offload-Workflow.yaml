kind: workflow
name: 53-G7E-GLM53-Offload-Workflow
# Three tasks, all on the akamas-41 toolbox (study copied to /work/study53 with tar, as 45-52):
#   Write config  render params.env from the experiment's parameters
#   Apply config  wait for the spot GPU node (a reclaimed one is replaced by its ASG), re-create the
#                 vLLM Deployment with the rendered VLLM_ADDITIONAL_ARGS (the checkpoint is
#                 re-downloaded on a new node), wait for it, prove on the running pod the
#                 arguments and cache_config_info; vLLM logs dumped to stdout, and on a failed start
#                 the log line that explains it (study 52's apply_config.sh)
#   Load          one fixed load: 40 long, mostly idle coding sessions for 1500 s on two AIPerf
#                 clients (workload.env); prints the client RESULT, first turns apart from resumed
#                 turns (TURNS), TTFT per minute and per 5 minutes, vLLM counters (prefix cache,
#                 offload, MTP) and the AIPerf log tails. The study windows on this task.
tasks:
  # ignoreUnsubstitutedTokens false on purpose: every token must resolve.
  - name: Write config
    operator: FileConfigurator
    arguments:
      ignoreUnsubstitutedTokens: false
      source:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/study53/53-g7e-glm53-kv-offload-idle-sessions/k8s/params.env.template
      target:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/study53/53-g7e-glm53-kv-offload-idle-sessions/k8s/params.env
  - name: Apply config
    operator: Executor
    arguments:
      retries: 0
      # Above apply_config.sh's own waits (1800 s spot node + 4800 s vLLM start incl. the 191 GB
      # download on a new node + 2 x 600 s AIPerf clients), so its log dump always runs. A normal
      # start takes ~4 min (warm JIT caches on the node).
      timeout: 140m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study53/53-g7e-glm53-kv-offload-idle-sessions/k8s/apply_config.sh
  - name: Load
    operator: Executor
    arguments:
      retries: 0
      # 1500 s load + up to 60 s grace + start-up (~5 s), parsing and log dump.
      timeout: 40m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study53/53-g7e-glm53-kv-offload-idle-sessions/k8s/run_load.sh
