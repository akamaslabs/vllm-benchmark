kind: workflow
name: 54-G7E-GLM53-TraceLab-Workflow
# Five tasks, all on the akamas-41 toolbox (study copied to /work/study54 with tar, as 45-53; the pools
# staged in /work/study54-load by load/prepare_load.sh):
#   Write config   render params.env from the experiment's parameters
#   Apply config   study 53's apply (wait for the spot node, re-create the vLLM Deployment with the
#                  rendered VLLM_ADDITIONAL_ARGS, prove the arguments and cache_config_info on the pod)
#                  plus the LMCache preset's server; vLLM logs dumped to stdout
#   RunTest        the TraceLab ramp on both AIPerf clients (users 1 -> USERS_PER_CLIENT per client over
#                  RAMP_S, k8s/workload.env), ended by the watchdog past the knee (server TTFT p95 > 10 s
#                  for 120 s); AIPerf log tails printed, the vLLM log on failure
#   Stop AIPerf    SIGINT both replays, save their per-request records on the toolbox (alwaysRun: the
#                  load always stops; critical false)
#   AIPerf to CSV  records -> /work/aiperf-csv/study54/<run>.csv (cut at the knee) for the CSV File
#                  telemetry; prints the knee and the offline score estimate (critical: no CSV, no score)
# Once this workflow is created, a change means delete and recreate (Akamas 4.1 has no update).
# All tasks run on the toolbox host over SSH with the toolbox's own key (/home/akamas/.ssh/id_rsa,
# mounted from the toolbox-keys secret; the path must exist on the toolbox when `akamas create
# workflow` runs, so run it from the toolbox).
tasks:
  # ignoreUnsubstitutedTokens false on purpose: every token must resolve.
  - name: Write config
    operator: FileConfigurator
    arguments:
      ignoreUnsubstitutedTokens: false
      source:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/study54/54-g7e-glm53-tracelab-users-offload/k8s/params.env.template
      target:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
        path: /work/study54/54-g7e-glm53-tracelab-users-offload/k8s/params.env
  - name: Apply config
    operator: Executor
    arguments:
      retries: 0
      # Above apply_config.sh's own waits (1800 s spot node + 4800 s vLLM start incl. the 191 GB
      # download on a new node + 2 x 600 s AIPerf clients), so its log dump always runs. A normal start
      # takes ~4-8 min (warm JIT caches on the node; LMCache adds its pip install and server start).
      timeout: 140m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study54/54-g7e-glm53-tracelab-users-offload/k8s/apply_config.sh
  - name: RunTest
    operator: Executor
    arguments:
      retries: 0
      # Above run_test.sh's own deadline (RAMP_S + DEADLINE_EXTRA_S = 4200 + 900 s = 85 min), so its log
      # dump always runs. Raise it with RAMP_S.
      timeout: 100m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study54/54-g7e-glm53-tracelab-users-offload/k8s/run_test.sh
  - name: Stop AIPerf
    operator: Executor
    alwaysRun: true
    critical: false
    arguments:
      retries: 0
      # Up to 300 s per client for AIPerf to exit after its SIGINT, then the copies (tens of MB).
      timeout: 20m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study54/54-g7e-glm53-tracelab-users-offload/k8s/stop_aiperf.sh
  - name: AIPerf to CSV
    operator: Executor
    arguments:
      retries: 0
      timeout: 10m
      host:
        hostname: toolbox
        username: akamas
        key: /home/akamas/.ssh/id_rsa
      command: bash /work/study54/54-g7e-glm53-tracelab-users-offload/k8s/aiperf_csv.sh
