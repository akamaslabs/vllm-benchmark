# CSV File telemetry for 54-g7e-glm53-tracelab-users-offload: the client-side metrics of the aiperf
# component (AIPerf optimization pack 1.0.0), study 38's instance renamed. The workflow's "AIPerf to
# CSV" task (../k8s/aiperf_csv.sh) writes one CSV per run on the toolbox, /work/aiperf-csv/study54/<run>.csv
# (CSV_DIR in ../k8s/workload.env), with aiperf_to_csv.py: TS = the end of a 30 s bucket in UTC
# (yyyy-MM-dd HH:mm:ss), COMPONENT = aiperf, then one column per pack metric, named as the metric. The
# file ends before the first sustained SLO breach (the knee), so no window after it can be scored. The
# provider reads every file of the pattern and keeps the rows inside the trial's window, so earlier
# runs' files do no harm. Read over SCP from the toolbox with the toolbox's own key (the workflow's
# host and key; the path must exist on the toolbox when `akamas create telemetry-instance` runs).
# Open (AIPerf pack README, "Known limits"): the provider's time zone for a zoneless timestampFormat and
# its handling of an empty cell: check the first trial's samples against its window (Task 7 of the plan).
kind: telemetry-instance
system: vLLM_Benchmark_54_G7E_GLM53_TraceLab
name: AIPerf_CSV_54_G7E_GLM53_TraceLab
provider: CSV File
config:
  hostname: toolbox
  username: akamas
  key: /home/akamas/.ssh/id_rsa
  protocol: scp
  remoteFilePattern: /work/aiperf-csv/study54/*.csv
  componentColumn: COMPONENT
  timestampColumn: TS
  timestampFormat: yyyy-MM-dd HH:mm:ss
metrics:
  - metric: aiperf_request_success_rate
    datasourceMetric: aiperf_request_success_rate
  - metric: aiperf_request_error_rate
    datasourceMetric: aiperf_request_error_rate
  - metric: aiperf_output_token_throughput
    datasourceMetric: aiperf_output_token_throughput
  - metric: aiperf_e2e_request_latency_avg
    datasourceMetric: aiperf_e2e_request_latency_avg
  - metric: aiperf_e2e_request_latency_p50
    datasourceMetric: aiperf_e2e_request_latency_p50
  - metric: aiperf_e2e_request_latency_p95
    datasourceMetric: aiperf_e2e_request_latency_p95
  - metric: aiperf_e2e_request_latency_p99
    datasourceMetric: aiperf_e2e_request_latency_p99
  - metric: aiperf_e2e_request_latency_p50_150s
    datasourceMetric: aiperf_e2e_request_latency_p50_150s
  - metric: aiperf_e2e_request_latency_p95_150s
    datasourceMetric: aiperf_e2e_request_latency_p95_150s
  - metric: aiperf_e2e_request_latency_p99_150s
    datasourceMetric: aiperf_e2e_request_latency_p99_150s
  - metric: aiperf_time_to_first_token_avg
    datasourceMetric: aiperf_time_to_first_token_avg
  - metric: aiperf_time_to_first_token_p50
    datasourceMetric: aiperf_time_to_first_token_p50
  - metric: aiperf_time_to_first_token_p95
    datasourceMetric: aiperf_time_to_first_token_p95
  - metric: aiperf_time_to_first_token_p50_150s
    datasourceMetric: aiperf_time_to_first_token_p50_150s
  - metric: aiperf_time_to_first_token_p95_150s
