  - metric: aiperf_time_to_first_output_token_avg
    datasourceMetric: aiperf_time_to_first_output_token_avg
  - metric: aiperf_time_to_first_output_token_p50
    datasourceMetric: aiperf_time_to_first_output_token_p50
  - metric: aiperf_time_to_first_output_token_p95
    datasourceMetric: aiperf_time_to_first_output_token_p95
