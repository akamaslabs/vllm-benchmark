# Study 54 load generator (study 53's StatefulSet, from 52 and 51: the same pods in the same namespace),
# AIPerf pinned to 0.13.0 (the tracelab loader). Two long-lived client pods on the m8a-2xlarge load
# node; run_test.sh starts one detached replay per pod (client_run.sh, copied into /tmp with the pool
# and the system prompt) and stop_aiperf.sh stops it. Each replay keeps its run, the dataset mmap and
# the content-addressed dataset cache under /tmp/a13 on the container's own disk (the first build of a
# 600-session pool holds ~16 GiB, twice the 8 GiB /work emptyDir; ~43 GiB free on the node for both
# pods): a pod restart loses the cache, and the next run rebuilds it (~200 s, AIPerf's own start-up).
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: aiperf-client, namespace: glm53-coding}
spec:
  serviceName: aiperf-client
  replicas: 2
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: aiperf-client}}
  template:
    metadata: {labels: {app: aiperf-client}}
    spec:
      nodeSelector: {node-role: m8a-2xlarge}
      tolerations: [{key: dedicated, operator: Equal, value: m8a-2xlarge, effect: NoSchedule}]
      terminationGracePeriodSeconds: 5
      containers:
      - name: aiperf
        image: python:3.12-slim
        workingDir: /work
        command: ["sh", "-c"]
        args:
        - |
          set -e
          pip install --quiet aiperf==0.13.0
          # curl for download_checkpoint.sh (python:3.12-slim has none).
          apt-get update -qq && apt-get install -y --no-install-recommends curl > /dev/null
          # The tokenizer at the checkpoint's pinned revision (AIPerf has no revision flag), passed to
          # --tokenizer as a local path (final review I6). Fetched with download_checkpoint.sh: hf 2.x took
          # the names after --include as explicit files and skipped tokenizer.json (smoke 2026-11-18).
          INCLUDE='^(tokenizer.*|config\.json|chat_template.*|generation_config\.json)$' bash /scripts/download_checkpoint.sh canada-quant/GLM-5.3-Flash-W4A16-MTP 5681f7c2dc6436d63f82ab6fb892b4f5062b8304 /work/tokenizer
          touch /work/ready
          exec sleep infinity
        readinessProbe: {exec: {command: [test, -f, /work/ready]}, periodSeconds: 5}
        env:
        - {name: AIPERF_TIMING_RATE_RAMP_UPDATE_INTERVAL, value: "10"}
        - {name: HF_TOKEN, valueFrom: {secretKeyRef: {name: hf-token, key: token, optional: true}}}
        resources:
          requests: {cpu: "3", memory: 8Gi}
          limits: {cpu: 3500m, memory: 13Gi}
        volumeMounts: [{name: work, mountPath: /work}, {name: scripts, mountPath: /scripts}]
      volumes:
      - {name: work, emptyDir: {sizeLimit: 8Gi}}
      - {name: scripts, configMap: {name: download-checkpoint}}
